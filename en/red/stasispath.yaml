  F35:
    cita: 'Xue et al. 2024, Cell Rep Methods (MEDY). **FULL PDF READ (batch 46).** Cryopreservation method **MEDY = methylcellulose + ethylene glycol + DMSO + Y-27632** (ROCK inhibitor) for **human cortical organoids and living human brain tissue**. It preserves neural cytoarchitecture and **functional activity**; it is applied to dorsal and ventral forebrain organoids, spinal cord, optic vesicle and **patient-derived epilepsy organoids**, which **keep their pathological features after thawing**. The transcriptome shows protection of synaptic function and inhibition of endoplasmic-reticulum-mediated apoptosis. **It is slow freezing with dilute CPA (10 % DMSO + 10 % EG), NOT vitrification**: the scale at which it works is that of organoid and biopsy, not of organ'
