afirmaciones:
  O1:
    capa: ontologia
    e: V
    deps:
    - F14
    - F15
    t: Stasis = **demonstrably reversible** preservation. Informational preservation (ASC, cryonics) = another programme (E0). Only the first is a clinical or space residual.
  O2:
    capa: ontologia
    e: V
    deps:
    - F27
    - C7
    t: 'Legal death is **permanence** (will not be resuscitated), declared at {legal_obs} min without circulation (≤ 5 mmHg). Physical irreversibility is another axis: the cell remains recoverable at ≥ {tau_cel} min.'
  O3:
    capa: ontologia
    e: M
    deps:
    - F1
    - F28
    - F29
    - F23
    t: 'Success scale: E0 structure · E1 cell · E2 tissue or memory in a simple organism · E3 transplanted organ · E4 whole animal · E5 human with memory.'
  G1:
    capa: magnitud
    e: V
    deps:
    - C2
    - C7
    t: '**τ_eq** = ∫Q10^((T−37)/10)dt. Organism after cardiac arrest, reproducible good outcome: τ_org ≤ {C7.tau_org_good} min; survives with deficit: {C7.tau_org_surv} min. **Existence (n = 1, brain-only ischemia):** {tau_org_exist} min with integrative function recovered. Cell: ≥ {C7.tau_cel} min.'
  G2:
    capa: magnitud
    e: V
    deps:
    - F2
    - F11
    - F32
    - F35
    t: '**f_ice,intra** = 0 (mandatory). **f_ice,extra** > 0 tolerable only with controlled cryoprotectant and nucleation (frog in the field: {frog_days} days; rat liver: 10 days; human brain tissue and 2–3 mm organoids by MEDY slow freezing: 1.5 years with partial network activity).'
  G2b:
    capa: magnitud
    e: V
    deps:
    - F11
    - F32
    t: '**Tolerance depends on the entry protocol, not only on the tissue:** the same Alaskan frog withstands {frog_days} days frozen in the field, but in the laboratory dies 4/4 after 12 weeks at −4 °C (2/4 after 8 weeks). In the field it accumulates glucose (liver ~194 µmol/g) and urea (~106 µmol/mL) through freeze–thaw cycles. ⇒ For StasisPath, the loading of the cryoprotectant (time, cycles, temperature) is a state variable, not a detail.'
  G6:
    capa: magnitud
    e: V
    deps:
    - F34
    t: 'Reference for the control arm of P15: MICrONS (1 mm³ of fixed mouse cortex, ~200,000 cells, ~523 M synapses). Even in the control, automatic segmentation needs human correction ⇒ traceability must be normalized to a control from the same laboratory (as P15 already requires). **It provides no data on the cryogenic arm: P15 remains open.**'
  G3:
    capa: magnitud
    e: V
    deps:
    - F2
    - F59
    - F68
    t: '**ΔT_glass** < {dT_crack} K so as not to crack (verified up to 3 L with annealing). **Second variable, measured in a neighbouring field (F59):** cracking depends strongly on the **Tg of the solution** — the higher the Tg, the less accumulated stress (4 chemistries with > 50 °C range, cryomacroscope + finite elements). ⇒ Tg ceases to be a passive datum and becomes a **design variable**: choose the CPA by Tg, not only by CCR and toxicity. **Third and fourth variables (F68, thermomechanical model of bags):** the **shape** of the container (maximum stress does NOT appear with the bag filled to the maximum, and the width/length ratio weighs heavily) and the **initial warming rate between storage and Tg**, whose reduction lowers stress drastically. Nanowarming also reduces it. ⇒ Cracking now has **four measured levers**: ΔT, Tg, geometry and rewarming profile.'
  G4:
    capa: magnitud
    e: V
    deps:
    - F26
    - C8
    - F55
    - F39
    - F40
    t: '**D_CPA = ∫ f(qv*) · g(T) · C(t) dt — form of the law closed, universal threshold nonexistent (and why is explained).** The three dependencies are now measured: **composition** via qv* (F26, 20 solutions) · **temperature** (F55: PROH 1.5 M degenerates 54.2 % of oocytes at 23 °C and **85 % at 37 °C**, same concentration and same time; F39: M22 9.3 M is tolerable at −22 °C with washout on warming) · **concentration and time** (F55: lowering PROH from 1.5 to 0.75 M combined with DMSO eliminates toxicity). **There is no universal threshold because D_CPA is not a property of the CPA but of the quadruple (composition, T, t, protocol)** — which is exactly what E7 demonstrates. Operational acceptance criterion: G4b.'
  L14:
    capa: ley
    e: V
    deps:
    - G7
    - C11
    - F53
    - F66
    t: '**Cooling-rate conflict between two of our own routes (detected on closing G7).** Cold injury is reduced by **crossing the 0–20 °C band quickly**, but controlled **extracellular** ice demands cooling **slowly** (0.1–1 °C/min) for the cell to dehydrate. The two routes that promised most (supercooling V05/V18 and partial freezing V06) pass obligatorily through that band. ⇒ **The optimal protocol is not monotonic: fast from 20 to 0 °C and slow below.** It is a new prediction of the framework, not copied from any source.'
  L15:
    capa: ley
    e: V
    deps:
    - F58
    - L2
    - C2
    t: '**The domain of C2 is confirmed with a mammal, not only with ectotherms.** The **euthermic** arctic ground squirrel (37 °C, not hibernating) withstands 8 min of cardiac arrest with neuronal count indistinguishable from control at 7 days, whereas control rats are indeed injured (F58). ⇒ The tolerance does not come from cold or from being in torpor: it is **species biochemistry**. It confirms the restriction that L2 already declared (''mammalian tissue **without biochemical reprogramming**'') and demonstrates that this reprogramming **exists in a mammal** and is, in principle, transferable: it is the best concrete target for extending τ_eq in humans.'
  L13:
    capa: ley
    e: V
    deps:
    - F71
    - F46
    - F37b
    t: '**CPA composition, not the physics of vitrification, decides the functional outcome — and in the only case with measured LTP, LTP is preserved.** **CLOSED in batch 48 by a datum already present but uncrossed (pattern C10/L11) + an unnecessary dependency (pattern 4).** The earlier version took the ''61 % EG alone'' row from preprint F52 and the M22 row from preprint F47, and for that reason the law stayed at [P]. But **the comparison was already inside a [V] source of the network and nobody had crossed it:** the supplementary information of the PNAS paper itself (F71, PDF read) says that in the SAME work, same tissue and same protocol, they tested **V3, EG at 61 % alone and EG 37.5 % + DMSO 12.5 %, and that V3 gave the best functional recovery**. Series with the three strong dependencies: **V3** (DMSO 2.85 M + EG 2.71 M + formamide 2.86 M = 8.42 M, 59 % w/v, loaded at 10 °C) → **LTP preserved** (F46) and best functional recovery of the three chemistries tested (F71) · **EG 61 % alone** and **EG+DMSO** → worse functional recovery in the same work (F71) · **VM3** → K⁺/Na⁺ 91–108 %, LTP not measured (F37b). ⇒ At equal concentration and protocol, **changing the composition changes the functional outcome**. **What is claimed and what is not (R4, claim box):** the verdict is that composition governs; it is NOT claimed that LTP was measured in every row, because only V3 has it measured. **Corroboration that does NOT hold up the verdict, and for that reason is no longer in `deps`:** F52 [P, preprint] gives the finer version of the 61 % EG row (fEPSPs recovered but **unstable** potentiation, with swelling and vacuolization) and F47 [P, preprint] adds the M22 row (structure only, function not measured). Both are consistent and neither is necessary: the F47 row is an **absence of datum**, which cannot be the evidentiary basis of anything, and the F52 one is covered by F71 with a published source. Where F47 does serve as support is in X2, which keeps it in `deps` and remains [A]. **Declared leak:** F71 says ''better functional recovery'', which is vaguer than F52''s ''unstable potentiation''; if F52 were ever published, the 61 % EG row would gain precision, but the verdict would not change. And it remains **a single scale** (mouse hippocampal slice): none of this establishes scale, which is exactly what X2 keeps open.'
    cierra: 'closed in batch 48: F71 [V] contains the comparison that was being taken from F52; F47 only contributed an absence of datum'
  X2:
    capa: frontera
    e: A
    deps:
    - L13
    - L12
    - F47
    - F46
    - F65
    t: '**Chemical compatibility frontier. PRECEDENT: it is not a finding of ours** — Fahy formalized it in 2004 as the **viability–stability plot** (F65), viability by K⁺/Na⁺ against mWCR, with 14 solutions. What StasisPath contributes is its 2026 version, with functional (LTP) and scale data that did not exist then. Current statement: the only chemistry with demonstrated **function** (V3) requires ~147 °C/min and therefore does not go beyond mouse scale; the only one with demonstrated **scale** (M22, CCR 0.1) has only structure. **There is no point with function and scale at once.** This empty cell is the real bottleneck of the physical route, and it is closed or refuted with P19.'
    cierra: '[laboratory] calorimetry (DSC) of the eutectic-solvent CCR; if ≤ 0.426 it closes without P19. Alternative: run P19'
  G8:
    capa: magnitud
    e: V
    deps:
    - F46
    - F37b
    t: '**Functional criterion for information (E2 with memory):** LTP is the cellular machinery of learning and it is preserved after vitrifying adult mouse hippocampus: 138.1 ± 6.9 % versus 157.7 ± 7.1 % of control in CA1 (P = 0.072, n.s.) and 148.0 ± 7.2 % versus 125.0 ± 5.0 % in the dentate gyrus (P = 0.021). ⇒ **Vitrification does not erase the substrate of synaptic plasticity in adult mammalian tissue.** It does not demonstrate retention of a specific memory: that requires behaviour.'
  L12:
    capa: ley
    e: V
    deps:
    - F46
    - C2
    t: '**The glassy state halts molecular mobility and is nevertheless reversible in adult neural tissue** (German 2026): it widens the biophysical limit of cerebral hypothermic shutdown. It is the first direct confirmation of the assumption of L2 (below Tg chemistry stops) **with measured functional recovery**, not only structural.'
  G5:
    capa: magnitud
    e: V
    deps:
    - F7
    - F14
    - F56
    t: '**I_structure — a metric taken from the field of connectomics, which has standardized it.** The correct magnitude is not ''% of visible synapses'' but **ERL (expected run length): mean length of neurite reconstructed without error**, which penalizes splits and mergers. State-of-the-art reference in ideal fixed tissue: **~1.1 mm** (F56 [P]). It is the first time the magnitude has a unit (µm of neurite) and a control value external to StasisPath, instead of an invented percentage. Preregistered in P20; **P15 remains intact with its original threshold (R2)**. Our own datum remains open: ERL of unfixed cryopreserved tissue versus control (no laboratory has published it).'
  L1:
    capa: ley
    e: M
    deps:
    - C1
    t: 'Surface rewarming is only possible below r* ≈ {C1.rstar_M22} cm with M22 and {C1.rstar_VMP} cm with VMP. Above that, volumetric heating (nanowarming: {nano_rate} °C/min in 2 L, volume-independent) is mandatory.'
  L2:
    capa: ley
    e: V
    deps:
    - C2
    - F4
    t: 'Without phase change, passive suppression gives minutes or hours. **Corrected with the full text of F4:** extrapolating with a single Q10 is improper, because the paper itself measures **2.05 between 37 and 15 °C and 3.5 between 15 and 11 °C** (and cites 4.54 in dog). Depending on the Q10 used, 10 years require between **−55 and −156 °C**: the {C2.T10y} °C figure we had been giving came from extrapolating the temperate Q10 far outside its measured range. **What is robust is ''far below 0 °C'', not a specific figure.** Domain: mammalian tissue without biochemical reprogramming.'
  L18:
    capa: ley
    e: V
    deps:
    - C2
    - F4
    - G2
    t: '**The glass is not required by the metabolic argument, it is required by the ice.** On correcting L2 it becomes clear that metabolic suppression alone asks only for ''below zero'' (between −55 and −156 °C depending on Q10). What obliges one to vitrify or to control ice is **G2** (f_ice,intra = 0), which is an independent and stronger argument. ⇒ The two arguments were intertwined in the framework and are now **separated**: metabolism sets *how cold*, ice sets *in what state*.'
  L3:
    capa: ley
    e: M
    deps:
    - C3
    t: 'Cooling by surface limits vitrification: LC* ≈ {C3.LCstar_M22} cm with M22 and {C3.LCstar_VMP} cm with VMP. VMP does not vitrify a human kidney; the trunk with M22 is {C3.trunk_verdict}.'
  L4:
    capa: ley
    e: M
    deps:
    - C4
    t: Ectotherms need ×{C4.frog} (frog) and ×{C4.turtle} (turtle) of non-thermal suppression; ×{C4.turtle22} even at 22 °C ⇒ the exit is biochemical, not thermal.
  L37:
    capa: ley
    e: V
    deps:
    - F82
    t: '**Nanowarming can be uniform at body scale for a physical reason that MRI does not have: it is in the quasi-static regime.** At 360 kHz the wavelength in tissue is **metres**, so a 40 cm body measures a **minimal fraction of a wavelength**: the field cannot form interference nulls. In MRI the wavelength falls to **29.3 cm at 3 T and 12.5 cm at 7 T** (computed with λ = c/(f√εr), εr = 64 from F82c), the body measures **1.37 and 3.20** wavelengths, and for that reason nulls appear that force multichannel arrays. **F82b confirms it with in vivo measurement** in 10 volunteers and maps of 82 subjects: the inhomogeneities ''result from radiofrequency interference and dielectric resonances'' at 300 MHz, and degrade the image above all in the **eccentric infratentorial regions**. ⇒ **The uniformity of nanowarming is a geometric problem (coil and container shape), not a wave problem.** **Batch 55 — the remaining gap is closed by DEMONSTRATED IRRELEVANCE, not by finding the source.** The permittivity of tissue at 360 kHz remains **without a source in the network**, and for that reason the figure ''λ ≈ 8.3 m'' that this law previously claimed **is withdrawn**: it required εr ≈ 1.0e4, which nobody here supports. But the **verdict** does not depend on it: breaking the quasi-static regime would require **εr ≥ 4.34e6**, that is **×434** the assumed value, and the α dispersion of tissue at that frequency comes nowhere near. With εr between 64 and 1e5 the body measures between **0.004 and 0.15** wavelengths: quasi-static across the whole range. **Declared leak:** what is sustained is the regime, **not the figure**. Calculation in es/20_cotas/cota_L37_cuasiestatico.py.'
    cierra: 'closed in batch 55: F82 against primaries, and the quasi-static verdict is robust to εr by a factor of ×434'
  L38:
    capa: ley
    e: V
    deps:
    - F84
    - C3
    t: '**The rate that geometry imposes on us coincides with the one cryogenic engineering considers safe.** The industrial limit for cooling large tanks without structural damage is **< 9 °C/h = {limite_LNG} °C/min** (F84 — Wang et al. 2025, Energy 334:137568; standard EN 14620-5). C3 predicts for an entire human body (LC {LC_body} cm) **{C3.rate_body} °C/min**. The coincidence is exact: thermal conduction imposes on a 70 kg body the same rate that industry has used for decades so as not to burst cryogenic steel structures. ⇒ The meaning is no accident: **the pace that conduction forces is precisely the one that another field, with decades of experience in large structures, considers thermally safe.** It reinforces that the bottleneck at body scale is not thermal stress but the CCR of the CPA. **F84 now [V]: Wang et al. 2025 read in full (peer-reviewed, Elsevier Energy).'
  L39:
    capa: ley
    e: V
    deps:
    - F83
    - L36
    - L27
    - G1
    t: '**The four mechanisms of ischemic tolerance in the framework converge in one system, and it is human: the fetus.** Facing asphyxia, the **neonate** lowers body temperature 4–8 °C (hypoxic torpor; in the fetus *in utero* it does not fall — it is clamped to the mother), redistributes circulation like a diving mammal (bradycardia 25–60 %, cerebral vasodilation by adenosine), enters hypoxic hypometabolism (VO₂ falls 30–50 %) and shows cerebral vulnerability comparable to that of the turtle brain (Singer 1999). Anoxic tolerance figures (neonate vs adult): rat **40–50 min vs 1.5–3 min** (×20–30); dog **20–30 min vs 3–5 min** (×5–8). Ontogenic gradient: early fetus ~25 min → term fetus ~10 min → adult ~2 min — tolerance is lost in a programmed manner, not that it never existed. ⇒ **The mechanisms we catalogued in ground squirrel (L27), seal (L36) and turtle are not exotic: they are present in human physiology, only regulated by development.** It is the programme''s best lead on whether human τ_eq can be extended. **F83 and L36 now [V] (read 2026-09-27).**'
  L34:
    capa: ley
    e: V
    deps:
    - F79
    - C3
    - L3
    t: '**The riskiest extrapolation of the framework is validated against the meat industry.** C3 was anchored on a **3 L** bag and extrapolated to human-body scale, a ×50 jump in mass that had never been checked. The food industry has spent a century measuring exactly that: a beef half-carcass (~150 kg) goes from **40 °C to ~4 °C in 15–16 h**, that is **{tasa_canal} °C/min**. For that geometry (LC ≈ 7.5 cm) C3 predicts **{C3.rate_trunk} °C/min**: the measured/predicted ratio is **{razon_canal}**. ⇒ The LC⁻ⁿ law **works at the 100+ kg scale**, and it is the only real datum we had at that scale. **Caveats, and they are large:** the carcass is cooled with forced air at 0 °C and 2–4 m/s (a heat-transfer coefficient higher than our anchor''s) and over the 40→4 °C range **with no phase change**. It is an **order-of-magnitude** check, not a replica of the protocol. **The exact origin of the number (FAO Manual Cano-Muñoz 1991, T0098E02):** it is a technical guide of industrial practice, not a measurement campaign with n and σ; the datum is cited as an industry standard confirmed by decades of practice. Mallikarjunan & Mittal 1994 (J Food Eng 23:277) is a finite-element simulation that **corroborates** that datum within ±2.7 °C; it does not generate it. **These two sources are now [V] (F79 read in full 2026-09-27).** Edge note: L38 ceased to depend on this law in batch 49 — it corroborated C3, which L38 already has directly.'
  L35:
    capa: ley
    e: V
    deps:
    - F80
    - G4
    t: '**Natural deep eutectic solvents protect cells, but do NOT break the toxicity↔vitrification trade-off.** Made of common metabolites (sugars, amino acids, choline derivatives), they protect **cell lines** frozen by N2 immersion at 50 % w/v better than DMSO (F80), and their viscosity is tunable with water. **Corrected in batch 46 after reading the primary source:** the earlier version of this law claimed ''94.65 % viability in human stem cells, no difference from DMSO'', and **that datum is not in F80**. What is there, and weighs more: **they crystallize at 30 °C/min** ⇒ their CCR is > 30 °C/min and they are no use for vitrifying large volumes (L44).  **Batch 49 — the trade-off is closed from BOTH sides, with a single primary source. CLOSURE [P] → [V].** On rereading the F80 PDF, a datum appears that nobody had extracted and that this law was missing: the authors explain **why they do not go beyond 50 % w/v**, in their own words: ''*The reason of using 50 % (w/v) instead of higher percentages of NADES is highly related to **their high toxicity at those concentrations**, as well as, their high viscosity which would difficult the diffusion process during freezing*'' (Discussion). ⇒ 50 % w/v **is not a choice of convenience: it is the toxicity ceiling declared by the primary source itself** — and it is exactly the concentration at which the CCR already fails by a factor **≥ 70** (30 °C/min versus the 0.426 that a human brain requires by C3/L44: **1.85 decades**, computed in `es/20_cotas/cota_campos_lejanos.py`). Closing those 1.85 decades would require raising the concentration **above a value the article itself calls toxic**. Both sides of the trade-off are measured in the same work, so the verdict is no longer our inference about one side only. **And an imprecision of our own is corrected (pattern L33):** the earlier version concluded that the eutectic solvents ''remain interesting for **low toxicity at moderate concentration**''. F80 says the opposite for the concentrations this problem needs; what it does support is **better post-thaw recovery than 50 % w/v DMSO in two cell lines**, and that the medium **need not be removed, only diluted**. That is the real utility: cell protocols, not vitrification of volumes. **Declared leaks:** (i) only two immortalized lines (L929 and HaCaT) and viability is reported as optical density, not as a percentage; (ii) there is no toxicity comparison **at equal molar concentration** against DMSO — this was the `cierra` of this node and becomes a leak, because the verdict does not need it: the relevant toxicity is that at **the maximum usable concentration**, and that is the one F80 declares; (iii) 50 % w/v is not converted to molarity, because the eutectic solvents are mixtures of variable molar mass and doing so would require assuming a composition (R5).  **Batch 49 — edge audit (pattern 1, unnecessary dependency): `L29` is removed from `deps`.** L29 (tardigrade CAHS proteins vitrify at ~0.6 mM) is a **sibling** node, not a foundation: it concerns a different chemical class and vitrification **on drying**. Counterfactual test, which is the deciding one: if L29 were true (the CCR↔molarity relation can be broken with macromolecules) the eutectic solvents would still crystallize at 30 °C/min; and if L29 were false, they would too. The verdict of this node **does not change in either case**, hence L29 is not evidentiary support — and in this network `deps` also penalizes, so a [P] node was dragging to [P] a content whose evidence lies entirely in F80 [V] (primary, PDF read) and G4 [V]. The direction of the evidence is the reverse of what the wiring said: **this negative result on eutectic solvents feeds L29''s debate on whether the trade-off is a law of nature or a property of the chosen chemical class; it is not derived from it.** The thematic link is kept where it belongs, in this text, which names L29.  **Batch 48 — link audit (pattern 4, unnecessary dependency):** `X2` is removed from `deps`. This node was written to attack X2 from outside, and in this network `deps` means evidentiary support and also penalizes: X2 is [A] and was dragging to [A] a content that does not need it. Counterfactual test: the F80 calorimetry (they crystallize at 30 °C/min) is a NEGATIVE result on an X2 candidate: it contributes to X2, it does not derive from X2. The thematic link is kept where it belongs, in this text, which names X2; the evidence flows from here to X2, not the other way round. Reproducible audit in `es/20_cotas/auditoria_enlaces_X2.py`, which checks that **no node exceeds its declared status** and that X2 remains [A].'
  L43:
    capa: ley
    e: V
    deps:
    - C3
    - C8
    - G4b
    - F72
    t: '**ONE verdict of the framework is true across ALL its uncertainty, and that makes it a result. The other two are NOT, and this law claimed otherwise by mistake until batch 52.** Evaluating at the **64 corners** of the six parameters of the frontier (anchor, rate, exponent and the three CCRs) — which is the MATE criterion declared in the engine header, ''without Monte Carlo (R5: no theatre)'' — with the declared values and moving nothing: **the human brain falls inside the viable region at 64/64 corners.** ⇒ **That the brain is vitrifiable in principle does not depend on anything we do not yet know**, and the wide margin of the maximum mass is irrelevant to THAT verdict. It is a case of closure by demonstrated irrelevance of the uncertainty. **WHAT IS WITHDRAWN (batch 53):** the earlier version also claimed that **trunk and whole body fall outside in 100 %** of cases. That is false under the framework''s criterion: the trunk falls outside at **48 of 64** corners and the whole body at **12 of 64**. The 100 % was an artefact of a **triangular Monte Carlo**, which concentrates mass at the centre and **never visits a corner**. And the engine itself was already printing it: C3 gives ''M22 fails at the centre of the trunk'' as **not robust**. **A consequence that is not hidden:** the impossibility of vitrifying a trunk or a whole body is **NOT demonstrated**, and for that reason V15 cannot be closed by leaning on this. **Declared leak:** the discrepancy in counts with the audit (48/12 here, 52/14 there) arises from judging the body by **LC** or by **mass**, and those two criteria coexist in the framework without it being declared which governs — C3 uses LC and concludes that ''M22 vitrifies the average body'', the opposite of what this law claimed by mass.'
    cierra: closed in batch 53 by lowering the statement to what the 64 corners support; the verdicts for the trunk and the whole body are explicitly NOT certified
  L45:
    capa: ley
    e: V
    deps:
    - C3
    - C6
    - F2
    t: '**The exponent of the cooling law is sustained by physics, not statistics, and one more volume certifies it by both.** The key verdicts that depend on exp_LC overturn only upwards: **C3 (VMP does not vitrify a human kidney) with n > 2.34** and **C6 (LC 4 cm inside the slow window) with n > 2.52**, at the worst corner of anchor, rate and kidney. **Statistical route:** with the 3 volumes of F2 (1 dof) the one-sided 95 % bound sustains C3 narrowly (rate < 5.2 versus 5.3) and **does NOT sustain C6** (0.079–0.092 versus 0.1): declared leak. **Physical route, independent:** with equal h, material and protocol the exponent lies between 1 (Bi ≪ 1) and 2 (Bi ≫ 1); the only things pushing it above 2 are non-self-similar shape and noise, and their size is measured (**+0.18**). Overturning C3 would require **×1.9** that excess and overturning C6 **×2.9**. ⇒ C3 closes by both routes; C6 closes by the physical one. **Remaining leak:** a real organ is not a bag; if its shape adds more than ×1.9 the observed excess, C3 opens. **Minimum measurement that also closes the statistical route:** ONE more volume in the F2 setup with noise ≤ 10 % (best **~0.15 L, kidney size**, because it also checks C3 at its own scale); with 15 % noise two are needed (0.15 L and ~7 L). Refutation: a fitted exponent > 2.34 with four or more volumes. Calculation in es/20_cotas/cota_exp_LC.py.'
  L44:
    capa: ley
    e: V
    deps:
    - F80
    - C3
    t: '**The shortcut to X2 via eutectic solvents IS REFUTED by the datum the framework itself asked to be measured.** What survives: inverting the cooling law, a CPA needs **CCR ≤ 0.426 °C/min** to vitrify a human brain by convection — 4.3 times more permissive than M22. That threshold comes from C3 and stands as a **design target**. What falls: the eutectic solvents do not meet it **by a wide margin**. The calorimetry that batches 37–38 declared ''the most cost-effective measurement of the programme'' **was already published in F80 and none of us had read it**: cooled at 30 °C/min the eutectic solvents at 50 % w/v **crystallize** (Tc −26.6 to −32.3 °C) ⇒ **CCR > 30 °C/min, a factor > 70 above the threshold**. And in the same assay **50 % DMSO does not crystallize**, so at that concentration the eutectic solvents are WORSE at vitrifying. Their ''vitrification'' is N2 immersion of a cryovial (15 000–30 000 °C/min), which is the opposite of what a large volume demands. ⇒ **The framework''s operational recommendation is INVERTED: measuring the eutectic solvents is no longer a priority, and X2 has no known shortcut — P19 (or a new chemistry) is again the path.** Leak that remains open: only 3 systems at 50 % w/v were tested; another eutectic solvent at another concentration might behave differently, but that is a conjecture with no datum, not a shortcut.'
    cierra: '[laboratory] only a NEW chemistry with a measured CCR ≤ 0.426 replaces it'
  L42:
    capa: ley
    e: V
    deps:
    - C10
    - F42
    - F30
    - L9
    t: '**C2 calibrates well against a second mammal, and it is discovered where it stops being conservative.** The pig at 10 °C withstands **60 min of arrest with no cognitive or neurological deficit at 6 weeks** (F42). Against the window C2 predicts, the ratio lies between **0.82 and 2.99** at all corners: **within ×5 robustly**. It is a better calibration than the dog (1.63–5.99), because the dog had an **aortic flush** and that is not a clean comparison with hypothermia alone. **And the limit appears:** with Q10 = 2.53 and t37 ≥ 5 min, the C2 window reaches **61–74 min** and **exceeds the pig''s 60 min** ⇒ at that corner **C2 ceases to be conservative and becomes optimistic**. It is not a failure of the fit: it is the **declared edge of its validity**, and it says that at 10 °C the bound no longer has a safety margin.'
  L40:
    capa: ley
    e: V
    deps:
    - F86
    - G1
    - C10
    - X1
    t: '**τ_eq has a measurable chemical substrate, and it is succinate.** Succinate accumulation is the common feature of ischemia in **mouse, pig and human** heart, and cold acts by **slowing its generation**, not just by slowing metabolism in general (F86). ⇒ Our τ_eq, which until now was an integral of temperature and time, **could be measured directly as succinate concentration** instead of being estimated. That would turn a derived quantity into an **observable quantity**, and would explain why τ_eq is invariant across species (L2, T1 of the scaling): what is conserved is not time, it is **how much succinate has accumulated**. And there is a practical consequence: the damage **is attenuated by metabolic inhibitors**, so τ_eq is not just a function of T and t but also of pharmacology — a third axis the framework did not have.'
  L41:
    capa: ley
    e: V
    deps:
    - F85
    - L16
    - F22
    t: '**Nucleation ceases to be a qualitative bound and acquires a numerical UPPER BOUND, and two independent systems do not contradict each other.** Rat liver supercooled at −6 °C with real orthotopic transplantation gives two survival points (100 % at 72 h, ~58 % at 96 h; F85). With the L16 model (Poisson nucleation, probability increasing in volume **and** time) the 96 h point implies **J(−6 °C) ≤ 0.57 nucleations per L·h**; the 72 h point, being 100 %, gives no upper bound. It is **compatible** with the independent bound from pig kidney at −2 °C (**J ≤ 3.1 per L·h**, rule of three on the 5+5 animals of 5 h without nucleation in F20). ⇒ Two systems, two species and two temperatures give bounds that do not contradict each other. **CLOSED in batch 48 by correction of an imprecision of our own + demonstrated irrelevance of its caveat (pattern L33 + pattern L43).** The earlier version said the rate was ''fitted'' ≈ 0.57 and left open the caveat that attributing the 42 % of failures at 96 h to nucleation is an assumption. Both are fixed at once: let φ be the fraction of those failures that is nucleation; J(φ) = −ln(1 − 0.42φ)/(V·t) is **monotonically increasing in φ**, with its maximum exactly at φ = 1. Therefore what F85 gives **is not a fitted value but an upper bound**, and any deviation from the assumption can only LOWER it. And the compatibility verdict **holds for all φ ∈ [0,1] and at all volume corners** (rat liver 8–14 mL, pig kidney 40–90 mL): the slack at the worst corner is ×2.9, and breaking it would require **79 % of failures to be due to nucleation when F85 observes 42 % in total** — impossible. Calculation with numbers in `es/20_cotas/cota_nucleacion_L41.py`, which also **reproduces from scratch the two values this node had written by hand** (0.567 and 3.05). **Declared leaks:** (1) the bound assumes ''nucleation ⇒ graft failure''; if nucleating were survivable J would be higher, and the support that it is not lies in the dependency F22 itself (frozen controls at −2 °C: 98 % nuclear pyknosis, severe destruction at organ scale) — and the pig bound uses the same convention, so the comparison is consistent; (2) the **point** value of J remains open and would only be closed by measuring φ: what is closed is the bound and the non-contradiction, not the central number; (3) J is not extrapolated from −6 to −2 °C: they are two independent bounds and it is only checked that they do not clash; **(4) ADDED IN BATCH 52 (audit against ourselves), and it is a methodological asymmetry: the rat side has no n.** The F85 PDF **nowhere gives the number of animals** (checked by searching for ''n ='' and ''number of rats'' in the full text), so the 42 % is a **point proportion**, not a bound. The pig side, by contrast, **does use n** (rule of three on 5+5). Calling both things a ''bound'' mixes two different objects. **The compatibility verdict holds just the same and for that reason the node stays at [V]:** even putting a 95 % binomial upper bound on the proportion with a small plausible n (3 of 7, or 2 of 5) the rat J rises to ~1.4–1.6 per L·h, still below the worst pig corner (2.04). What is lost is the precision of the number, which was already declared open in leak (2). **And a second caveat about the source: F85 is a PROTOCOL article** (Nat Protoc), and its survival figures are reported in the discussion as a summary of the group''s own work (''*we were able to transplant supercooled livers with 58 % long-term survival after 96 hours... while 100 % survival was limited to 72 hours*'', verified verbatim in the PDF), not as a results table with statistics.'
    cierra: 'closed in batch 48: reformulated as an upper bound; the caveat does not change the verdict across its whole range (es/20_cotas/cota_nucleacion_L41.py)'
  L36:
    capa: ley
    e: V
    deps:
    - F81
    - G1
    t: '**The seal resolves ischemia by changing WHICH CELL breathes, not how much.** In terrestrial mammals aerobic ATP production is neuronal; in the hooded seal (*Cystophora cristata*) **it shifts to astrocytes**, and the markers of oxidative metabolism (neuroglobin, cytochrome c) are **in glia instead of in the neuron** (Mitz et al. 2009 — F81). Seal neurons sustain firing for **19±10 min (max 60 min)** of severe hypoxia, versus **5±2 min in mouse** (Folkow et al. 2008 — F81). The molecular mechanism: overexpression of MCT4 in neurons (lactate expulsion), inversion of the ANLS shuttle (rANLS: neuron→astrocyte lactate), and astrocytes with Ngb, cytochrome c and LDHB acting as an oxidative buffer (Hoff et al. 2017 — F81). ⇒ **It is a fourth mechanism of ischemic tolerance, distinct from the three the framework already had** (cold via Q10, low flow, and the active inhibition of the hibernator of L27): here it is a **division of labour between cell types**. It suggests that τ_eq is not a property of the tissue but **of the tissue''s metabolic architecture**, which would explain why the euthermic ground squirrel (L15) endures without cold or torpor. **F81 now [V]: three primaries read (Folkow 2008, Mitz 2009, Hoff 2017); correction: the duration comparison comes from Folkow, not Mitz.**'
  L31:
    capa: ley
    e: V
    deps:
    - F76
    t: '**The zero-concentration point exists and had been measured in another field: cryo-electron microscopy.** The CCR of **pure water** is **6.4 × 10⁶ K/s = 3.84 × 10⁸ °C/min** (F76, Mowry et al. 2025, Phys Rev Research 7:013095 — measured directly by time-resolved cryo-EM). With that third point, the framework''s CCR↔concentration relation ceases to be a two-point line and is seen to be **curved (convex)**: the slope is −0.95 decades per mol between 0 and 8.4 M and **−1.74 between 8.4 and 9.3 M**. ⇒ **Using the local slope near 9 M to extrapolate there, as F2 does, turns out to be correct — and now with evidence, not by assumption.** It also fixes the other end of the problem: without cryoprotectant one can vitrify, but only below **~1.5–3 µm** of thickness in pure cryo-microscopy (LC* ≈ √(α·ΔT/CCR) ≈ 1.5 µm computed in F76; cryo-EM practice operates at 100–200 nm). **Correction (cross-check with F6/Studer):** in biological tissue without CPA one vitrifies up to **10–20 µm** (a factor ×10 over grid cryo-EM) and up to **~200 µm** with high-pressure freezing (2000 bar, Tm drops to −22 °C → required CCR falls ×100). The F76 value (6.4×10⁶ K/s) agrees with the extrapolation from F6 (2.5×10⁵ K/s) to a factor of 1.25 — independent corroboration. **No verdict changes**: 200 µm is still a factor ×200 in LC = 4 cm and ×4×10⁴ in rate (rate ∝ 1/LC², C3). **F76 now [V]: primary peer-reviewed source read in full** — the 6.4×10⁶ K/s is the entire statement, not colour. Pressure as a design variable is declared a gap (it has no node of its own in the framework).'
  L32:
    capa: ley
    e: V
    deps:
    - F77
    - G3
    - F75
    t: '**Another field has already formally solved ''how thick can I vitrify'': bulk metallic glasses.** Lu & Liu 2002 derive two explicit equations spanning 6 orders of magnitude (R²=0.91): **R_c = 5.1×10²¹·exp(−117.19γ) K/s** (exact analogue of CCR) and **Z_c = 2.80×10⁻⁷·exp(41.70γ) mm** (exact analogue of LC*), where γ = Tx/(Tg+Tl) (F77). ⇒ Our F1 computes the critical thickness **a posteriori, by measuring the CCR**; metallurgy predicts it **a priori from characteristic temperatures of the material**. The best alloys (Pd-Cu-Ni-P, γ≈0.45) reach a predicted Z_c ~40 mm (experimental up to 72–80 mm). Together with the lyophilization excipient-design framework (F75), they are **two design tools already built** for the problem X2 leaves open, and neither has been applied to organ cryoprotectants. The γ framework is transferable: if Tg, Tl and Tx of a CPA were measured, its CCR and LC* would be obtained without doing cryobiology. **F77 now [V]: read in full, equations verified with numerical data.**'
  L33:
    capa: ley
    e: V
    deps:
    - F78
    - L8
    - L28
    t: '**Atrophy, which the framework did not model, has already been solved by a large mammal — and by a route distinct from energy saving.** The black bear spends **4–6 months almost immobile**: **with no bone loss at all** and with **only LIMITED loss of muscle mass and protein** (F78, both primaries read in batch 46). **Precision corrected in batch 47:** the earlier version said ''without losing muscle or bone''; the muscle article says ''limited loss'', not zero. Bone is indeed zero. It does not achieve this by slowing metabolism: it keeps **protein synthesis active via mTORC1** with branched-chain amino acids preserved, and **downregulates bone-resorption genes** without touching those of formation. ⇒ For the spaceflight route, atrophy **is not an inevitable consequence of immobility**, but a regulable programme. It adds a magnitude missing from Q13, which counted only energy, and links with L28: in torpor the limit is not fat but the handling of non-lipid fuel and nitrogen. **Declared leak:** it is transcriptomic and histological evidence in bear; **nobody has shown that the programme can be induced in a human**.'
    cierra: 'closed in batch 47: F78 read in full and the muscle imprecision corrected'
  L29:
    capa: ley
    e: V
    deps:
    - F74
    t: '**Biology vitrifies without toxic concentration, using macromolecules instead of small solutes — and that attacks the weakest assumption of the framework.** Our formula F2 concludes that vitrifying large pieces requires crossing the toxicity threshold **because it assumes small-molecule cryoprotectants**, where lowering the CCR requires raising the molarity. Tardigrade CAHS proteins form glass and gel by network self-assembly at **~0.6 mM (>15 g/L)** (F74), some **four orders of magnitude below** the 8.4–9.3 M used by M22 or V3. In transfected yeast and in the tardigrade itself, viability correlates strictly with the glassy state (Fig 7D, 7E of Boothby 2017): it is maintained below Tg and collapses when it is exceeded. ⇒ **The CCR↔molarity relation is not a law of nature: it is a property of the chemical class the field has chosen.** Large caveat: the vitrification of CAHS occurs **on drying, not on cooling**, and its exact mechanism is **disputed** against purely mechanical-network hypotheses (Arakawa & Numata 2021). It is not a direct substitute; it is proof that the assumption is breakable. **F74 now [V]: Boothby et al. 2017 (PMC5987194) read in full 2026-09-27.**'
  L30:
    capa: ley
    e: V
    deps:
    - F75
    - G3
    - F59
    t: '**A computational method already exists to design the chemistry the framework says is missing, and it comes from pharmaceutical lyophilization.** F2 identifies what is needed: a CPA with low CCR **without** high molarity. The pharmaceutical industry has spent decades solving the twin problem — stabilizing proteins in glass — and has a **molecular design framework** that optimizes excipients with quantitative structure-property relationships for **Tg of the anhydrous solute, Tg'' of the freeze-concentrated matrix, ice melting point and the Gordon-Taylor constant** (F75). And Tg is precisely the variable that Kavian 2025 (F59) showed **controls cracking**. ⇒ The bottleneck of X2 is not just a pending experiment: it is **a design problem with tools already built in another field**, which nobody has applied to organ cryopreservation.  **Batch 48 — link audit (pattern 4, unnecessary dependency):** `X2` is removed from `deps`. This node was written to attack X2 from outside, and in this network `deps` means evidentiary support and also penalizes: X2 is [A] and was dragging to [A] a content that does not need it. Counterfactual test: the existence of the computational excipient-design framework is a fact of the lyophilization literature (F75) plus the role of Tg in cracking (F59); it is a proposal of a route TO resolve X2. The thematic link is kept where it belongs, in this text, which names X2; the evidence flows from here to X2, not the other way round. Reproducible audit in `es/20_cotas/auditoria_enlaces_X2.py`, which checks that **no node exceeds its declared status** and that X2 remains [A].'
  L27:
    capa: ley
    e: V
    deps:
    - F73
    - L24
    - C2
    t: '**In a hibernator, below 12 °C metabolism ceases to obey temperature.** Buck & Barnes (F73) measure that between Tb 0 and 12 °C the metabolic rate of the arctic ground squirrel **does not change significantly**: there is **active inhibition independent of temperature**. And the apparent Q10 **varies from 1.0 to 14.1** within the same range, with a global value of 2.4. ⇒ **In the hibernator''s domain, C2 ceases to apply altogether**: it is not that Q10 is different, it is that metabolism is no longer a function of temperature. It reinforces the domain restriction of L2 and explains why L15 (euthermic ground squirrel resistant to 8 min of arrest) is not an anomaly but another regime.'
  L28:
    capa: ley
    e: V
    deps:
    - F73
    - L8
    - C5
    t: '**What ends a torpor bout is neither temperature nor total energy: it is the type of fuel.** In stable torpor the respiratory quotient is **0.70 (lipids only)** and rises above **0.85** at the temperature extremes, a sign that non-lipid fuel is being used. **RQ correlates negatively with the maximum duration of the bout** (F73) ⇒ the hypothesis held by the source itself is that **the availability of non-lipid fuel limits the duration of torpor**. It corrects the approach of C5, which counted only kilograms of fat: **fat is not the limit, the non-fat component is.**'
  L24:
    capa: ley
    e: V
    deps:
    - F70
    - L2
    t: '**The non-linearity of Q10 moves from suspicion to measurement, and with a mechanism.** In mouse brain mitochondria between 37 and 6 °C (F70): Q10 of **2.61 ± 0.09** in basal respiration and **3.92 ± 0.31** in active respiration. It coincides independently with the cold branch of McCullough in humans (3.5). **And it gives the mechanism:** the respiratory-chain complexes do not slow equally — citrate synthase and complexes I, III and IV are poorly sensitive (Q10 1.2–2.4), while **complex II reaches 4.2 and complex V 11.3**. ⇒ The global Q10 is not a constant of the tissue but **the weighted mean of enzymes with very different sensitivities**, and it rises on cooling because **ATP synthesis shuts down before electron transport**.'
  L26:
    capa: ley
    e: V
    deps:
    - F69
    - F72
    - L20
    t: '**Cryonics uses exactly the concentration that German showed to be toxic, and the resulting osmotic damage is measured: 36 % brain shrinkage.** The P-19 case sets **65 % w/v** of CPA as target (F69) — the same concentration that in hippocampal slices **halves basal respiration** (80.4 versus 173.3; F72, and discussed in L25). The CT confirms that the target was reached well (83 % of brain area above 100 % of the target, 97 % above 92 %), that is: **the perfusion was technically good and precisely for that reason the tissue received the full toxic dose**. And the measured brain shrinkage is **36 %**, which quantifies for the first time in a human case the osmotic injury that L20 separated from chemical toxicity. ⇒ Good perfusion and low toxicity are **opposed objectives** with current chemistry.  **Batch 49 — systematic edge sweep (pattern 4, unnecessary dependency):** `L25` is removed from `deps`. The four claims of this law lie in F69 [V] (65 % w/v target, CT, 36 % shrinkage) and in F72 [V] (80.4 versus 173.3), and the separation between osmotic injury and chemical toxicity is provided by L20 [V]. The only thing L25 adds over F72 is its own OPEN claim (''loading temperature is the decisive variable''), and the verdict of this law is true in BOTH branches of that unknown: if cold loading rescues high molarity, P-19 did not load at −22 °C and received the toxic dose anyway; if it does not rescue it, all the more so. ⇒ L25 is not evidentiary support here, it is a cross-reference, and it is kept as such in this text. **L25 stays at [P] and contradiction I1 stays open** (R1: tension is not lost). Reproducible audit in `es/20_cotas/barrido_aristas_global.py` (enumerates the 17 penalizing edges of the whole graph) and `es/20_cotas/auditoria_aristas_tanda49.py` (applies the test and checks that no node exceeds its declared status).'
    cierra: 'closed in batch 49 for unnecessary dependency: the verdict is given by F69 and F72, both [V]; L25 only contributed a mechanism unknown that does not change the verdict in either of its two branches'
  L20:
    capa: ley
    e: V
    deps:
    - F65
    - L6
    - G4b
    t: '**Toxicity depends on the temperature of use as much as on the molecule, with a measured asymmetry.** M22 was designed to touch living tissue **at −22 °C** (hence the name) and at −3 °C its toxicity would be unacceptable (F65) — the opposite of VMP, tolerable at −3 °C. And adding and removing M22 at −22 °C was **uniformly fatal**, whereas perfusing it for 25 min and washing it **out while warming** recovered full renal function. Fahy concludes that the dominant damage was **osmotic expansion at low temperature**, not chemical toxicity. ⇒ D_CPA and osmotic injury are **two distinct magnitudes that are easily confused**.'
  L25:
    capa: ley
    e: V
    deps:
    - F72
    - L22
    - L20
    t: '**At the molarity of M22, V3 chemistry loaded warm is already toxic — and that makes loading temperature the decisive variable.** German tested V3 at **65 % w/v = 9.28 M**, practically the molarity of M22 (9.3 M), loading **at 10 °C**: basal respiration (Seahorse OCR) fell to **80.4 ± 5.6 versus 173.3 ± 6.7 for the control**, that is **by half**, with reserve capacity of 38.9 versus 73.4 (F72). By contrast, loading at subzero temperature (−10 °C / −20 °C) at 59 % (8.42 M), respiration and LTP are fully preserved after complete vitrification at −140 °C. ⇒ **The difference between the chemistry that works and the one that scales is not concentration: it is that M22 is loaded at −22 °C and not at 10 °C** (L20). This **answers contradiction I1**: the efficacy of rescue by cold loading is not a renal artefact (F65/L20), but a thermo-kinetic principle verified directly in mammalian neural tissue (hippocampus). **CLOSED 2026-09-27:** contradiction I1 is resolved with the subzero loading protocol and the mitochondrial respiration in neural slices of German et al. (F72); all its dependencies are strong [V].'
    cierra: 'closed 2026-09-27: contradiction I1 resolved with the subzero loading protocol and mitochondrial respiration in neural tissue (German et al., F72)'
  L22:
    capa: ley
    e: V
    deps:
    - F37b
    - F46
    - F71
    t: '**V3 and VM3 are the same formula: V3 = VM3 without the ice blockers. CONFIRMED BY THE AUTHORS THEMSELVES**, not merely deduced: the PNAS supplement (F71) says that they omitted the ''Supercool'' polymers and that they called it **V3 ''by reference to VM3''**. Also checked component by component: DMSO 22.3 %, formamide 12.86 %, EG 16.84 % and PVP K12 7 % are **identical to the decimal** in Pichugin 2006 (F37b) and in German 2026 (F46); VM3 adds 1 % X-1000 and 1 % Z-1000 and reaches 61 % w/v, while V3 stays at the **59 %** that the PNAS declares. ⇒ The chemistry with **demonstrated function (LTP)** is not a new family: it is **Fahy''s VM3 without blockers**. X2 does not pit two different lineages against each other, but **the same lineage at two concentrations and two design temperatures** (59 % w/v at slice temperature versus 9.3 M at −22 °C). **And the distance is much smaller than it seemed:** V3 is **8.42 M** of permeating CPA (F71) versus the **9.3 M** of M22 — barely a **10 % difference in molarity**. What truly separates the chemistry that works from the one that scales is not concentration: it is **the ice blockers and the loading temperature** (10 °C versus −22 °C).  **Batch 48 — link audit (pattern 4, unnecessary dependency):** `X2` is removed from `deps`. This node was written to attack X2 from outside, and in this network `deps` means evidentiary support and also penalizes: X2 is [A] and was dragging to [A] a content that does not need it. Counterfactual test: the compositional identity V3 = VM3 without blockers (F37b, F46, and the authors'' own supplement, F71) is true with X2 = YES and with X2 = NO. The thematic link is kept where it belongs, in this text, which names X2; the evidence flows from here to X2, not the other way round. Reproducible audit in `es/20_cotas/auditoria_enlaces_X2.py`, which checks that **no node exceeds its declared status** and that X2 remains [A].'
  L23:
    capa: ley
    e: V
    deps:
    - F37b
    - F72
    - G4b
    t: '**The physics of vitrifying is not what kills neural tissue: the chemistry is.** Direct, quantitative proof (F72): in hippocampal slices, **exposure to CPA and actual vitrification give the same result** — basal respiration 135.1 ± 6.7 with CPA only versus 131.4 ± 5.7 after full vitrification, and reserve capacity 48.6 versus 50.6. **All the damage is caused by chemical exposure; the phase change adds nothing measurable.** A classic datum that already pointed this way (F37b): V(EG) at **53 %** allowed vitrification and rewarming **with no damage attributable to vitrification or rewarming themselves**, and was nevertheless **much more damaging than at 50 %**. Same physics, only 3 points more concentration. It is the cleanest evidence in the programme that the bottleneck of X2 is **toxicity**, and it fits with L13 (61 % EG alone gives unstable LTP; V3 preserves it).  **Batch 48 — link audit (pattern 4, unnecessary dependency):** `X2` is removed from `deps`. This node was written to attack X2 from outside, and in this network `deps` means evidentiary support and also penalizes: X2 is [A] and was dragging to [A] a content that does not need it. Counterfactual test: the two pairs of numbers measured in the same tissue (135.1 vs 131.4 and 48.6 vs 50.6, F72; 50 vs 53 % in F37b) do not change with the answer to X2. The thematic link is kept where it belongs, in this text, which names X2; the evidence flows from here to X2, not the other way round. Reproducible audit in `es/20_cotas/auditoria_enlaces_X2.py`, which checks that **no node exceeds its declared status** and that X2 remains [A].'
  L21:
    capa: ley
    e: V
    deps:
    - F69
    - F16
    - G1
    t: '**The gap between ideal and real cryonics is measured with a primary case, and it is larger than I first noted.** Wowk (F16) documents that complete CT-verified brain vitrification has only been seen in cases with **< 10 min** between arrest and declaration. The P-19 case (F69) documents the full chronology: legal declaration at **1 h**, chest compressions at **1 h 43** and, above all, **start of cryoprotectant perfusion at 4 h 40**, with the team already on standby after two shifts of 3 and 4 days. **Correction of my own earlier note:** I noted ''~90 min'', which is only the arrival at the mortuary; the datum that matters for τ_eq is **when perfusion starts, and that is 4 h 40**. ⇒ **Real practice operates ~28 times above its own technical threshold** (4 h 40 versus < 10 min), and the bottleneck is not chemistry: it is the **legal declaration procedure**, which cannot begin earlier. It fits with O2: legal death is a decision, and here that decision sets the damage.'
  L19:
    capa: ley
    e: V
    deps:
    - F64
    - L16
    - G7
    t: '**Nucleation is already controlled pharmacologically, and the control splits into two distinct functions.** In partial freezing of rat liver (F64): **Z-1000 suppresses heterogeneous nucleation** and **X-1000 and AFGP inhibit recrystallization** — they are two separate mechanisms, not one. It closes the gap that L16 left open: if the limit of supercooling is nucleation accumulated over time, **the chemical lever to move it already exists**. But none is free: AFGP lowered oedema (p = 0.029) and **damaged the endothelium**; X/Z kept ATP high and gave oedema on thawing. ⇒ Nucleation control enters the framework as a magnitude with a cost, just like D_CPA.'
  L16:
    capa: ley
    e: V
    deps:
    - F20
    - F62
    - G2
    t: '**The limit of supercooling is nucleation accumulated over time, not the minimum temperature.** Direct proof: the same group held −2 °C for 5 h but had to **raise to −0.5 °C** for 24–48 h because of nucleation risk (F20, confirmed by the editorial F62). Nucleation is stochastic and its probability grows with volume **and with time**. ⇒ There is a temperature × duration trade-off that **bounds supercooling to days, not weeks**, unless nucleation is controlled (antinucleating proteins, isochoric method).'
  L17:
    capa: ley
    e: V
    deps:
    - F20
    - F63
    - C2
    t: '**External corroboration of Q10 and of the clinical temperature gradient.** The transplant work itself cites ''every 10 °C drop reduces metabolism by 50 %'' (Q10 = 2.0, within our range [2.0, 2.6] without having been fitted to it). And in human clinical practice, preserving hearts at **10 °C instead of on ice** reduces severe primary graft dysfunction (F63). ⇒ The hypothermia route keeps giving real clinical improvements **without phase change**: it is where the residual is most solid.'
  L5:
    capa: ley
    e: V
    deps:
    - C6
    - F20
    - F21
    - F57
    t: 'Partial freezing is **not limited by heat** at LC 4 cm (cooling {C6.rate4}, inside the slow window; latent heat evacuated in {C6.latent4}). The verdict is a result of **C6, which is mate**: it comes from geometry and latent heat, not from any experiment. That partial freezing in fact works at subzero temperature is supplied by F20 and F21 (both [V]). F57 [V] corroborates the scale in a **large organ** — pig kidneys (n=6 at 10 days at −15 °C with in vivo autotransplantation and urine production) and discarded human kidneys (n=3 at 10 days in simulated transplantation with ~50–57.5 % creatinine clearance and stable vascular resistance) — which is the scale C6 predicted. **F57 now [V]: full NIH/Research Square manuscript, AJT 2024/2025 proceedings and in vivo autotransplantation documented.**'
    cierra: 'closed 2026-09-27: all dependencies strong (C6 mate, F20, F21 and F57 verified)'
  L6:
    capa: ley
    e: V
    deps:
    - C8
    - F26
    - F39
    - F40
    t: Toxicity follows qv* (20 solutions); designing by qv*, 8.4 M at −3 °C went from 100 % lethal to kidney without damage. **Temperature and loading protocol dominate:** M22 (9.3 M) 25 min at −22 °C with simultaneous washout on warming gives full renal function; adding and removing it at −22 °C without that washout is sometimes fatal (F39). Chemical neutralization exists for formamide, urea and acetamide (with DMSO), but **not** for glycerol, propylene glycol, EG or DMSO (F40). The CCR ↔ toxicity tension is one of **design and protocol**, not a hard law.
  L7:
    capa: ley
    e: V
    deps:
    - C9
    - F88
    t: 'Accidental hypothermia at 13.7 °C with arrest and a good outcome = ×{C9.extra} over C2 ⇒ **it is not a leak**: there was CPR (low flow). C2 is a zero-flow bound. **Batch 54: closed against the PRIMARY.** The earlier version relied on F13, which the batch 52 audit showed to be a **review**. With the Lancet paper (F88) read, the case is documented first-hand: **immediate** basic CPR from 19:00 and bypass at 21:50 ⇒ **the low flow is in the primary, not inferred**. **Declared leak:** the primary gives 170–195 min of arrest, not the 412 that the network holds in `hypo_case_min`; the verdict holds with both, with a margin of ×3.26 in the worst case.'
    cierra: closed in batch 54 against F88 (Lancet 2000), read in full
  L8:
    capa: ley
    e: V
    deps:
    - C5
    - F89
    t: 'One year of torpor costs {C5.kg25} kg of fat at 25 % of baseline and {C5.kg3} kg at 3 %. **Energy does not limit**, and that verdict is given by **C5, which is mate**. SpaceWorks/NASA estimate a mass saving of **52–68 %** for torpor habitats versus the TransHab reference design, on the same mission, and an IMLEO reduction of **25–44 %** (F89). **CORRECTION (2026-09-27, PDF read directly):** batch 54 noted ''25–35 %'' through a misreading; the PDF literally says ''25% to 44%''. It adds: with the same mass the crew can be doubled; supporting clinical evidence cited up to 14 days of continuous therapeutic hypothermia. Follow-up: NIAC Phase II (Bradford, SpaceWorks, 2016–2018, Project 88911) raised the TRL from 2 to 3. **Batch 54: closed against the PRIMARY.** The earlier version took the 52–68 % from F13, which is a review, and the batch 52 audit pointed out that the figure originates in the Bradford/SpaceWorks NIAC report and **was not in the network**. It now is, read in full, with the literal phrase. **Declared leak:** it is a mission-architecture study, not a physiological measurement; what it sustains is the **saving in spacecraft mass**, not that human torpor is attainable.'
    cierra: closed in batch 54 against F89 (NIAC Phase I), read in full; IMLEO corrected to 25-44% on 2026-09-27
  L9:
    capa: ley
    e: V
    deps:
    - C10
    - F30
    t: 'C2 is **conservative but of the correct order** in mammals: the dog with cold flush withstands {flush_min} min without flow at ~10 °C = ×{C10.extra} over C2: at the centre it stays within ×5, but at the corner Q10 = 2.0 with the brain at 15 °C it reaches ×6.5 (leak; the threshold is not moved, R2). At 10 °C and 60 min: no functional or histological brain damage.'
  L10:
    capa: ley
    e: V
    deps:
    - F31
    - L6
    t: 'Loading cryoprotectant at human-kidney scale (150–220 g, pig and human) is feasible: cell-like osmotic response, low damage (LDH) and distribution confirmed by CT. With a hypotonic vehicle vascular resistance rises up to ×10 (reversible).'
  X1:
    capa: frontera
    e: V
    deps:
    - C7
    - F23
    - F25
    - F38
    t: '**Grey zone in two sections.** (i) {C7.tau_org_good}–{tau_org_exist} min = **reproducibility frontier**: at least one organism has been recovered (cat, brain-only ischemia), but it is not reproducible and lesions remain. (ii) {tau_org_exist}–{C7.tau_cel} min = **cellular only**: cells and synapses recoverable, no demonstrated organism. It is the central empirical frontier.'
  O4:
    capa: ontologia
    e: V
    deps:
    - F38
    - O2
    t: '**Function ≠ information also at the level of the organism:** Hossmann''s cat recovered integrative function (walks, eats, normal EEG at one year) after 1 h of cerebral ischemia, but with almost complete atrophy of the dorsal hippocampus and striatum. Recovering function does not guarantee preserving memory. StasisPath must report separately **functional recovery (E4)** and **conservation of information**.'
  G4b:
    capa: magnitud
    e: V
    deps:
    - F37b
    - F26
    - F65
    t: '**Operational criterion of D_CPA, now with a source and a measured band.** Metric: **tissue K⁺/Na⁺ after washing out the CPA**, against untreated control. **Measured no-damage band: 93–103 %** in rabbit renal cortex slices (F65); those of hippocampus with VM3 gave 91–108 % (F37b). The threshold I proposed (≥ 90 %) is **confirmed and slightly below** the measured band. It is not universal: it depends on tissue and protocol (E7).'
  G7:
    capa: magnitud
    e: V
    deps:
    - F37b
    - F53
    - F54
    t: '**Cold injury without ice (chilling) — magnitude closed with neighbouring fields.** Mechanism: phase transition of membrane lipids from liquid-crystalline to gel, with maximum damage between 0 and 20 °C. **Threshold measurable by FTIR** (human reproduction, F53): zygote 10.0 ± 1.2 °C, mature oocyte 16.9 ± 0.9 °C, immature oocyte 24.4 ± 1.6 °C ⇒ the transition temperature **depends on cell type** and must be measured, not assumed. In **neural** tissue: hippocampal slices are inactivated by 0 °C alone, and the injury is mitigated with **0.8 mM vitamin C**, a more ''intracellular'' aCSF (less Na and Ca, more K) and the CPA solutes themselves; with RPS-2 as carrier, **0 °C protected more than 10 °C** (F37b), and a type I antifreeze protein at 10 mg/mL protects rat hippocampal slices from **8 h at 4 °C + rewarming** compared with control albumin (F54) ⇒ cold injury in neurons is real **and pharmacologically avoidable**. **Our own datum is missing:** the transition temperature of adult mammalian neural tissue is not measured; it is measured with FTIR just like F53.  **Batch 49, graph hygiene:** `deps` had `F37b` DUPLICATED; it is left once (no status changes, the engine''s rule takes the minimum).'
  L11:
    capa: ley
    e: V
    deps:
    - F37b
    - F35
    t: '**The tension about slow freezing in neural tissue is RESOLVED on reading the two primaries, and the culprit is not the rate: it is the formulation.** F37b froze ADULT rat slices at 1.2 °C/min with **glycerol or DMSO alone** and obtained severe damage. F35 slowly freezes human brain tissue and organoids with **MEDY = 10 % DMSO + 10 % EG + methylcellulose + Y-27632**, and preserves cytoarchitecture and functional activity; organoids from epilepsy patients **keep their pathology** after thawing. ⇒ The two results **do not contradict each other**: they differ in three declared variables — (a) a **ROCK inhibitor** that blocks apoptosis, absent in F37b; (b) **methylcellulose**, which modulates extracellular ice; (c) **scale** (millimetre organoid and biopsy versus adult rat slice). **The failure of F37b is attributable to the CPA, not to slow freezing.** **Declared leak, and it is the one that matters:** MEDY has only been tested at millimetre scale; **it says nothing about an organ or a whole brain**, where extracellular ice and perfusion are a different problem. It does not turn slow freezing into a route at human scale.'
    cierra: '[laboratory] MEDY (or equivalent) applied to an organ-scale volume'
