    d: 'Q10 of the COLD branch, **MEASURED with spread** in mouse brain mitochondria between 37 and 6 °C (F70): state II 2.61 ± 0.09 and state III 3.92 ± 0.31; the range spans both ±1 SD. The central 3.5 coincides with the 15–11 °C branch of McCullough in humans (F4), measured independently. It was previously [P] with an assumed range [2.05, 4.54]'
  Q10:
    v: 2.3
    r:
    - 2.08
    - 2.53
    u: ''
    f: F4
    e: V
    d: 'MEASURED human cerebral metabolic Q10: CMRO₂ by jugular arteriovenous difference in n = 37 adults. **95 % CI = 2.08–2.53 read in the full text** (mean slope of lnCMRO₂ versus temperature = 0.083 ± 0.062). Our assumed range [2.0, 2.6] was slightly WIDER than the real one: conservative. Independent corroboration: Q10 = 2.0 cited in the transplant literature (F20/L17). Implementation check: with Q10 = 2.3 and 5 min at 37 °C, the source itself predicts 29 min at 15 °C and our C2 gives 31.2 (×1.07)'
