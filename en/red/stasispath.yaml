  F21:
    cita: 'Ozgur, Taggart, Tessier, Uygun et al. 2024, Sci Rep 14:25260. **Full PDF read.** Partial freezing at −15 °C with 3-OMG (metabolic depressant), **SnoMax** (nucleator), **PEG 35k** (membrane stabilizer), trehalose (extracellular CPA) and propylene glycol (intracellular CPA). The three improvements to go from 5 to **10 days**: more PEG, **20 min of acclimatization during thawing** to limit shear, and more BSA to reduce oedema. Compared with static cold by **SIMULATED transplantation with blood**, not real. Reference: static cold at 4 °C limits to 8–10 h'
    url: https://pubmed.ncbi.nlm.nih.gov/39448774/
    estatus: V
  F22:
    cita: 'Botea, Năstase, Herlea, Chang, Şerban, Barcu, Rubinsky and Popescu 2023, Biochem Biophys Rep 34:101485. **FULL PDF READ (batch 46).** First **isochoric** supercooling of a large organ: **whole pig liver at −2 °C, one for 24 h and another for 48 h, WITHOUT freezing** (verified by pressure in the chamber, not by inspection). H&E histology and immunohistochemistry **normal at 48 h**, architecture indistinguishable from control. Controls frozen at −2 °C for 24 h: severe destruction, **98 % nuclear pyknosis**. **n = 2 per arm, feasibility study, WITHOUT transplantation or functional test** (the authors themselves call it exploratory). Isochoric chamber with an intracellular-composition solution in osmotic equilibrium with the liver'
