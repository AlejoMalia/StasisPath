    cita: 'McKenzie, Thorn, Nnadi, Wróbel, Kendziorra, Farrell and Crary 2024, Free Neuropathology 5:35, ''Cryopreservation of brain cell structure: a review''. **FULL PDF READ (batch 46).** **It replaces the popular article (Asterisk Mag) that occupied this record:** a peer-reviewed review is a better source, but **it remains secondary and for that reason stays at [P]** — status is not raised by changing source, only the quality of the support improves. It covers the state of the art in preservation of brain structure, including the ASC of McIntyre and Fahy 2015'
