    - 2.35
    u: cm
    f: F2
    e: V
    d: 'LC of the 3 L bag. **Definition CONFIRMED in the primary:** the published paper literally says ''the characteristic length for heat transfer is defined as **L_C (= Volume/Surface Area)**'', exactly the definition in C3. Out-of-plane thicknesses declared: 5.5, 6.5 and 10.5 cm for 0.5, 1 and 3 L. Range narrowed from [2.0, 2.4] (my assumption) to [2.1, 2.35], bounded by the difference between the cited value (2.2) and my V/A reconstruction from the thickness (2.34). **Prior check:** with the declared thickness (10.5 cm) and V = 3 L, LC = V/A gives 2.34 versus 2.2 cited (ratio 1.06); at 0.5 L and 1 L the ratios are 1.06 and 1.13 ⇒ Bischof''s LC IS V/A, the same definition C3 uses'
  exp_LC:
