  F8:
    cita: 'de Vries, Uygun, Toner et al. 2019, Nat Biotechnol 37:1131 (nihms-1534583). **FULL PDF READ (batch 46).** **Entire HUMAN livers supercooled at −4 °C** plus subnormothermic perfusion: the organ''s ex vivo life is extended by **27 h** versus the clinical limit of <12 h at +4 °C. Viability before and after supercooling **does not change**, and the liver withstands a simulated transplant by normothermic reperfusion with ex vivo blood. **There was no real transplant.** Antecedent from the same group: rat liver at −6 °C (F85)'
    url: https://www.nature.com/articles/s41587-019-0223-y
    estatus: V
    cierra: 'closed in batch 46: primary read (−4 °C, +27 h)'
  F9:
    cita: 'Tisherman et al. 2016, Int J Surg (EPR for traumatic cardiac arrest). **FULL PDF READ (batch 46).** **A review that CORROBORATES, independently, the two anchors of C10:** (a) in **dog**, with flush in the distal abdominal aorta and brain at **10 °C**, acceptable neurological outcomes after **up to 120 min** of arrest — the same number as F30; (b) **the upper limit of arrest without impairment of learning or memory is 60 min** — the same as F42 in pig. It adds **measured optimal parameters**: tympanic target **10 °C** (better than 5 or 15), rapid induction at **2 °C/min** and gradual rewarming at **0.5 °C/min**. Pig (Rhee): <10 °C intracranial in 12 min, 90 min of low-flow extracorporeal circulation, **5/5 survive** (1 with injury). Pig with complex injuries and 1 h of EPR: **>75 % neurologically intact survival at 6 weeks**. Dog with 2 h of haemorrhagic shock and 1 h of EPR: **85 % survival** versus 0 % with conventional resuscitation'
    url: https://pubmed.ncbi.nlm.nih.gov/34859446/
    estatus: V
    cierra: 'closed in batch 46: primary read; corroborates flush_min and pig_min'
  F10:
    cita: 'Hibernating mammal torpor. **FULL PDF READ (batch 46):** Geiser and Kenagy 1988, Physiol Zool — duration of torpor bouts versus air (Ta), body (Tb) temperature and O2 consumption. **A result the framework did not have and that bounds the biological route:** from Ta = 8 °C down to 2 °C the torpor duration **increases** as Tb and VO2 fall, with Tb − Ta ≈ 1.5 °C maintained; but **on falling from 2 °C to −2 °C the trend REVERSES** and the duration drops, because the animal has to thermoregulate. ⇒ **For a hibernator there is an optimum near 2 °C: colder is NOT better.** It is the opposite limit to that of the physical route, where colder always helps (C2)'
    url: https://link.springer.com/chapter/10.1007/978-3-662-04162-8_7
    estatus: V
    cierra: 'closed in batch 46: primary read (torpor optimum ~2 °C)'
