  F47:
    cita: 'Fahy et al. 2026, bioRxiv preprint 2026.01.28.702375 v2 (5 Feb 2026). **SPECIES CORRECTION (2026-09-27, PDF read in full):** the paper evaluates only **RABBIT** and **HUMAN cortical biopsy** — pig does NOT appear experimentally; the only mention of pig is in the Intro/citation of ASC (McIntyre 2018). No neural-function tests (0 electrophysiological recordings, 0 LTP, 0 respiration). **New datum from the PDF:** DSC on human cortical biopsies (n=3): cooled at 1.0 °C/min + warmed at 160 °C/min → **zero ice melting** → CCR in human cortex perfused with M22 **≤ 1.0 °C/min** (upper bound measured directly). Protocol 2 (forced nucleation): also no ice. Mechanism: osmotic dehydration concentrates intracellular proteins from 15 % to 22 % w/w, suppressing nucleation → tissue is **more ice-resistant than pure 90 % M22 solution**. Terminal concentration: 102–105 % of M22 (≈9.9 M) in LM5+HES vehicle. No cracks at −140 °C. Human case (Dr. L.S. Coles): carotid cannulation at 2.5 h post-arrest; post-vitrification ultrastructure indistinguishable from young rabbits despite prior ischemia. **Verified batch 48 + PDF 2026-09-27:** still a bioRxiv preprint, no journal'
    url: https://www.biorxiv.org/content/10.64898/2026.01.28.702375v2
    estatus: P
    cierra: '[waiting] bioRxiv 2026.01.28.702375; closes on publication in a peer-reviewed journal'
