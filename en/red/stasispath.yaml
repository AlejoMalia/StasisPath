  CCR_M22:
    v: 0.1
    r:
    - 0.05
    - 0.15
    u: °C/min
    f: F2
    e: V
    d: 'critical cooling rate of M22. **DECLARED GAP (batch 51): it is not recorded whether it is for FREE SOLUTION or for TISSUE, and the difference matters.** Its source F2 vitrified M22 in **cryopreservation bags**, not in tissue. The framework itself holds proof that the effect exists: `CCR_VS55` declares ''tissue <1, solution 2.5'', a factor **>2.5**, and `CCR_VMP` is labelled as tissue. Literature exists (Uygun/Fahy, CPA loading in kidney tissue) reporting reductions of **up to ×5 in CCR** when the CPA is loaded into tissue; **the primary source has not been read and therefore the value is NOT moved** (R2). **If the tissue value were ×2.5 lower, the range would be [0.020, 0.060] and the verdict ''M22 fails at the centre of the trunk'' WOULD REVERSE**: the trunk rate is 0.0404 °C/min and the verdict requires CCR_M22 > 0.0404, which the current minimum (0.05) sustains by only ×1.24. Direction of the bias: if it is a solution value, the framework is **conservative** with M22 and the frontier moves in its favour. **BATCH 52 — the gap walked to the end in `es/20_cotas/cota_CCR_M22_tejido.py` (no value moved, R2). Three things batch 51 had not seen:** (1) **what actually moves is the FRONTIER, not an isolated verdict**: this parameter enters the derived quantity `b_CCR` and through it `M_de_CCR`, `LC_viable` and `masa_viable`; with a tissue factor of ×2.5 the viable mass goes from **10.9 to 41.9 kg** and with ×5 to **115 kg**, that is, the whole trunk enters the viable region. (2) **The `b_CCR` line already mixes labels today**, whatever M22''s is: it takes `CCR_VS55` at its **solution** value (2.5) and `CCR_VMP` labelled as **tissue**. Putting all three points in tissue, without touching M22, changes the slope from −1.739 to −1.518 decades/M. **The gap is not only ''what type is CCR_M22'': it is that the line does not declare the type of any of its three points.** (3) **`red/espacio.py` has the 0.10 written by hand** in its `CPAS` table instead of reading it from `parametros`: if one day this parameter is labelled and changes, `ESPACIO.md` would not find out (R4, impostor box: the same datum in two places). **What does NOT fall in any scenario:** the empty intersection of X2 (the axis M22 lacks is neural function, not CCR), the 0.425 °C/min requirement of the brain (it comes from C3 alone), the key verdict of C3 and that of C8 (both concern VMP) and the failure of the eutectic solvents by ×71. **DIRECTION RESOLVED (batch 54) with F87 [P]:** at **81 % of the M22 concentration** a rabbit brain vitrified **without ice**, and the authors state that this concentration **would not remain vitrified as a bare solution** ⇒ ''brain tissue may be more stable against ice than the solution it is perfused with''. **This confirms that a solution value is CONSERVATIVE for tissue**, the direction batch 51 predicted. **The value is NOT moved** (R2): F87 is organizational and gives no tissue CCR figure, only the direction. What is established is that the bias does **not** go where it would break the verdicts. **NEW BOUND (2026-09-27, F47 read in full):** Fahy et al. 2026 measured DSC directly on human cortical biopsies perfused with M22 (n=3): cooling at **1.0 °C/min** no ice was detected → the CCR in human cortex with M22 is **≤ 1.0 °C/min** (a measured upper bound, not a lower one). The mechanism is osmotic dehydration, which concentrates intracellular proteins to 22 % w/w, suppressing nucleation. **This bounds the gap** without resolving it: tissue is LESS demanding than free solution (0.1 °C/min), not MORE. Factor: tissue/solution ≥ 10× (CCR_tissue ≤ 1.0, CCR_solution = 0.1). **The value is NOT moved** (R2): the datum gives CCR_tissue ≤ 1.0, which is an upper bound, not the exact value nor a lower bound; the current range [0.05, 0.15] remains valid as an estimate of the CCR of free solution'
  CWR_M22:
    v: 0.4
    r:
    - 0.3
    - 0.6
    u: °C/min
    f: F2
    e: V
    d: 'critical warming rate of M22. **REGIME AND CORROBORATION (2026-09-27):** Fahy et al. 2004 (*Cryobiology* 48:157, read in full today) and Han & Bischof independently corroborate CWR ~0.4 °C/min after rapid cooling and <1.0 °C/min after slow cooling. A large object cools slowly by definition (C3: brain centre at 0.426 °C/min), so the relevant CWR in the slow regime is ~1.0 °C/min instead of 0.4. In C1 the maximum radius rewarmable by surface goes from 4.42 to 2.79 cm; the key verdict (''M22 cannot be surface-rewarmed in the trunk, r ~15 cm'') holds with both values. The value stays conservative.'
