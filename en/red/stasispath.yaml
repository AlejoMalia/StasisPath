  F19:
    cita: 'Consolidated primary anoxia data for *Trachemys scripta* / *Chrysemys picta* (freshwater turtles). **Reference primaries: Jackson 1968 (J Exp Biol 49:11, whole-body calorimetry in anoxic submersion), Herbert & Jackson 1985 (Physiol Zool 58:655, survival and metabolism at different T), Lutz & Chih 1992 (Am J Physiol 263:R1030, cerebral metabolic depression and channel arrest), Storey 2007 (Physiology 22:109, review of regulated mechanisms).** CONSOLIDATED MAGNITUDES (supplied by the user 2026-09-27, cross-checked against the primaries): whole body in anoxia at the same body T: ~10–20 % of the aerobic rate (depression ~80–90 %); in cold (~3 °C) + anoxia: ~0.5 % of aerobic at 20 °C, <0.01 % of the comparable mammal; anoxic survival at ~3 °C: 12–18 weeks (up to ~5.5 months through glycogen); survival at ~16 °C: ~2 weeks; brain in vivo: up to ~5 % of the normoxic rate; cortical slices: −37 % heat → −30 % ATP use (underestimates in vivo depression); early phase (1–2 h): ATP demand −70 to −80 %; sustained state: ~10–15 % of baseline; brain electrical activity: −75 to −95 %; extracellular GABA (striatum): up to ×80; Na⁺/K⁺-ATPase (24 h): −30 to −35 %; anoxic hepatocytes: ATP turnover −94 %; mechanism: channel arrest + GABA↑, REGULATED depression (reversible phosphorylation), ATP and energy charge are maintained. METHODOLOGICAL NOTE: slices underestimate in vivo depression because they arrive at the rig already depressed. **Lemur (F90) and lungfish (F91) already have their own primaries; this record covers only the turtle.**'
    url: https://pubmed.ncbi.nlm.nih.gov/20535765/
    estatus: V
    cierra: 'closed 2026-09-27: consolidated primary data (Jackson, Herbert & Jackson, Lutz & Chih, Storey) instead of abstracts; turtle22_h is backed with range [24, 36] h; F60 corroborates the long window (4–5 months at 3 °C)'
  F20:
