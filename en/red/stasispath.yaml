derivadas:
  LC_esfera:
    expr: 'lambda m: (3*m/(4*math.pi))**(1/3)/3'
    tipo: fn
    u: cm
    d: LC of an aqueous sphere of mass m (g)
  tasa_conv:
    expr: 'lambda LC: anc_rate*(anc_LC/LC)**exp_LC'
    tipo: fn
    u: °C/min
    d: convective cooling at the centre (C3)
  b_CCR:
    expr: (math.log10(CCR_M22) - (math.log10(CCR_VS55)+math.log10(CCR_VMP))/2) / (9.3-8.4)
    u: decades/M
    d: local slope of log10(CCR) versus molarity
  a_CCR:
    expr: (math.log10(CCR_VS55)+math.log10(CCR_VMP))/2 - b_CCR*8.4
    u: ''
    d: intercept of the CCR-molarity line
  M_de_CCR:
    expr: 'lambda ccr: (math.log10(ccr) - a_CCR)/b_CCR'
    tipo: fn
    u: mol/L
    d: molarity required for a given CCR
  M_toxico:
    expr: '9.28'
    u: mol/L
    d: molarity at which basal respiration halves
  LC_viable:
    expr: next(i/100 for i in range(25,2000) if M_de_CCR(tasa_conv(i/100)) > M_toxico)
    u: cm
    d: critical LC of F2
  masa_viable:
    expr: 4/3*math.pi*(3*LC_viable)**3/1000
    u: kg
    d: critical mass of F2
  tasa_canal:
    expr: 36.0/(15.5*60)
    u: °C/min
    d: beef half-carcass, 40->4 °C in 15.5 h (F79)
  razon_canal:
    expr: tasa_canal/tasa_conv(7.5)
    u: ''
    d: measured/predicted at the 150 kg scale
  limite_LNG:
    expr: 9.0/60
    u: °C/min
    d: industrial cooling limit without structural damage (F84)
