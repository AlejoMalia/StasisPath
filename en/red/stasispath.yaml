    estatus: P
    cierra: '**Batch 49: this record no longer supports any verdict.** It is removed from `deps` of V16, the only pathway that cited it: none of the four fields of V16 comes from F6 (all are from F16 and F69, verified on the full PDF in `es/20_cotas/auditoria_aristas_tanda49.py`). The edge was a fossil of the popular article this record replaced in batch 46. F6 is kept as a context reference (review read in full), and it CANNOT be repositioned where it would indeed be good support (G5, V17, layer E0) because in this network adding a [P] source to a [V] node downgrades it: the framework penalizes citing a review even if correct. Closing it would require reading the primaries it reviews, which is work this session cannot do'
