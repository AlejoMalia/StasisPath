    d: 'Exponent of the cooling law (rate ∝ LC^−n). Central = 2 (diffusion, theory). **MEASURED range** by fitting the three cited volumes in pairs (0.5 L→1 L: 2.18 · 0.5→3 L: 1.80 · 1→3 L: 1.67). It was previously fixed at 2 with no uncertainty. **Batch 42:** the 1 L point is **confirmed in the primary** (''~1 °C/min for a 1 L (LC~1.4 cm)'', summary of F2; the reconstruction from the slopes gave 1.402 cm and 0.998 °C/min). Fit of the three volumes: **n = 1.77–1.82 ± 0.10 (1 σ)**, but with 1 degree of freedom the two-sided 95 % CI is [0.45, 3.1]. ⇒ **The range is NOT a statistical CI: it is the physical ceiling n ≤ 2 (Biot, PRECISION.md) plus the measured shape/noise excess (0.18, pair 0.5→1 L)**. The central value is left at 2 and not at the fitted 1.8: at large LC (Bi 10–19) the local exponent tends to 2 and 1.8 would be optimistic exactly where C6 extrapolates. See L45'
