    cita: 'Nordeen & Martin 2019, Physiology 34:101, ''Engineering Human Stasis for Long-Duration Spaceflight''. **TWO PRIMARIES READ AND CONSOLIDATED (2026-09-27): (1) Gilbert et al. 2000, *The Lancet* 355:375–376** (DOI 10.1016/S0140-6736(00)01021-7; PMID 10665559; F13a / F88): clinical case of accidental hypothermia at **13.7 °C** in a woman (Anna Bågenholm), assisted with continued CPR, prolonged circulatory arrest (>3 h), rewarming by extracorporeal cardiopulmonary bypass; full physical and cerebral recovery. **(2) Bradford et al. 2014, NIAC Phase I Report (NASA Grant NNX13AP82G) and Phase II TechPort 88911** (SpaceWorks; F13b, F13c, F89): torpor habitat for transit to Mars; reduces habitable mass by **52 % to 68 %** relative to the reference TransHab habitat (from 41.5 t to 19.9 t); IMLEO reduction 25–44 %; metabolic support with parenteral nutrition and cooling to 31.4–34.2 °C. **Previously [P] for being a review; now [V] through its two primaries read in full.**'
