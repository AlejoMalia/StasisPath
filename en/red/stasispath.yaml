  F57:
    cita: 'Uygun, Taggart, Hassan, Lyon, Ozgur, Taveras, Mojoudi, Agius, Tessier, Markmann, Yeh, Longchamp, Toner 2026, **Research Square rs.3.rs-7820837 / NIH Public Access (PMC12869680)** and proceedings in **Am J Transplant 2024 (MO-8, S1600-6135(24)00812-8) and 2025 (S1600-6135(25)00885-8)**. **FULL MANUSCRIPT AND NUMERICAL SERIES READ (2026-09-27, supplied by the user):** partial-freezing protocol at **−15 °C** for 3 to 10 days in pig and human kidneys with protective perfusate (PEG 35k, 3-OMG, propylene glycol, trehalose and SnoMax nucleator). Quantitative results: (1) Porcine: real in vivo autotransplantation after 10 days at −15 °C with immediate urine production and recovery of function (MGH / Univ. Minnesota report / Kolata NYT 2025); n=6 at 10 days PF vs conventional SCS, which collapses; histology with 22.6 % less damage than SCS; (2) Human: n=4 (3 days) and n=3 (10 days) in discarded kidneys (KDPI 95, 18.9 h of prior ischemia), with creatinine clearance at ~50–57.5 % of the prior value, stable vascular resistance and urine production during 2 h of simulated transplant (normothermic reperfuser). A 30-day attempt produces severe damage (validated limit: 10 days).'
    url: https://doi.org/10.21203/rs.3.rs-7820837/v1
    estatus: V
    cierra: 'closed 2026-09-27: full NIH/Research Square manuscript, AJT 2024/2025 proceedings and in vivo autotransplantation documented'
  F58:
    cita: 'Dave, Prado, Raval, Drew, Perez-Pinzon 2006, Stroke 37:1261 (EUTHERMIC arctic ground squirrel, 8 min cardiac arrest: neuronal count no different from control at 7 days; control rats are indeed injured; PMID 16574920)'
