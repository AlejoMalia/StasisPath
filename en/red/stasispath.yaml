  F60:
    cita: 'Jackson & Ultsch 2010, J Exp Zool A 313:311 (painted and snapping turtles survive 4–5 months without O₂: metabolic depression + lactic-acid buffering by shell and bones; frogs do NOT survive even 1 week in anoxic water; PMID 20535765)'
    url: https://pubmed.ncbi.nlm.nih.gov/20535765/
    estatus: V
  F64:
    cita: 'Tessier et al. 2022, Front Phys (PMC10161798). **Full text read.** Ice modulators in partial freezing of rat liver at −10/−15 °C with 12 % v/v glycerol (1.64 M): **AFGP 0.5 mg/mL** (inhibits recrystallization, binds to the crystal) and **X-1000 0.1 % + Z-1000 0.2 %** (X inhibits recrystallization, **Z suppresses heterogeneous nucleation**). Unfrozen fraction ~60 % at −10 °C and ~73 % at −15 °C; 1–5 days; n = 4 per group, 13 controls. AFGP reduced oedema (p = 0.029) but damaged the endothelium; X/Z kept ATP and energy charge high but gave post-thaw oedema'
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC10161798/
    estatus: V
  F65:
    cita: 'Fahy, Wowk, Wu, Phan, Rasch, Chang, Zendejas 2004, Cryobiology 48:157–178. **Full PDF read (21cm.com).** It introduces the **viability–stability plot**: viability as K⁺/Na⁺ of rabbit renal cortex slices after washing out the CPA, against mWCR (the minimum warming rate that confines crystallization to ~0.2 % of the mass). **No-damage band: 93–103 % of untreated control.** M22 was designed to be used **at −22 °C**; at −3 °C its toxicity would be unacceptable. VM3 at 40 min gives intermediate K⁺/Na⁺, and at 30 min approaches the control'
    url: https://www.21cm.com/pdfs/cryopreservation_advances.pdf
    estatus: V
  F66:
    cita: 'Tessier, de Vries et al. 2022, Nat Commun 13:4008 (PMC9287450). **Full text read.** Partial freezing of rat liver at −10/−15 °C: propylene glycol 12 % v/v, 3-OMG 200 mM, trehalose and raffinose, PEG 5 %, **Snomax nucleator 1 g/L**. 5 days at −15 °C with O₂ and lactate comparable to control, **but much lower bile and very high enzymes (AST/ALT ~1270/768 versus ~79/35 U/L)**'
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC9287450/
    estatus: V
  F67:
    cita: Barnes 1989, Science 244:1593 (PMID 2740905). **Primary abstract verified.** Arctic ground squirrel hibernates with body temperature down to **−2.9 °C without freezing**; mean minimum in February −1.9 °C. **Plasma with normal solutes and NO evidence of antifreezes** ⇒ pure supercooling
    url: https://pubmed.ncbi.nlm.nih.gov/2740905/
    estatus: V
  F68:
    cita: 'Solanki, Bischof, Rabin 2017, Cryobiology (PMID 28192076). **Full PDF read.** Thermomechanical analysis of pillow-shaped cryobags, parameterized by half-length a = 61 mm and ratios b/a and c/a (c/a from 0.016 to 1). Findings: (1) **maximum stress does NOT occur with the bag filled to the maximum** (when it resembles a sphere); (2) the width/length ratio weighs heavily; (3) **lowering the initial warming rate between storage temperature and Tg reduces stress drastically**; (4) nanowarming also reduces it drastically'
    url: https://pubmed.ncbi.nlm.nih.gov/28192076/
    estatus: V
  F69:
    cita: 'Tomorrow Biostasis, report on the P-19 case (2024). **Full PDF reread, including the chronology tables and the CT analysis.** Team of 3 people, two prior shifts (3 and 4 days). **Chronology from cardiorespiratory arrest:** legal declaration ~1 h · arrival at the mortuary ~1 h 30 · chest compressions (LUCAS-2) and medication **1 h 43** · intubation 1 h 47 · end of stabilization 2 h 37 · start of surgery 4 h 09 · **START OF PERFUSION 4 h 40** · end of perfusion 9 h 04 · start of cooling **96 h** · end 127 h · cranial CT 198 h. Washout with 21 L of MHP-2; target CPA **65 % w/v**. **CT at −196 °C: 83.17 % of brain area exceeded 100 % of the target concentration and 97.42 % exceeded 92 %.** **Brain shrinkage of 36 %** (2D axial slice). Incident: temporary depletion of liquid N₂ around hour 85'
    url: https://www.tomorrowbio.com
    estatus: V
  F70:
    cita: 'Pamenter et al. 2018, PLOS One 13:e0208453. **Full PDF read.** Effect of cold (37 → 6 °C) in permeabilized mouse brain mitochondria: **Q10 of state II respiration = 2.61 ± 0.09 and state III = 3.92 ± 0.31**; H⁺ leak Q10 = 4.4. By complexes: citrate synthase and complexes I, III and IV poorly sensitive (Q10 1.2–2.4), complex II 4.2 and **complex V 11.3**. Agrees with ground-squirrel brown fat (2.4) and muscle/liver (2.8–6.5)'
    url: https://doi.org/10.1371/journal.pone.0208453
    estatus: V
  F71:
    cita: 'German et al. 2026, PNAS — **Supplementary information, full PDF read.** The authors state verbatim that they managed to **omit the ''Supercool'' polymers from the composition** and that they named it **''V3'' by reference to VM3** and for its three permeating solvents. Molar composition of V3: **2.85 M DMSO + 2.71 M EG + 2.86 M formamide = 8.42 M of permeating CPA**, plus 23–35 mM impermeant. Loading in steps of increasing concentration **at 10 °C** with LM5 or CI-VM-1 carrier. Whole brain: 8 min of loading at 1 mL/min, 25 min of bath perfusion at 4 °C, 2 min immersion in 65 % w/v V3 at −20 °C and then isopentane at −140 °C. They also tested EG at 61 % alone and EG 37.5 % + DMSO 12.5 %: **V3 gave the best functional recovery**'
    url: https://www.pnas.org/doi/suppl/10.1073/pnas.2516848123
    estatus: V
  F72:
    cita: 'German, Akdaş, Flügel-Koch, Erterek, Frischknecht, Fejtova, Winkler, Alzheimer and Zheng 2026, **PNAS 123(10):e2516848123** (PMID 41774797). **Batch 45: it is the SAME work as F46** — the bioRxiv preprint 2025.01.22.634384v3 that was cited here is its earlier version, with identical title and identical authors. F72 keeps the detailed numerical extract (concentration series) and F46 the LTP result; **the datum is no longer a preprint**. **Full PDF read.** Concentration series in slices, **CPA exposure WITHOUT cooling below −10 °C** to isolate the chemistry: basal respiration (pmol/min) control **173.3 ± 6.7** · 30 % w/v (4.28 M) **139.7 ± 3.1** · 59 % (8.42 M) **135.1 ± 6.7** · **65 % (9.28 M) 80.4 ± 5.6** (Spearman r = −0.90, p = 0.0002). Reserve capacity: 73.4 → 62.3 → 48.6 → **38.9**. The authors call it ''toxicity that increases sharply''. **And there was no difference between standard CPA exposure and complete vitrification** (135.1 vs 131.4; reserve 48.6 vs 50.6). Thresholds: no crystallization on cooling from 58 % w/v; successful recovery from **57 %**'
    url: https://www.biorxiv.org/content/10.1101/2025.01.22.634384v3
    estatus: V
    cierra: 'closed in batch 45: it is the same work as F46, PNAS 123(10):e2516848123'
  F73:
    cita: 'Buck & Barnes 2000, Am J Physiol 279:R255 (PMID 10896889). **Primary abstract verified.** Arctic ground squirrel in torpor: between Ta 0 and −16 °C Tb is maintained and the metabolic rate **rises more than 15-fold** from a minimum of 0.0115 mL O₂/g/h. **Between Tb 0 and 12 °C the rate does NOT change significantly: metabolic inhibition independent of temperature.** The global change from Tb 4 to 20 °C is equivalent to **Q10 = 2.4, but within that range the Q10 varies from 1.0 to 14.1**. Respiratory quotient 0.70 in stable torpor (lipids only); it rises above 0.85 at Ta −16 and 20 °C. **RQ correlates negatively with the maximum duration of the torpor bout**'
    url: https://pubmed.ncbi.nlm.nih.gov/10896889/
    estatus: V
  F74:
    cita: 'Tardigrade CAHS proteins and biological vitrification. **READ IN FULL (PMC5987194, 2026-09-27):** (1) **Boothby et al. 2017, *Mol Cell* 65:975–984** (DOI 10.1016/j.molcel.2017.02.018; PMC5987194): CAHS proteins (*cytosolic abundant heat soluble*) of *Hypsibius dujardini* vitrify in vitro by DSC and confer desiccation tolerance on heterologous yeast. **Survival correlates strictly with the glassy state** (Fig 7D, 7E): below the CAHS-induced Tg survival is high, falls sharply inside the Tg range and reaches zero when exceeded. **CORRECTION OF OUR OWN READING:** the earlier record cited ''Tg ~60 and ~135 °C'' — those numbers in the PDF were 60 µg/mL kanamycin and 135 kPa vacuum; the DSC curves show broad transitions dependent on residual moisture, with no fixed Tg. (2) **Gelation (Malki et al. / Sanchez-Martinez et al. 2024 / Tanaka et al. 2022, PLOS Biol):** CAHS form a gel by concentration-dependent network self-assembly: **>15 g/L (~0.6 mM) robust gel**, 10–15 g/L viscous, **<10 g/L (~0.4 mM) liquid/diffuse solution**. (3) **Debate:** Arakawa & Numata 2021 (*Mol Cell* 81:409) maintain that the thermal effect in DSC is dehydration and not Tg; Boothby et al. 2021 (*Mol Cell* 81:411) defend that residual water modulates a real Tg. **Key datum for the framework:** they vitrify at **~0.6 mM**, some 4 orders of magnitude below small solutes (~9 M). **Neighbouring field: anhydrobiosis**'
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC5987194/
    estatus: V
    cierra: 'closed 2026-09-27: PMC5987194 read in full; kanamycin/vacuum error corrected and Malki/Tanaka gelation context added'
  F75:
    cita: 'Roughton, Topp & Camarda 2012, Comput Chem Eng 36:10 (PMID 24385675). **Neighbouring field: pharmaceutical lyophilization.** Computational molecular design framework that **optimizes excipients** by maximizing the Tg of the anhydrous solute and minimizing the water content in the freeze-concentrated matrix. They develop quantitative structure-property relationships for **Tg of the anhydrous solute, Tg'', ice melting point and the Gordon-Taylor constant**, and solve the optimization with tabu search'
    url: https://pubmed.ncbi.nlm.nih.gov/24385675/
    estatus: V
  F76:
    cita: 'Mowry, Krüger, Drabbels and Lorenz (EPFL) 2025, **Phys Rev Research 7:013095** (DOI 10.1103/PhysRevResearch.7.013095; arXiv 2407.01087). **READ IN FULL (2026-09-27).** Method: electron microscopy with in situ time-resolved electron diffraction on a **206 nm** amorphous water film on graphene; ultrafast melting with a laser pulse (≥10⁸ K/s) followed by conductive cooling at controlled rate. **Directly measured value: CCR = (6.4 ± 0.5) × 10⁶ K/s = (3.84 ± 0.30) × 10⁸ °C/min** — at the low end of the historical spectrum (10⁵–10¹² K/s), validating the Dubochet 1981 estimate (~10⁶ K/s) and ruling out the models that demanded >10⁸ K/s. Extrapolation to zero concentration from CPA solutions: ~2.5 × 10⁵ K/s; the real value is **×25 higher**, confirming that the CCR↔concentration curve is convex (nonlinear) near 0 M. With added CPA the CCR falls by >7 orders of magnitude. Critical thickness without CPA: LC* ≈ √(α·ΔT/CCR) ≈ **1.5 µm** (agrees with cryo-EM practice). With high-pressure freezing (2000 bar, Tm drops to −22 °C) the required CCR falls ×100 → thickness up to ~200 µm. **Distant field: electron cryomicroscopy**'
    url: https://doi.org/10.1103/PhysRevResearch.7.013095
    estatus: V
    cierra: 'closed 2026-09-27: read in full via arXiv; value measured directly with uncertainty'
  F77:
    cita: 'Lu and Liu 2002, **Acta Mater 50:3501–3512** (DOI 10.1016/S1359-6454(02)00166-0). **READ IN FULL (2026-09-27).** They define Trg = Tg/Tl and **γ = Tx/(Tg+Tl)**. They formulate two explicit equations with R²=0.91 spanning 6 orders of magnitude: **R_c = 5.1 × 10²¹ · exp(−117.19 γ) K/s** (critical cooling rate — exact analogue of CCR) and **Z_c = 2.80 × 10⁻⁷ · exp(41.70 γ) mm** (critical section thickness — exact analogue of LC*). Range of γ: marginal glasses 0.35 → Vitreloy 1 (Zr-Ti-Cu-Ni-Be) ~0.43 → best Pd-Cu-Ni-P alloys ~0.45. Vitrifiable section: γ=0.35 → 0.6 mm; γ=0.40 → 4.9 mm; γ=0.43 → 11–17 mm; γ=0.45 → ~40 mm (experimental Pd up to 72–80 mm). γ correlates better than Trg because it integrates devitrification kinetics (Tx) in addition to the thermodynamic limits. The Turnbull criterion (Trg>2/3) is theoretically sufficient but practically unattainable in metals. **Distant field: materials science** — the γ design framework is transferable to cryoprotectants: CCR and LC* as functions of measurable thermodynamic parameters'
    url: https://doi.org/10.1016/S1359-6454(02)00166-0
    estatus: V
    cierra: 'closed 2026-09-27: read in full; Rc and Zc equations verified with numerical data'
  F78:
    cita: 'Black bear hibernation. **FULL PDFs READ (batch 46).** **Muscle** (Fedorov, Garreau, Tøien, Barnes and Goropashnaya 2025, Ecol Evol 15:e71669): **limited** loss of muscle mass and protein despite months of immobility and fasting; the expression profile shows maintenance of protein biosynthesis via the **mTORC1** pathway and preservation of branched-chain amino acids (BCAA). **Bone** (Sci Rep 2021, 41598_2021_87785): **no bone-mass loss in 4–6 months of immobility**, with **coordinated downregulation of the bone-resorption genes** and no changes in those of formation ⇒ bone is not lost because **resorption is switched off**, not because more is made'
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC8050052/
    estatus: V
    cierra: 'closed in batch 46: both primaries read'
  F79:
    cita: 'Industrial refrigeration of beef carcasses. **TWO SOURCES READ (2026-09-27):** (1) **Cano-Muñoz 1991, FAO Animal Prod Health Paper 92**, *Manual on meat cold store operation and management*, ch. T0098E02 — technical guide of industrial practice: half-carcass ~150–200 kg, core at **40 °C** post-mortem (transiently 40–41 °C by anaerobic glycolysis), mean of **~15 °C at 4 h** in a rapid tunnel, stabilization at **~4 °C at 15–16 h** (continuous two-phase process); tunnel freezing at −30/−35 °C, air 2–4 m/s: **16–20 h** for a half-carcass. Air temperature: 0 °C (range −1 to +1 °C), RH 90–95 %. Effective mean rate: (40−4)/15.5 h = 2.32 °C/h = **0.0387 °C/min**. (2) **Mallikarjunan & Mittal 1994, J Food Eng 23:277–292** — 2D finite-element model validated against experimental profiles (±2.7 °C); it is a SIMULATION, not a primary measurement campaign — the caveat of L34 is correct. **Key datum for the graph:** the rate 0.0387 °C/min vs. C3 predicted for LC≈7.5 cm confirms LC⁻ⁿ scaling at 100+ kg. **Distant field: food industry**'
    url: https://www.fao.org/4/t0098e/t0098e02.htm
    estatus: V
    cierra: 'closed 2026-09-27: FAO manual read directly; Mallikarjunan 1994 identified as a simulation (caveat already declared in L34)'
  F80:
    cita: 'Jesus, Duarte and Paiva 2022, Sci Rep 12:8095. **FULL PDF READ (batch 46).** NADES as a vitrification medium in **L929 (mouse fibroblast) and HaCaT (human keratinocyte) cell lines**, at **50 % w/v**, frozen by **direct immersion in liquid N2** in cryovials. **CORRECTION OF AN ERROR OF OUR OWN:** the earlier record said ''94.65 % viability in human mesenchymal stem cells, no difference from DMSO''. **That number does NOT appear in the article and no stem cells are studied** (they are only mentioned as future work); viability is reported as optical density, not as a percentage. **DATUM THE FRAMEWORK NEEDED, and it runs against it:** in DSC cooling at **30 °C/min the NADES at 50 % w/v CRYSTALLIZE** (Tc onset: BetSucProW −26.6, BetTreW −32.3, TreGluSorW −31.0; pure water −23.7) ⇒ **CCR > 30 °C/min**. Under the same conditions **50 % v/v DMSO does NOT crystallize** ⇒ at this concentration the NADES vitrify WORSE than DMSO. The concentration is limited to 50 % by toxicity and viscosity. The authors call N2 immersion (15 000–30 000 °C/min) ''vitrification'', not a low-CCR glass'
    url: https://www.nature.com/articles/s41598-022-12365-4
    estatus: V
    cierra: 'closed in batch 46: primary read; refutes the shortcut of L44'
  F81:
    cita: 'Neuronal tolerance to hypoxia in the hooded seal (*Cystophora cristata*). **THREE PRIMARIES READ (2026-09-27): (1) Folkow, Ramirez, Ludvigsen, Ramirez and Blix 2008, *Neurosci Lett* 446:147–150** (DOI 10.1016/j.neulet.2008.09.040; PMID 18824079): **intracellular recordings** in visual cortex slices. Mouse: depolarization −65.0 mV, firing ceases at **5 ± 2 min**. Seal: depolarization −13.4 mV, mean firing **19 ± 10 min**, maximum **60 min** in continuous severe hypoxia. **CORRECTION:** the earlier record attributed this comparison to Mitz; it comes from Folkow. **(2) Mitz, Reuss, Folkow, Blix, Ramirez, Hankeln and Burmester 2009, *Neuroscience* 163:552–560** (DOI 10.1016/j.neuroscience.2009.06.058; PMID 19576963): IHC + Western blot. In terrestrial mammals neuroglobin (Ngb) and cytochrome c are **neuronal**; in the hooded seal both are **in fibrous astrocytes** (GFAP+), with neuronal cell bodies almost undetectable. Total cerebral Ngb concentration does not differ between seal and mouse — the adaptation is the **inversion of compartmentalization**. **(3) Hoff, Fabrizius, Czech-Damal, Folkow and Burmester 2017, *PLOS ONE* 12:e0169366** (DOI 10.1371/journal.pone.0169366; PMID 28046118): RNA-Seq after 1 h of hypoxia (1 % O₂) and 1 h of reoxygenation. Repression of ion channels and synaptic transmission; overexpression of MCT4 (rapid expulsion of neuronal lactate); chaperones Clusterin and S100B; cytochrome c and LDHB in astrocytes confirm **rANLS** (neuron→astrocyte lactate, the inverse of the classic ANLS). **Distant field: diving physiology**'
    url: https://www.frontiersin.org/journals/physiology/articles/10.3389/fphys.2019.01199/full
    estatus: V
    cierra: 'closed 2026-09-27: three primaries read in full (Folkow 2008, Mitz 2009, Hoff 2017)'
  F82:
    cita: 'B1 field homogeneity at 7 T. **TWO PRIMARIES READ IN FULL (batch 55), which replace the reviews this record cited:** (a) **Investigative Radiology, ''Ready for Routine: Homogeneous, High-Resolution and Multicontrast Whole-Brain MRI at 7 Tesla…''** — **IN VIVO** measurement: 10 healthy volunteers scanned, plus B1 maps of **82 subjects at 3 centres** (Bonn and others). It states that the B1 inhomogeneities ''**result from radiofrequency interferences and dielectric resonances** at the Larmor frequency of **300 MHz at 7 T**'' and that they degrade quality **above all in the eccentric infratentorial regions**, to the point of limiting clinical use. It is exactly the wave mechanism that L37 contrasts. (b) **arXiv 1911.05313, ''B1+ Homogenization in 7T MRI''** — an electromagnetic model declaring **εr = 64** for tissue at 7 T, which is the permittivity with which the wavelengths of L37 are reproduced. **Previously [P] for being reviews; now [V] for primaries read**'
    url: https://journals.lww.com/investigativeradiology/fulltext/9900/ready_for_routine__homogeneous,_high_resolution,.394.aspx
    estatus: V
    cierra: 'closed in batch 55: two primaries read in full, one with in vivo measurement'
  F83:
    cita: 'Fetal and neonatal tolerance to hypoxia. **TWO SOURCES READ (2026-09-27): (1) Giussani 2016, *J Physiol* 594:1215–1230** (DOI 10.1113/JP271099; PMC4721497; PMID 26678231) — *brain sparing*: bradycardia of **25–35 %** in moderate hypoxia (up to 50–60 % in severe asphyxia), mediated by vagal carotid chemoreflex. Cerebral vasodilation by **adenosine** (main mediator). Peripheral vasoconstriction by catecholamines. Fetal temperature *in utero* does NOT fall (the fetus is clamped to the mother via the placenta); the fall in temperature is a response of the **neonate** (4–8 °C in rodents, 2–4 °C in humans). Hypometabolism: the fetus reduces VO₂ by a further **30–50 %** in acute asphyxia. **(2) Singer 1999, *Comp Biochem Physiol A* 123:221–234** (DOI 10.1016/S1095-6433(99)00057-4) — origin of the framework''s verbatim phrases: ''hibernation-like deviation from Kleiber allometry'' (fetal metabolic rate ~equal to adult, not ×3–8 as Kleiber predicts), ''hypoxic hypometabolism'', ''acidotic torpor'', ''cerebral vulnerability comparable to that of the diving turtle''s brain''. Tolerated anoxia duration: **rat neonate 40–50 min** vs adult 1.5–3 min (×20–30); **dog neonate 20–30 min** vs adult 3–5 min (×5–8); term fetus (lamb/monkey) **8–12 min** of total occlusion. Ontogenic gradient: anoxic tolerance **decreases progressively** from early fetus (~25 min) → term (~10 min) → adult (~2 min). Mechanisms: GABA (channel arrest), NMDA silencing, cardiac glycogen (Dawes 1959). **Distant field: perinatal physiology**'
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4721497/
    estatus: V
    cierra: 'closed 2026-09-27: Giussani 2016 (PMC4721497) and Singer 1999 read; fetus vs neonate nuance in temperature declared'
  F84:
    cita: 'Wang, Webley and Hughes (Monash Univ.) 2025, **Energy 334:137568** (DOI 10.1016/j.energy.2025.137568; PII S0360-5442(25)03210-4). **READ IN FULL (2026-09-27).** Title: *''Cooldown strategies for ship-borne cryogenic storage tanks during the ballast voyage''*. Industrial safe rate: **< 9–10 °C/h = 0.150 °C/min** (standard EN 14620-5; non-exceedable limit 15 °C/h for cryogenic membranes; maximum spatial gradient 50 °C between adjacent sensors). Scale: tanks of 35,000–45,000 m³ (16,000–20,000 t of LNG per tank on an LNG carrier); onshore tanks 100,000–200,000 m³. Cooldown time from ambient temperature: **8–12 h** (from hot post-dock: 18–24 h). Physical reason: thermal stress from differential contraction (σ_th ≈ E·α·ΔT/(1−ν)); AISI 304L steel α≈16×10⁻⁶ K⁻¹, modulus ~190–210 GPa. Materials: austenitic stainless steel (GTT Mark III), Invar Fe-36Ni (NO96) or aluminium 5083 (Moss). **EXACT COINCIDENCE WITH C3 (declared in L38):** C3 predicts for LC ~3.9 cm (human body) a rate of 0.150 °C/min — identical to the industrial limit of F84. The meaning: cryogenic engineering has used for decades the same rate that thermal conduction imposes on the human body. **Distant field: cryogenic engineering**'
    url: https://doi.org/10.1016/j.energy.2025.137568
    estatus: V
    cierra: 'closed 2026-09-27: Wang et al. 2025, Elsevier journal Energy, peer-reviewed; data from standard EN 14620-5 and LNG carriers'
  F85:
    cita: 'Bruinsma, Berendsen, Uygun et al. — supercooling and rat liver transplantation (Nat Protoc 2015, nprot.2015.011). **FULL PDF READ (batch 46).** Rat liver is cooled to **−6 °C without freezing and remains viable for up to 96 h**, with **real orthotopic transplantation** (unlike F8 and F22, which only simulate). Survival: **100 % at 72 h and ~58 % at 96 h**'
    url: https://pubmed.ncbi.nlm.nih.gov/24973919/
    estatus: V
    cierra: 'closed in batch 46: primary read (protocol and survival)'
  F86:
    cita: 'Martin, Kula, Krishnan, Murphy et al. 2019, Nat Metab 1:966 (PMID 32395697). **Neighbouring field: transplant metabolomics.** They compare WARM and COLD ischemia in mouse, pig and **human** heart. **Succinate accumulation** is the common feature of ischemia in the three species; cold **slows its generation** and thus reduces reactive-oxygen-species damage on reperfusion. The unavoidable periods of warm ischemia during procurement accumulate **harmful levels of succinate despite cooling as fast as possible**, and the damage is **attenuated by metabolic inhibitors** that prevent its accumulation and oxidation'
    url: https://pubmed.ncbi.nlm.nih.gov/32395697/
    estatus: V
  F87:
    cita: 'Gregory M. Fahy et al. 2004, **Cryobiology 48(1):22–35** (DOI 10.1016/j.cryobiol.2003.11.004) and **Cryobiology 48(2):157–178** (DOI 10.1016/j.cryobiol.2004.02.002). **TWO PEER-REVIEWED PRIMARIES READ IN FULL (2026-09-27): they replace the Alcor 2005 technical reference.** (1) *Cryobiology 48:22–35*: formalization of the qv* parameter (intensity of water hydrogen bonds vs toxicity), design of non-toxic solutions at high concentration (VM3, 8.4 M), use of PVP K12 and ice blockers (X-1000, Z-1000). (2) *Cryobiology 48:157–178*: **''Cryopreservation of organs by vitrification: perspectives and recent advances''**. Exact properties of M22: total concentration 9.345 M (64.8 % w/v), pH 8.0, tonicity 1.5×, estimated Tm −54.9 °C. **CWR < 1.0 °C/min** (DSC limit); mWCR ≈ 0 °C/min (on warming at 1 °C/min from below Tg of −124 °C no melting endotherm is shown). Perfusion in rabbit kidney at −22 °C for 25 min with simultaneous rapid rewarming to −3 °C: full renal function after autotransplantation (creatinine normalized to baseline). Kidneys cooled to −45 °C: 8 of 8 survivors. DSC biopsies of subregions: devitrification in cortex suppressed (0.0 J/g); inner medulla <2 % and pelvis <4 % of ice mass. Confirms superior glass stability in tissue versus bare solution at submaximal concentrations.'
    url: https://doi.org/10.1016/j.cryobiol.2004.02.002
    estatus: V
    cierra: 'closed 2026-09-27: both peer-reviewed primaries read in full (Cryobiology 48:22 and 48:157)'
  F88:
    cita: 'Gilbert, Busund, Skagseth, Nilsen and Solbø 2000, **Lancet 355:375–376**, ''Resuscitation from accidental hypothermia of 13·7 °C with circulatory arrest''. **FULL PDF READ (batch 54).** Literal chronology: she stops moving at **19:00** (clinically dead, immediate basic CPR), bypass flow reached at **21:50**, rectal temperature **13.7 °C at 21:52**, fibrillation at 22:00 that reverts on its own to a rhythm with pulse **15 min later**. Initial temperature measured on arrival: 14.4 °C. Taken off bypass after **179 min**. **It is the primary of the case that the network held via F13 (a review)**'
    url: https://pubmed.ncbi.nlm.nih.gov/10665559/
    estatus: V
  F89:
    cita: 'Bradford, Schaffer and Talk — **NIAC Phase I, ''Torpor Inducing Transfer Habitat For Human Stasis to Mars''** (SpaceWorks, executive summary, May 2014; Grant NNX13AP82G). **FULL PDF READ (batch 54 + confirmed with the direct PDF 2026-09-27).** Literal figure for habitat mass reduction: ''Compared to the current NASA reference **TransHab** design, the torpor-enabled habitats indicated **mass reductions ranging from 52 % to 68 %**, depending on the specific configuration, for the same mission''. IMLEO reduction: **25 % to 44 %** (literal: ''IMLEO mass reductions ranging from 25% to 44% were achieved'' — CORRECTION: batch 54 noted ''25–35 %'', a misreading; the PDF says **44 %**, not 35 %). With the same mass the crew can be **doubled**. Assumed torpor: 200 days of outbound transit + 200 of return (400 days total). Temperature: reduction of 5–10 °F (2.8–5.6 °C) from 37 °C → range of 31.4–34.2 °C. Supporting clinical evidence cited: up to **14 days** of continuous therapeutic hypothermia in humans. **It is the primary of the 52–68 % that the network held via F13 (a review) and that the batch 52 audit flagged as not located**'
    url: https://www.nasa.gov/wp-content/uploads/2016/04/Bradford_2013_PhI_Torpor.pdf
    estatus: V
  F90:
    cita: Dausmann, Glos and Heldmaier 2009, **J Comp Physiol B 179:345–357**, 'Energetics of tropical hibernation'. **ORIGINAL PAPER, full PDF read (batch 55).** It measures **oxygen consumption and body temperature of *Cheirogaleus medius* (Malagasy primate) IN ITS NATURAL HIBERNACULA**. The tree-hollow temperature and the body temperature fluctuate in parallel, and the metabolic rate varies with them. In well-insulated hollows both remain relatively stable. **It is the lemur primary that V09 cited via F19 (abstracts)**
    url: https://doi.org/10.1007/s00360-008-0318-0
    estatus: V
  F91:
    cita: Niu, Guan, Wang, Jiang et al., **Frontiers in Genetics**, 'Aestivation induces widespread transcriptional changes in the African lungfish'. **ORIGINAL RESEARCH, full PDF read (batch 55).** Transcriptome of *Protopterus annectens* after **6 months of experimental aestivation**. **DATUM THAT CORRECTS THE FRAMEWORK:** it states that the natural aestivation of *P. annectens* 'lasts **seven or 8 months**, depending on the length of the dry season'. **The network claimed 3–4 YEARS in V11 and no primary supports it**
    url: https://www.frontiersin.org/articles/10.3389/fgene.2023.1096929
    estatus: V
  F92:
    cita: 'Storey, Kenneth B. 2004, **Int Congr Ser 1275:47–54** (doi:10.1016/j.ics.2004.08.072), ''Molecular mechanisms of anoxia tolerance''. **FULL PDF READ (2026-09-27).** Species: *Trachemys scripta elegans*. Experimental temperature: **7 °C**, 20 h of anoxic immersion in N₂-bubbled water. Measured data: (1) **10–20 %** residual whole-body metabolic rate in anoxia vs normoxia at the same body T (citing Jackson 2001 — same figure as F19); (2) **94 %** reduction of net ATP turnover in isolated hepatocytes (**6 %** remains), with the Na⁺/K⁺-ATPase pump going from 28 % to **62 %** of the ATP budget, and protein synthesis/degradation inhibited by **>90 %**; (3) transcripts of voltage-dependent K⁺ channels in brain reduced to **18.5 %** of normoxic levels after 4 h of anoxia (Prentice et al. 2003); (4) ecological survival of 3–4 months in cold deoxygenated water (Jackson 2001). No survival data at T > 16 °C. **This source confirms and details F19 (whole-body and hepatocyte data) at the molecular level; it does not supply the turtle22_h datum (22 °C)**'
    url: https://doi.org/10.1016/j.ics.2004.08.072
    estatus: V
    cierra: 'closed 2026-09-27: PDF read in full; consolidates and details the F19 data on anoxia in Trachemys'
  F93:
    cita: 'Bradford, Williams, Ricano-Cadenas — **NIAC Phase II, ''Advancing Torpor Inducing Transfer Habitats for Human Stasis to Mars''** (SpaceWorks, Project ID 88911, 2016–2018). **FULL PDF READ (2026-09-27, NASA TechPort record).** It is Phase II of the project whose Phase I is F89. Starting TRL: 2; final TRL: 3. Four work areas: (i) medical assessments (torpor induction via TH + TPN, tests in animal models), (ii) habitat design to Mars, (iii) extensibility beyond Mars (Martian moons, asteroid, Jupiter, Saturn), (iv) technology roadmap. It includes no itemized mass tables. **Context for the graph:** it closes the technological trajectory of the SpaceWorks project: Phase I (2014, F89) → Phase II (2018, F93). L8 no longer needs this source in deps because F89 suffices for the verdict'
    url: https://techport.nasa.gov/view/88911
    estatus: V
  F31:
    cita: Warner et al. 2023 (PMC10668850), CPA perfusion in pig and human kidneys of 150–220 g
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC10668850/
    estatus: V
