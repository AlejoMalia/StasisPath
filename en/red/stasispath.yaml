  F59:
    cita: 'Kavian, Sellers, Sanchez, Alvarez, Aguilar, Powell-Palm 2025, Sci Rep 15:27903 (cryomacroscope + segmentation + FEM: cracking depends strongly on the Tg of the solution; 4 chemistries with > 50 °C range in Tg; PMID 40745362)'
    url: https://pubmed.ncbi.nlm.nih.gov/40745362/
