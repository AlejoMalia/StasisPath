  F47: {cita: "Fahy et al. 2026, preprint bioRxiv 2026.01.28.702375 v2 (5-feb-2026). **CORRECCIÓN DE ESPECIE (2026-09-27, PDF leído entero):** el paper evalúa solo **CONEJO** y **biopsia cortical HUMANA** — el cerdo NO aparece experimentalmente; la única mención a cerdo es en Intro/cita de ASC (McIntyre 2018). Sin pruebas de función neural (0 registros electrofisiológicos, 0 LTP, 0 respiración). **Dat nuevo del PDF:** DSC sobre biopsias corticales humanas (n=3): enfriado a 1.0 °C/min + calentado a 160 °C/min → **cero fusión de hielo** → CCR en corteza humana perfundida con M22 **≤ 1.0 °C/min** (cota superior medida directamente). Protocolo 2 (nucleación forzada): también sin hielo. Mecanismo: la deshidratación osmótica concentra proteínas intracelulares del 15% al 22% p/p, suprimiendo nucleación → el tejido es **más resistente al hielo que la solución pura de M22 al 90%**. Concentración terminal: 102–105% de M22 (≈9.9 M) en vehículo LM5+HES. Sin grietas a −140 °C. Caso humano (Dr. L.S. Coles): canulación carotídea a 2.5 h post-paro; ultraestructura post-vitrificación indistinguible de conejos jóvenes pese a isquemia previa. **Verificado tanda 48 + PDF 2026-09-27:** sigue preprint bioRxiv, sin revista", url: "https://www.biorxiv.org/content/10.64898/2026.01.28.702375v2", estatus: P, cierra: "[espera] bioRxiv 2026.01.28.702375; cierra al publicarse en revista con revisión por pares"}
