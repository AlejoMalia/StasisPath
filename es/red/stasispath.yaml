  anc_LC:     {v: 2.2,    r: [2.1, 2.35],   u: "cm",  f: F2,  e: V, d: "LC de la bolsa de 3 L. **Definición CONFIRMADA en la primaria:** el paper publicado dice literalmente «the characteristic length for heat transfer is defined as **L_C (= Volume/Surface Area)**», exactamente la definición de C3. Espesores fuera de plano declarados: 5.5, 6.5 y 10.5 cm para 0.5, 1 y 3 L. Rango estrechado de [2.0, 2.4] (supuesto mío) a [2.1, 2.35], acotado por la diferencia entre el valor citado (2.2) y mi reconstrucción V/A desde el espesor (2.34). **Comprobación previa:** con el espesor declarado (10.5 cm) y V = 3 L, LC = V/A da 2.34 frente a 2.2 citado (razón 1.06); en 0.5 L y 1 L las razones son 1.06 y 1.13 ⇒ la LC de Bischof ES V/A, la misma definición que usa C3"}
  exp_LC:     {v: 2.0,    r: [1.67, 2.18], u: "",    f: F2,  e: V, d: "Exponente de la ley de enfriamiento (tasa ∝ LC^−n). Central = 2 (difusión, teoría). **Rango MEDIDO** ajustando los tres volúmenes citados por pares (0.5 L→1 L: 2.18 · 0.5→3 L: 1.80 · 1→3 L: 1.67). Antes estaba fijado a 2 sin incertidumbre. **Tanda 42:** el punto de 1 L queda **confirmado en la primaria** («~1 °C/min for a 1 L (LC~1.4 cm)», resumen de F2; la reconstrucción desde las pendientes daba 1.402 cm y 0.998 °C/min). Ajuste de los tres volúmenes: **n = 1.77–1.82 ± 0.10 (1 σ)**, pero con 1 grado de libertad el IC 95 % bilateral es [0.45, 3.1]. ⇒ **El rango NO es un IC estadístico: es el techo físico n ≤ 2 (Biot, PRECISION.md) más el exceso de forma/ruido medido (0.18, par 0.5→1 L)**. El central se deja en 2 y no en el 1.8 ajustado: a LC grande (Bi 10–19) el exponente local tiende a 2 y 1.8 sería optimista justo donde C6 extrapola. Ver L45"}
