afirmaciones:
  O1: {capa: ontologia, e: V, deps: [F14, F15], t: "Estasis = preservación **demostrablemente reversible**. Preservación informacional (ASC, criónica) = otro programa (E0). Sólo la primera es residual clínico o espacial."}
  O2: {capa: ontologia, e: V, deps: [F27, C7], t: "La muerte legal es **permanencia** (no se reanimará), declarada a los {legal_obs} min sin circulación (≤ 5 mmHg). La irreversibilidad física es otro eje: la célula sigue recuperable a ≥ {tau_cel} min."}
  O3: {capa: ontologia, e: M, deps: [F1, F28, F29, F23], t: "Escala de éxito: E0 estructura · E1 célula · E2 tejido o memoria en organismo simple · E3 órgano trasplantado · E4 animal completo · E5 humano con memoria."}
  G1: {capa: magnitud, e: V, deps: [C2, C7], t: "**τ_eq** = ∫Q10^((T−37)/10)dt. Organismo tras parada cardíaca, buen resultado reproducible: τ_org ≤ {C7.tau_org_good} min; sobrevive con déficit: {C7.tau_org_surv} min. **Existencia (n = 1, isquemia sólo cerebral):** {tau_org_exist} min con función integrativa recuperada. Célula: ≥ {C7.tau_cel} min."}
  G2: {capa: magnitud, e: V, deps: [F2, F11, F32, F35], t: "**f_hielo,intra** = 0 (obligatorio). **f_hielo,extra** > 0 tolerable sólo con crioprotector y nucleación controlados (rana en el campo: {frog_days} días; hígado de rata: 10 días; tejido cerebral humano y organoides de 2–3 mm por congelación lenta MEDY: 1.5 años con actividad de red parcial)."}
  G2b: {capa: magnitud, e: V, deps: [F11, F32], t: "**La tolerancia depende del protocolo de entrada, no sólo del tejido:** la misma rana de Alaska aguanta {frog_days} días congelada en el campo, pero en el laboratorio muere 4/4 tras 12 semanas a −4 °C (2/4 tras 8 semanas). En el campo acumula glucosa (hígado ~194 µmol/g) y urea (~106 µmol/mL) mediante ciclos de congelación y descongelación. ⇒ Para StasisPath, la carga del crioprotector (tiempo, ciclos, temperatura) es una variable de estado, no un detalle."}
  G6: {capa: magnitud, e: V, deps: [F34], t: "Referencia del brazo de control de P15: MICrONS (1 mm³ de corteza de ratón fijada, ~200 000 células, ~523 M sinapsis). Incluso en el control, la segmentación automática necesita corrección humana ⇒ la trazabilidad debe normalizarse a un control del mismo laboratorio (como ya exige P15). **No aporta datos del brazo criogénico: P15 sigue abierto.**"}
  G3: {capa: magnitud, e: V, deps: [F2, F59, F68], t: "**ΔT_vidrio** < {dT_crack} K para no agrietar (verificado hasta 3 L con recocido). **Segunda variable, medida en campo vecino (F59):** el agrietamiento depende fuertemente de la **Tg de la solución** — a mayor Tg, menos tensión acumulada (4 químicas con > 50 °C de rango, criomacroscopio + elementos finitos). ⇒ La Tg deja de ser un dato pasivo y pasa a ser **variable de diseño**: elegir CPA por Tg, no sólo por CCR y toxicidad. **Tercera y cuarta variables (F68, modelo termomecánico de bolsas):** la **forma** del recipiente (el estrés máximo NO aparece con la bolsa llena al máximo, y la razón anchura/longitud pesa mucho) y la **velocidad de calentamiento inicial entre almacenamiento y Tg**, cuya reducción baja drásticamente el estrés. El nanowarming también lo reduce. ⇒ El agrietamiento tiene ya **cuatro palancas medidas**: ΔT, Tg, geometría y perfil de recalentamiento."}
  G4: {capa: magnitud, e: V, deps: [F26, C8, F55, F39, F40], t: "**D_CPA = ∫ f(qv*) · g(T) · C(t) dt — forma de la ley cerrada, umbral universal inexistente (y se explica por qué).** Las tres dependencias están ahora medidas: **composición** vía qv* (F26, 20 soluciones) · **temperatura** (F55: PROH 1.5 M degenera 54.2 % de ovocitos a 23 °C y **85 % a 37 °C**, misma concentración y mismo tiempo; F39: M22 9.3 M es tolerable a −22 °C con lavado al calentar) · **concentración y tiempo** (F55: bajar PROH de 1.5 a 0.75 M combinado con DMSO elimina la toxicidad). **No existe umbral universal porque D_CPA no es una propiedad del CPA sino del cuádruple (composición, T, t, protocolo)** — es exactamente lo que demuestra E7. Criterio operativo de aceptación: G4b."}
  L14: {capa: ley, e: V, deps: [G7, C11, F53, F66], t: "**Conflicto de velocidad de enfriamiento entre dos vías propias (detectado al cerrar G7).** La lesión por frío se reduce **atravesando rápido** la banda de 0–20 °C, pero el hielo **extracelular** controlado exige enfriar **lento** (0.1–1 °C/min) para que la célula se deshidrate. Las dos vías que más prometían (sobreenfriamiento V05/V18 y congelación parcial V06) pasan obligatoriamente por esa banda. ⇒ **El protocolo óptimo no es monótono: rápido de 20 a 0 °C y lento por debajo.** Es una predicción nueva del marco, no copiada de ninguna fuente."}
  L15: {capa: ley, e: V, deps: [F58, L2, C2], t: "**El dominio de C2 se confirma con un mamífero, no sólo con ectotermos.** La ardilla ártica **eutérmica** (37 °C, sin hibernar) resiste 8 min de parada cardíaca con el recuento neuronal indistinguible del control a 7 días, mientras que las ratas control sí se lesionan (F58). ⇒ La tolerancia no viene del frío ni de estar en torpor: es **bioquímica de especie**. Confirma la restricción que L2 ya declaraba («tejido de mamífero **sin reprogramación bioquímica**») y demuestra que esa reprogramación **existe en un mamífero** y es, en principio, transferible: es la mejor diana concreta para ampliar τ_eq en humanos."}
  L13: {capa: ley, e: V, deps: [F71, F46, F37b], t: "**La composición del CPA, no la física de la vitrificación, decide el resultado funcional — y en el único caso con LTP medida, la LTP se conserva.** **CERRADA en la tanda 48 por dato ya presente sin cruzar (patrón C10/L11) + dependencia innecesaria (patrón 4).** La versión anterior tomaba la fila de «61 % EG solo» del preprint F52 y la de M22 del preprint F47, y por eso la ley se quedaba en [P]. Pero **la comparación ya estaba dentro de una fuente [V] de la red y nadie la había cruzado:** la información suplementaria del propio PNAS (F71, PDF leído) dice que en el MISMO trabajo, mismo tejido y mismo protocolo probaron **V3, EG al 61 % solo y EG 37.5 % + DMSO 12.5 %, y que V3 dio la mejor recuperación funcional**. Serie con las tres dependencias fuertes: **V3** (DMSO 2.85 M + EG 2.71 M + formamida 2.86 M = 8.42 M, 59 % p/v, cargado a 10 °C) → **LTP conservada** (F46) y mejor recuperación funcional de las tres químicas probadas (F71) · **EG 61 % solo** y **EG+DMSO** → peor recuperación funcional en el mismo trabajo (F71) · **VM3** → K⁺/Na⁺ 91–108 %, LTP no medida (F37b). ⇒ A igual concentración y protocolo, **cambiar la composición cambia el resultado funcional**. **Qué se afirma y qué no (R4, casilla de la afirmación):** el veredicto es que la composición manda; NO se afirma que se haya medido LTP en cada fila, porque sólo V3 la tiene medida. **Corroboración que NO sujeta el veredicto, y por eso ya no está en `deps`:** F52 [P, preprint] da la versión más fina de la fila del 61 % EG (fEPSP recuperados pero potenciación **inestable**, con hinchazón y vacuolización) y F47 [P, preprint] añade la fila de M22 (sólo estructura, función no medida). Las dos son consistentes y ninguna es necesaria: la fila de F47 es una **ausencia de dato**, que no puede ser la base probatoria de nada, y la de F52 la cubre F71 con una fuente publicada. Donde F47 sí es apoyo es en X2, que lo conserva en `deps` y sigue [A]. **Fuga declarada:** F71 dice «mejor recuperación funcional», que es más vago que el «potenciación inestable» de F52; si un día F52 se publicara, la fila del 61 % EG gana precisión, pero el veredicto no cambia. Y sigue siendo **una sola escala** (loncha de hipocampo de ratón): nada de esto acredita la escala, que es justo lo que X2 mantiene abierto.", cierra: "cerrada en tanda 48: F71 [V] contiene la comparación que se tomaba de F52; F47 sólo aportaba una ausencia de dato"}
  X2: {capa: frontera, e: A, deps: [L13, L12, F47, F46, F65], t: "**Frontera de compatibilidad química. PRECEDENTE: no es un hallazgo nuestro** — Fahy la formalizó en 2004 como el **gráfico viabilidad–estabilidad** (F65), viabilidad por K⁺/Na⁺ frente a mWCR, con 14 soluciones. Lo que StasisPath aporta es su versión de 2026, con datos funcionales (LTP) y de escala que entonces no existían. Enunciado actual: la única química con **función** demostrada (V3) exige ~147 °C/min y por tanto no pasa de la escala del ratón; la única con **escala** demostrada (M22, CCR 0.1) sólo tiene estructura. **No existe ningún punto con función y escala a la vez.** Esta casilla vacía es el cuello real de la vía física, y se cierra o se refuta con P19.", cierra: "[laboratorio] calorimetría (DSC) de la CCR de los NADES; si ≤ 0.426 cierra sin P19. Alternativa: ejecutar P19"}
  G8: {capa: magnitud, e: V, deps: [F46, F37b], t: "**Criterio funcional de la información (E2 con memoria):** la LTP es la maquinaria celular del aprendizaje y se conserva tras vitrificar hipocampo de ratón adulto: 138.1 ± 6.9 % frente a 157.7 ± 7.1 % del control en CA1 (P = 0.072, n.s.) y 148.0 ± 7.2 % frente a 125.0 ± 5.0 % en el giro dentado (P = 0.021). ⇒ **La vitrificación no borra el sustrato de la plasticidad sináptica en tejido adulto de mamífero.** No demuestra retención de un recuerdo concreto: eso exige conducta."}
  L12: {capa: ley, e: V, deps: [F46, C2], t: "**El estado vítreo detiene la movilidad molecular y aun así es reversible en tejido neural adulto** (German 2026): amplía el límite biofísico del apagado hipotérmico cerebral. Es la primera confirmación directa del supuesto de L2 (bajo Tg la química se detiene) **con recuperación funcional medida**, no sólo estructural."}
  G5: {capa: magnitud, e: V, deps: [F7, F14, F56], t: "**I_estructura — métrica tomada del campo de la conectómica, que sí la ha estandarizado.** La magnitud correcta no es «% de sinapsis visibles» sino **ERL (expected run length): longitud media de neurita reconstruida sin error**, que penaliza cortes y fusiones. Referencia del estado del arte en tejido fijado ideal: **~1.1 mm** (F56 [P]). Es la primera vez que la magnitud tiene una unidad (µm de neurita) y un valor de control externo a StasisPath, en vez de un porcentaje inventado. Preregistrada en P20; **P15 se mantiene intacta con su umbral original (R2)**. Sigue abierto el dato propio: ERL de tejido criopreservado sin fijar frente a control (ningún laboratorio lo ha publicado)."}
  L1: {capa: ley, e: M, deps: [C1], t: "Recalentar por superficie sólo es posible por debajo de r* ≈ {C1.rstar_M22} cm con M22 y {C1.rstar_VMP} cm con VMP. Por encima, el calentamiento volumétrico (nanowarming: {nano_rate} °C/min en 2 L, independiente del volumen) es obligatorio."}
  L2: {capa: ley, e: V, deps: [C2, F4], t: "Sin cambio de fase, la supresión pasiva da minutos u horas. **Corregido con el texto completo de F4:** extrapolar con un Q10 único es indebido, porque el propio paper mide **2.05 entre 37 y 15 °C y 3.5 entre 15 y 11 °C** (y cita 4.54 en perro). Según el Q10 que se use, 10 años exigen entre **−55 y −156 °C**: el número {C2.T10y} °C que veníamos dando salía de extrapolar el Q10 templado muy fuera de su rango medido. **Lo robusto es «muy por debajo de 0 °C», no una cifra concreta.** Dominio: tejido de mamífero sin reprogramación bioquímica."}
  L18: {capa: ley, e: V, deps: [C2, F4, G2], t: "**El vidrio no lo exige el argumento metabólico, lo exige el hielo.** Al corregir L2 queda claro que la supresión metabólica por sí sola pide sólo «bajo cero» (entre −55 y −156 °C según el Q10). Quien obliga a vitrificar o a controlar el hielo es **G2** (f_hielo,intra = 0), que es un argumento independiente y más fuerte. ⇒ Los dos argumentos estaban entrelazados en el marco y ahora quedan **separados**: metabolismo fija *cuánto frío*, el hielo fija *en qué estado*."}
  L3: {capa: ley, e: M, deps: [C3], t: "Enfriar por superficie limita la vitrificación: LC* ≈ {C3.LCstar_M22} cm con M22 y {C3.LCstar_VMP} cm con VMP. VMP no vitrifica un riñón humano; el tronco con M22 es {C3.trunk_verdict}."}
  L4: {capa: ley, e: M, deps: [C4], t: "Los ectotermos necesitan ×{C4.frog} (rana) y ×{C4.turtle} (tortuga) de supresión no térmica; ×{C4.turtle22} incluso a 22 °C ⇒ la salida es bioquímica, no térmica."}
  L37: {capa: ley, e: V, deps: [F82], t: "**El nanowarming puede ser uniforme a escala de cuerpo por una razón física que la RMN no tiene: está en régimen cuasiestático.** A 360 kHz la longitud de onda en tejido es de **metros**, así que un cuerpo de 40 cm mide una **fracción mínima de longitud de onda**: el campo no puede formar nulos por interferencia. En RMN la longitud de onda cae a **29.3 cm a 3 T y 12.5 cm a 7 T** (calculado con λ = c/(f√εr), εr = 64 de F82c), el cuerpo mide **1.37 y 3.20** longitudes de onda, y por eso aparecen nulos que obligan a matrices multicanal. **F82b lo confirma con medición in vivo** en 10 voluntarios y mapas de 82 sujetos: las inhomogeneidades «resultan de interferencias de radiofrecuencia y resonancias dieléctricas» a 300 MHz, y degradan la imagen sobre todo en las **regiones infratentoriales excéntricas**. ⇒ **La uniformidad del nanowarming es un problema geométrico (forma de bobina y recipiente), no ondulatorio.** **Tanda 55 — la laguna que quedaba se cierra por IRRELEVANCIA DEMOSTRADA, no por encontrar la fuente.** La permitividad del tejido a 360 kHz sigue **sin fuente en la red**, y por eso la cifra «λ ≈ 8.3 m» que esta ley afirmaba antes **se retira**: exigía εr ≈ 1.0e4, que nadie aquí sostiene. Pero el **veredicto** no depende de ella: romper el régimen cuasiestático exigiría **εr ≥ 4.34e6**, es decir **×434** el valor supuesto, y la dispersión α del tejido a esa frecuencia no llega ni de lejos. Con εr entre 64 y 1e5 el cuerpo mide entre **0.004 y 0.15** longitudes de onda: cuasiestático en todo el rango. **Fuga declarada:** lo sostenido es el régimen, **no la cifra**. Cálculo en 20_cotas/cota_L37_cuasiestatico.py.", cierra: "cerrada en tanda 55: F82 contra primarias, y el veredicto cuasiestático es robusto a εr por un factor ×434"}
  L38: {capa: ley, e: V, deps: [F84, C3], t: "**La velocidad que la geometría nos impone coincide con la que la ingeniería criogénica considera segura.** El límite industrial para enfriar tanques grandes sin daño estructural es **< 9 °C/h = {limite_LNG} °C/min** (F84 — Wang et al. 2025, Energy 334:137568; norma EN 14620-5). C3 predice para un cuerpo humano entero (LC {LC_body} cm) **{C3.rate_body} °C/min**. La coincidencia es exacta: la conducción térmica impone a un cuerpo de 70 kg la misma velocidad que la industria lleva décadas usando para no reventar estructuras de acero criogénicas. ⇒ El significado no es casual: **el ritmo al que la conducción obliga es justamente el que otro campo, con décadas de experiencia en estructuras grandes, considera térmicamente seguro.** Refuerza que el cuello a escala de cuerpo no es el estrés térmico sino la CCR del CPA. **F84 ahora [V]: Wang et al. 2025 leído completo (peer-reviewed, Elsevier Energy)."}
  L39: {capa: ley, e: V, deps: [F83, L36, L27, G1], t: "**Los cuatro mecanismos de tolerancia isquémica del marco convergen en un solo sistema, y es humano: el feto.** Frente a la asfixia, el **neonato** baja la temperatura corporal 4–8 °C (torpor hipóxico; en el feto *in utero* no baja — está clampado a la madre), redistribuye la circulación como un mamífero buceador (bradicardia 25–60 %, vasodilatación cerebral por adenosina), entra en hipometabolismo hipóxico (VO₂ baja 30–50 %) y presenta vulnerabilidad cerebral comparable a la del cerebro de tortuga (Singer 1999). Cifras de tolerancia anóxica (neonato vs adulto): rata **40–50 min vs 1.5–3 min** (×20–30); perro **20–30 min vs 3–5 min** (×5–8). Gradiente ontogénico: feto precoz ~25 min → feto a término ~10 min → adulto ~2 min — la tolerancia se pierde de forma programada, no que nunca existiera. ⇒ **Los mecanismos que catalogamos en ardilla (L27), foca (L36) y tortuga no son exóticos: están presentes en la fisiología humana, sólo que regulados por desarrollo.** Es la mejor pista del programa sobre si τ_eq humano es ampliable. **F83 y L36 ahora [V] (leídas 2026-09-27)."}
  L34: {capa: ley, e: V, deps: [F79, C3, L3], t: "**La extrapolación más arriesgada del marco se valida contra la industria cárnica.** C3 se ancló en una bolsa de **3 L** y se extrapoló hasta escala de cuerpo humano, un salto de ×50 en masa que nunca se había comprobado. La industria alimentaria lleva un siglo midiendo exactamente eso: una media canal de vacuno (~150 kg) pasa de **40 °C a ~4 °C en 15–16 h**, es decir **{tasa_canal} °C/min**. C3 predice para esa geometría (LC ≈ 7.5 cm) **{C3.rate_trunk} °C/min**: la razón medido/predicho es **{razon_canal}**. ⇒ La ley LC⁻ⁿ **funciona a escala de 100+ kg**, y es el único dato real que teníamos a esa escala. **Salvedades, y son grandes:** la canal se enfría con aire forzado a 0 °C y 2–4 m/s (coeficiente de transferencia superior al de nuestro ancla) y en el rango 40→4 °C **sin cambio de fase**. Es comprobación de **orden de magnitud**, no réplica del protocolo. **El origen exacto del número (FAO Manual Cano-Muñoz 1991, T0098E02):** es una guía técnica de práctica industrial, no una campaña de medición con n y σ; el dato se cita como estándar de la industria confirmado por décadas de práctica. Mallikarjunan & Mittal 1994 (J Food Eng 23:277) es una simulación de elementos finitos que **corrobora** ese dato con ±2.7 °C, no lo genera. **Estas dos fuentes están ahora [V] (F79 leída completa 2026-09-27).** Nota de aristas: L38 dejó de depender de esta ley en la tanda 49 — corroboraba a C3, que L38 ya tiene directamente."}
  L35: {capa: ley, e: V, deps: [F80, G4], t: "**Los disolventes eutécticos naturales protegen células, pero NO rompen el compromiso toxicidad↔vitrificación.** Hechos de metabolitos corrientes (azúcares, aminoácidos, derivados de colina), protegen mejor que el DMSO a **líneas celulares** congeladas por inmersión en N2 al 50 % p/v (F80), y su viscosidad se ajusta con el agua. **Corregido en la tanda 46 tras leer la primaria:** la versión anterior de esta ley afirmaba «94.65 % de viabilidad en células madre humanas, sin diferencia frente a DMSO», y **ese dato no está en F80**. Lo que sí está y pesa más: **cristalizan a 30 °C/min** ⇒ su CCR es > 30 °C/min y no sirven para vitrificar volúmenes grandes (L44).  **Tanda 49 — el compromiso queda cerrado por los DOS lados, y con una sola primaria. CIERRE [P] → [V].** Al releer el PDF de F80 aparece un dato que nadie había extraído y que es el que a esta ley le faltaba: los autores explican **por qué no pasan del 50 % p/v**, y lo dicen ellos: «*The reason of using 50 % (w/v) instead of higher percentages of NADES is highly related to **their high toxicity at those concentrations**, as well as, their high viscosity which would difficult the diffusion process during freezing*» (Discusión). ⇒ El 50 % p/v **no es una elección de conveniencia: es el techo de toxicidad que declara la propia primaria** — y es exactamente la concentración a la que la CCR ya falla por un factor **≥ 70** (30 °C/min frente a los 0.426 que exige un cerebro humano por C3/L44: **1.85 décadas**, calculado en `20_cotas/cota_campos_lejanos.py`). Bajar esas 1.85 décadas exigiría subir la concentración **por encima de un valor que el propio artículo llama tóxico**. Los dos lados del compromiso quedan medidos en el mismo trabajo, así que el veredicto ya no es una inferencia nuestra sobre un solo lado. **Y se corrige una imprecisión propia (patrón L33):** la versión anterior concluía que los NADES «siguen siendo interesantes por **baja toxicidad a concentración moderada**». F80 dice lo contrario para las concentraciones que este problema necesita; lo que sí sostiene es **mejor recuperación post-descongelación que el DMSO al 50 % p/v en dos líneas celulares**, y que el medio **no hay que retirarlo, basta diluirlo**. Esa es la utilidad real: protocolos celulares, no vitrificación de volúmenes. **Fugas declaradas:** (i) sólo dos líneas inmortalizadas (L929 y HacaT) y la viabilidad se informa como densidad óptica, no como porcentaje; (ii) no existe comparación de toxicidad **a igual concentración molar** frente al DMSO — era el `cierra` de este nodo y pasa a ser fuga, porque el veredicto no la necesita: la toxicidad relevante es la que hay **al máximo de concentración utilizable**, y ésa es la que F80 declara; (iii) no se convierte 50 % p/v a molaridad, porque los NADES son mezclas de masa molar variable y hacerlo exigiría suponer una composición (R5).  **Tanda 49 — auditoría de aristas (patrón 1, dependencia innecesaria): se retira `L29` de `deps`.** L29 (las proteínas CAHS del tardígrado vitrifican a ~0.6 mM) es un nodo **hermano**, no un cimiento: habla de otra clase química y de vitrificación **al secarse**. Test contrafáctico, que es el que decide: si L29 fuera cierta (la relación CCR↔molaridad es rompible con macromoléculas) los NADES seguirían cristalizando a 30 °C/min; y si L29 fuera falsa, también. El veredicto de este nodo **no cambia en ninguno de los dos casos**, luego L29 no es apoyo probatorio — y en esta red `deps` además penaliza, así que un nodo [P] arrastraba a [P] un contenido cuya evidencia está entera en F80 [V] (primaria, PDF leído) y G4 [V]. La dirección de la evidencia es la contraria de la que el cableado decía: **este resultado negativo sobre los NADES alimenta el debate de L29 sobre si el compromiso es una ley de la naturaleza o una propiedad de la clase química elegida; no se deriva de él.** El enlace temático se conserva donde le corresponde, en este texto, que nombra L29.  **Tanda 48 — auditoría de enlaces (patrón 4, dependencia innecesaria):** se retira `X2` de `deps`. Este nodo se escribió para atacar X2 desde fuera, y en esta red `deps` significa apoyo probatorio y además penaliza: X2 está [A] y arrastraba a [A] un contenido que no lo necesita. Test contrafáctico: la calorimetría de F80 (cristalizan a 30 °C/min) es un resultado NEGATIVO sobre un candidato a X2: aporta a X2, no deriva de X2. El enlace temático se conserva donde le corresponde, en este texto, que nombra X2; la evidencia va de aquí a X2, no al revés. Auditoría reproducible en `20_cotas/auditoria_enlaces_X2.py`, que comprueba que **ningún nodo supera su estatus declarado** y que X2 sigue [A]."}
  L43: {capa: ley, e: V, deps: [C3, C8, G4b, F72], t: "**UN veredicto del marco es cierto en TODA su incertidumbre, y eso lo convierte en resultado. Los otros dos NO, y esta ley lo afirmaba por error hasta la tanda 52.** Evaluando en las **64 esquinas** de los seis parámetros de la frontera (ancla, tasa, exponente y las tres CCR) — que es el criterio MATE que declara la cabecera del motor, «sin Monte Carlo (R5: no hay teatro)» — con los valores declarados y sin mover nada: **el cerebro humano cae dentro de la región viable en 64/64 esquinas.** ⇒ **Que el cerebro sea vitrificable en principio no depende de nada que aún no sepamos**, y el margen ancho de la masa máxima es irrelevante para ESE veredicto. Es un caso de cierre por irrelevancia demostrada de la incertidumbre. **LO QUE SE RETIRA (tanda 53):** la versión anterior afirmaba también que **tronco y cuerpo entero caen fuera en el 100 %** de los casos. Es falso con el criterio del marco: el tronco sale fuera en **48 de 64** esquinas y el cuerpo entero en **12 de 64**. El 100 % era artefacto de un **Monte Carlo triangular**, que concentra la masa en el centro y **nunca visita una esquina**. Y el propio motor ya lo imprimía: C3 da «M22 falla en el centro del tronco» como **no robusto**. **Consecuencia que no se oculta:** la imposibilidad de vitrificar un tronco o un cuerpo entero **NO está demostrada**, y por eso V15 no puede cerrarse apoyándose aquí. **Fuga declarada:** la discrepancia de conteo con la auditoría (48/12 aquí, 52/14 allí) viene de juzgar el cuerpo por **LC** o por **masa**, y esos dos criterios conviven en el marco sin que se declare cuál manda — C3 usa LC y concluye que «M22 vitrifica el cuerpo medio», lo contrario de lo que esta ley afirmaba por masa.", cierra: "cerrada en tanda 53 rebajando el enunciado a lo que sostienen las 64 esquinas; el veredicto del tronco y el del cuerpo entero quedan explícitamente NO certificados"}
  L45: {capa: ley, e: V, deps: [C3, C6, F2], t: "**El exponente de la ley de enfriamiento se sostiene por la física, no por la estadística, y un solo volumen más lo certifica por las dos.** Los veredictos clave que dependen de exp_LC sólo se vuelcan por arriba: **C3 (VMP no vitrifica un riñón humano) con n > 2.34** y **C6 (LC 4 cm en la ventana lenta) con n > 2.52**, en la esquina peor de ancla, tasa y riñón. **Camino estadístico:** con los 3 volúmenes de F2 (1 gl) la cota unilateral del 95 % sostiene C3 por poco (tasa < 5.2 frente a 5.3) y **NO sostiene C6** (0.079–0.092 frente a 0.1): fuga declarada. **Camino físico, independiente:** con h, material y protocolo iguales el exponente está entre 1 (Bi ≪ 1) y 2 (Bi ≫ 1); lo único que lo empuja por encima de 2 es la forma no autosemejante y el ruido, y su tamaño está medido (**+0.18**). Volcar C3 exigiría **×1.9** ese exceso y volcar C6 **×2.9**. ⇒ C3 cierra por los dos caminos; C6 cierra por el físico. **Fuga que queda:** un órgano real no es una bolsa; si su forma añade más de ×1.9 el exceso observado, C3 se abre. **Medición mínima que cierra también el camino estadístico:** UN volumen más en el montaje de F2 con ruido ≤ 10 % (mejor **~0.15 L, tamaño riñón**, porque además comprueba C3 en su propia escala); con ruido de 15 % hacen falta dos (0.15 L y ~7 L). Refutación: un exponente ajustado > 2.34 con cuatro o más volúmenes. Cálculo en 20_cotas/cota_exp_LC.py."}
  L44: {capa: ley, e: V, deps: [F80, C3], t: "**El atajo a X2 por los NADES QUEDA REFUTADO por el dato que el propio marco pidió medir.** Lo que sobrevive: invirtiendo la ley de enfriamiento, un CPA necesita **CCR ≤ 0.426 °C/min** para vitrificar un cerebro humano por convección — 4.3 veces más permisivo que M22. Ese umbral sale de C3 y sigue en pie como **objetivo de diseño**. Lo que cae: los NADES no lo cumplen **ni de lejos**. La calorimetría que las tandas 37–38 declararon «la medición más rentable del programa» **ya estaba publicada en F80 y nadie de nosotros la había leído**: enfriando a 30 °C/min los NADES al 50 % p/v **cristalizan** (Tc −26.6 a −32.3 °C) ⇒ **CCR > 30 °C/min, un factor > 70 por encima del umbral**. Y en el mismo ensayo el **DMSO al 50 % no cristaliza**, así que a esa concentración los NADES son PEORES vitrificando. Su «vitrificación» es inmersión en N2 de un criovial (15 000–30 000 °C/min), que es lo contrario de lo que exige un volumen grande. ⇒ **La recomendación operativa del marco se INVIERTE: medir los NADES ya no es prioritario, y X2 no tiene atajo conocido — P19 (o una química nueva) vuelve a ser el camino.** Fuga que queda abierta: sólo se probaron 3 sistemas al 50 % p/v; otro NADES a otra concentración podría comportarse distinto, pero eso es una conjetura sin dato, no un atajo.", cierra: "[laboratorio] sólo la sustituye una química NUEVA con CCR medida ≤ 0.426"}
  L42: {capa: ley, e: V, deps: [C10, F42, F30, L9], t: "**C2 calibra bien contra un segundo mamífero, y se descubre dónde deja de ser conservadora.** El cerdo a 10 °C aguanta **60 min de parada sin déficit cognitivo ni neurológico a 6 semanas** (F42). Frente a la ventana que predice C2, la razón está entre **0.82 y 2.99** en todas las esquinas: **dentro de ×5 de forma robusta**. Es mejor calibración que el perro (1.63–5.99), porque el perro llevaba **flush aórtico** y eso no es comparación limpia con hipotermia sola. **Y aparece el límite:** con Q10 = 2.53 y t37 ≥ 5 min, la ventana de C2 llega a **61–74 min** y **supera los 60 min del cerdo** ⇒ en esa esquina **C2 deja de ser conservadora y pasa a ser optimista**. No es un fallo del ajuste: es el **borde declarado de su validez**, y dice que a 10 °C la cota ya no tiene margen de seguridad."}
  L40: {capa: ley, e: V, deps: [F86, G1, C10, X1], t: "**τ_eq tiene un sustrato químico medible, y es el succinato.** La acumulación de succinato es el rasgo común de la isquemia en corazón de **ratón, cerdo y humano**, y el frío actúa **frenando su generación**, no sólo ralentizando el metabolismo en general (F86). ⇒ Nuestra τ_eq, que hasta ahora era un integral de temperatura y tiempo, **podría medirse directamente como concentración de succinato** en vez de estimarse. Eso convertiría una magnitud derivada en una **magnitud observable**, y explicaría por qué τ_eq es invariante entre especies (L2, T1 del escalado): lo que se conserva no es el tiempo, es **cuánto succinato se ha acumulado**. Y hay consecuencia práctica: el daño **se atenúa con inhibidores metabólicos**, así que τ_eq no es sólo función de T y t sino también de la farmacología — un tercer eje que el marco no tenía."}
  L41: {capa: ley, e: V, deps: [F85, L16, F22], t: "**La nucleación deja de ser una cota cualitativa y pasa a tener una COTA SUPERIOR numérica, y dos sistemas independientes no se contradicen.** El hígado de rata sobreenfriado a −6 °C con trasplante ortotópico real da dos puntos de supervivencia (100 % a 72 h, ~58 % a 96 h; F85). Con el modelo de L16 (nucleación de Poisson, probabilidad creciente en volumen **y** tiempo) el punto de 96 h implica **J(−6 °C) ≤ 0.57 nucleaciones por L·h**; el de 72 h, al ser 100 %, no acota por arriba. Es **compatible** con la cota independiente del riñón de cerdo a −2 °C (**J ≤ 3.1 por L·h**, regla de tres sobre los 5+5 animales de 5 h sin nucleación de F20). ⇒ Dos sistemas, dos especies y dos temperaturas dan cotas que no se contradicen. **CERRADA en la tanda 48 por corrección de una imprecisión propia + irrelevancia demostrada de su salvedad (patrón L33 + patrón L43).** La versión anterior decía tasa «ajustada» ≈ 0.57 y dejaba abierta la salvedad de que atribuir el 42 % de fallos a las 96 h a la nucleación es una suposición. Las dos cosas se arreglan a la vez: sea φ la fracción de esos fallos que sí es nucleación; J(φ) = −ln(1 − 0.42φ)/(V·t) es **monótona creciente en φ**, con su máximo justo en φ = 1. Por tanto lo que F85 da **no es un valor ajustado sino una cota superior**, y cualquier desviación de la suposición sólo la BAJA. Y el veredicto de compatibilidad **aguanta en todo φ ∈ [0,1] y en todas las esquinas de volumen** (hígado de rata 8–14 mL, riñón de cerdo 40–90 mL): la holgura en la peor esquina es ×2.9, y romperla exigiría **79 % de fallos por nucleación cuando F85 observa 42 % en total** — imposible. Cálculo con números en `20_cotas/cota_nucleacion_L41.py`, que además **reproduce desde cero los dos valores que este nodo tenía escritos a mano** (0.567 y 3.05). **Fugas declaradas:** (1) la cota supone «nucleación ⇒ fallo del injerto»; si nuclear fuera sobrevivible J sería mayor, y el apoyo de que no lo es está en la propia dependencia F22 (controles congelados a −2 °C: 98 % de picnosis nuclear, destrucción severa a escala de órgano) — y la cota del cerdo usa la misma convención, así que la comparación es consistente; (2) el valor **puntual** de J sigue abierto y sólo se cerraría midiendo φ: lo cerrado es la cota y la no-contradicción, no el número central; (3) no se extrapola J de −6 a −2 °C: son dos cotas independientes y sólo se comprueba que no choquen; **(4) AÑADIDA EN LA TANDA 52 (auditoría en contra), y es una asimetría de método: el lado de la rata no tiene n.** El PDF de F85 **no da en ningún sitio el número de animales** (comprobado buscando «n =» y «number of rats» en el texto completo), así que el 42 % es una **proporción puntual**, no una cota. El lado del cerdo, en cambio, **sí usa n** (regla de tres sobre 5+5). Llamar «cota» a las dos cosas mezcla dos objetos distintos. **El veredicto de compatibilidad aguanta igual y por eso el nodo se queda en [V]:** incluso poniendo una cota superior binomial al 95 % sobre la proporción con un n pequeño y plausible (3 de 7, o 2 de 5) la J de la rata sube a ~1.4–1.6 por L·h, todavía por debajo de la peor esquina del cerdo (2.04). Lo que se pierde es la precisión del número, que ya estaba declarada abierta en la fuga (2). **Y una segunda salvedad sobre la fuente: F85 es un artículo de PROTOCOLO** (Nat Protoc), y sus supervivencias se informan en la discusión como resumen del trabajo del propio grupo («*we were able to transplant supercooled livers with 58 % long-term survival after 96 hours... while 100 % survival was limited to 72 hours*», verificado literal en el PDF), no como una tabla de resultados con estadística.", cierra: "cerrada en tanda 48: reformulada como cota superior; la salvedad no cambia el veredicto en todo su rango (20_cotas/cota_nucleacion_L41.py)"}
  L36: {capa: ley, e: V, deps: [F81, G1], t: "**La foca resuelve la isquemia cambiando QUÉ CÉLULA respira, no cuánto.** En mamíferos terrestres la producción aeróbica de ATP es neuronal; en la foca de casco (*Cystophora cristata*) **se desplaza a los astrocitos**, y los marcadores de metabolismo oxidativo (neuroglobina, citocromo c) están **en la glía en vez de en la neurona** (Mitz et al. 2009 — F81). Las neuronas de foca mantienen descarga durante **19±10 min (máx 60 min)** de hipoxia severa, frente a **5±2 min en ratón** (Folkow et al. 2008 — F81). El mecanismo molecular: sobreexpresión de MCT4 en neuronas (expulsión de lactato), inversión del shuttle ANLS (rANLS: lactato neurona→astrocito), y astrocitos con Ngb, citocromo c y LDHB que actúan como tampón oxidativo (Hoff et al. 2017 — F81). ⇒ **Es un cuarto mecanismo de tolerancia isquémica, distinto de los tres que el marco ya tenía** (frío por Q10, flujo bajo, e inhibición activa del hibernador de L27): aquí es **reparto de tareas entre tipos celulares**. Sugiere que τ_eq no es una propiedad del tejido sino **de la arquitectura metabólica del tejido**, lo que explicaría por qué la ardilla eutérmica (L15) aguanta sin frío ni torpor. **F81 ahora [V]: tres primarias leídas (Folkow 2008, Mitz 2009, Hoff 2017); corrección: la comparación de duración procede de Folkow, no de Mitz.**"}
  L31: {capa: ley, e: V, deps: [F76], t: "**El punto de concentración cero existe y estaba medido en otro campo: la criomicroscopía electrónica.** La CCR del **agua pura** es **6.4 × 10⁶ K/s = 3.84 × 10⁸ °C/min** (F76, Mowry et al. 2025, Phys Rev Research 7:013095 — medido directamente por cryo-EM resuelta en tiempo). Con ese tercer punto, la relación CCR↔concentración del marco deja de ser una recta de dos puntos y se ve **curva (convexa)**: la pendiente es de −0.95 décadas por mol entre 0 y 8.4 M y de **−1.74 entre 8.4 y 9.3 M**. ⇒ **Usar la pendiente local cerca de 9 M para extrapolar ahí, como hace F2, resulta ser lo correcto — y ahora con evidencia, no por suposición.** Además fija el otro extremo del problema: sin crioprotector se puede vitrificar, pero sólo por debajo de **~1.5–3 µm** de espesor en criomicroscopía pura (LC* ≈ √(α·ΔT/CCR) ≈ 1.5 µm calculado en F76; la práctica de cryo-EM opera a 100–200 nm). **Corrección (cruce con F6/Studer):** en tejido biológico sin CPA se vitrifica hasta **10–20 µm** (factor ×10 sobre cryo-EM en rejilla) y hasta **~200 µm** con congelación a alta presión (2000 bar, Tm baja a −22 °C → CCR necesaria cae ×100). El valor de F76 (6.4×10⁶ K/s) coincide con la extrapolación de F6 (2.5×10⁵ K/s) a factor 1.25 — corroboración independiente. **Ningún veredicto cambia**: 200 µm siguen a un factor ×200 de LC = 4 cm y ×4×10⁴ en velocidad (tasa ∝ 1/LC², C3). **F76 ahora [V]: fuente primaria peer-reviewed leída entera** — los 6.4×10⁶ K/s son el enunciado entero, no color. La presión como variable de diseño queda declarada como laguna (no tiene nodo propio en el marco)."}
  L32: {capa: ley, e: V, deps: [F77, G3, F75], t: "**Otro campo ya resolvió formalmente «qué grosor puedo vitrificar»: los vidrios metálicos masivos.** Lu & Liu 2002 derivan dos ecuaciones explícitas que abarcan 6 órdenes de magnitud (R²=0.91): **R_c = 5.1×10²¹·exp(−117.19γ) K/s** (análogo exacto de CCR) y **Z_c = 2.80×10⁻⁷·exp(41.70γ) mm** (análogo exacto de LC*), donde γ = Tx/(Tg+Tl) (F77). ⇒ Nuestra F1 calcula el espesor crítico **a posteriori, midiendo la CCR**; la metalurgia lo predice **a priori desde temperaturas características del material**. Las mejores aleaciones (Pd-Cu-Ni-P, γ≈0.45) alcanzan Z_c ~40 mm predicho (experimental hasta 72–80 mm). Junto con el marco de diseño de excipientes de la liofilización (F75), son **dos herramientas de diseño ya construidas** para el problema que X2 deja abierto, y ninguna se ha aplicado a crioprotectores de órganos. El marco de γ es trasladable: si se midieran Tg, Tl y Tx de un CPA, se obtendría su CCR y su LC* sin hacer criobiología. **F77 ahora [V]: leída completa, ecuaciones verificadas con datos numéricos.**"}
  L33: {capa: ley, e: V, deps: [F78, L8, L28], t: "**La atrofia, que el marco no modelaba, ya está resuelta por un mamífero grande — y por una vía distinta del ahorro energético.** El oso negro pasa **4–6 meses casi inmóvil**: **sin ninguna pérdida de hueso** y con **pérdida sólo LIMITADA de masa y proteína muscular** (F78, ambas primarias leídas en la tanda 46). **Precisión corregida en la tanda 47:** la versión anterior decía «sin perder músculo ni hueso»; el artículo del músculo dice «limited loss», no cero. El hueso sí es cero. No lo consigue frenando el metabolismo: mantiene **activa la síntesis proteica vía mTORC1** con aminoácidos ramificados preservados, y **regula a la baja los genes de resorción ósea** sin tocar los de formación. ⇒ Para la vía de misión espacial, la atrofia **no es una consecuencia inevitable de la inmovilidad**, sino un programa regulable. Añade una magnitud que faltaba en Q13, que sólo contaba energía, y enlaza con L28: en torpor el límite no es la grasa sino el manejo del combustible no lipídico y del nitrógeno. **Fuga declarada:** es evidencia transcriptómica y de histología en oso; **nadie ha demostrado que el programa se pueda inducir en un humano**.", cierra: "cerrada en tanda 47: F78 leída entera y la imprecisión del músculo corregida"}
  L29: {capa: ley, e: V, deps: [F74], t: "**La biología vitrifica sin concentración tóxica, usando macromoléculas en vez de solutos pequeños — y eso ataca el supuesto más débil del marco.** Nuestra fórmula F2 concluye que vitrificar piezas grandes exige cruzar el umbral de toxicidad **porque asume crioprotectores de molécula pequeña**, donde bajar la CCR exige subir la molaridad. Las proteínas CAHS del tardígrado forman vidrio y gel por autoensamblaje reticular a **~0.6 mM (>15 g/L)** (F74), unas **cuatro órdenes de magnitud por debajo** de los 8.4–9.3 M que usan M22 o V3. En levadura transfectada y en el propio tardígrado, la viabilidad correlaciona estrictamente con el estado vítreo (Fig 7D, 7E de Boothby 2017): se mantiene bajo la Tg y colapsa al superarla. ⇒ **La relación CCR↔molaridad no es una ley de la naturaleza: es una propiedad de la clase química que el campo ha elegido.** Salvedad grande: la vitrificación de las CAHS ocurre **al secarse, no al enfriarse**, y su mecanismo exacto está **disputado** frente a hipótesis puramente de red mecánica (Arakawa & Numata 2021). No es un sustituto directo; es la prueba de que el supuesto es rompible. **F74 ahora [V]: Boothby et al. 2017 (PMC5987194) leído completo 2026-09-27.**"}
  L30: {capa: ley, e: V, deps: [F75, G3, F59], t: "**Existe ya un método computacional para diseñar la química que el marco dice que falta, y viene de la liofilización farmacéutica.** F2 identifica lo que hace falta: un CPA con CCR baja **sin** molaridad alta. La industria farmacéutica lleva décadas resolviendo el problema gemelo — estabilizar proteínas en vidrio — y tiene un **marco de diseño molecular** que optimiza excipientes con relaciones cuantitativas estructura-propiedad para **Tg del soluto anhidro, Tg' de la matriz crioconcentrada, punto de fusión del hielo y constante de Gordon-Taylor** (F75). Y la Tg es justamente la variable que Kavian 2025 (F59) demostró que **controla el agrietamiento**. ⇒ El cuello de X2 no es sólo un experimento pendiente: es **un problema de diseño con herramientas ya construidas en otro campo**, que nadie ha aplicado a la criopreservación de órganos.  **Tanda 48 — auditoría de enlaces (patrón 4, dependencia innecesaria):** se retira `X2` de `deps`. Este nodo se escribió para atacar X2 desde fuera, y en esta red `deps` significa apoyo probatorio y además penaliza: X2 está [A] y arrastraba a [A] un contenido que no lo necesita. Test contrafáctico: la existencia del marco computacional de diseño de excipientes es un hecho de la literatura de liofilización (F75) más el papel de Tg en el agrietamiento (F59); es una propuesta de vía PARA resolver X2. El enlace temático se conserva donde le corresponde, en este texto, que nombra X2; la evidencia va de aquí a X2, no al revés. Auditoría reproducible en `20_cotas/auditoria_enlaces_X2.py`, que comprueba que **ningún nodo supera su estatus declarado** y que X2 sigue [A]."}
  L27: {capa: ley, e: V, deps: [F73, L24, C2], t: "**En un hibernador, por debajo de 12 °C el metabolismo deja de obedecer a la temperatura.** Buck & Barnes (F73) miden que entre Tb 0 y 12 °C la tasa metabólica de la ardilla ártica **no cambia de forma significativa**: hay **inhibición activa independiente de la temperatura**. Y el Q10 aparente **varía de 1.0 a 14.1** dentro del mismo rango, con un valor global de 2.4. ⇒ **En el dominio del hibernador, C2 deja de aplicarse por completo**: no es que el Q10 sea otro, es que el metabolismo ya no es función de la temperatura. Refuerza la restricción de dominio de L2 y explica por qué L15 (ardilla eutérmica resistente a 8 min de parada) no es una anomalía sino otro régimen."}
  L28: {capa: ley, e: V, deps: [F73, L8, C5], t: "**Lo que termina un episodio de torpor no es la temperatura ni la energía total: es el tipo de combustible.** En torpor estable el cociente respiratorio es **0.70 (sólo lípidos)** y sube por encima de **0.85** en los extremos de temperatura, señal de que se recurre a combustible no lipídico. **El CR correlaciona negativamente con la duración máxima del episodio** (F73) ⇒ la hipótesis que sostiene la propia fuente es que **la disponibilidad de combustible no lipídico limita la duración del torpor**. Corrige el enfoque de C5, que contaba sólo kilogramos de grasa: **la grasa no es el límite, lo es el componente no graso.**"}
  L24: {capa: ley, e: V, deps: [F70, L2], t: "**La no-linealidad del Q10 pasa de sospecha a medida, y con mecanismo.** En mitocondrias de cerebro de ratón entre 37 y 6 °C (F70): Q10 de **2.61 ± 0.09** en respiración basal y **3.92 ± 0.31** en respiración activa. Coincide de forma independiente con el tramo frío de McCullough en humano (3.5). **Y da el mecanismo:** los complejos de la cadena respiratoria no se frenan por igual — citrato sintasa y complejos I, III y IV son poco sensibles (Q10 1.2–2.4), mientras el **complejo II llega a 4.2 y el complejo V a 11.3**. ⇒ El Q10 global no es una constante del tejido sino **la media ponderada de enzimas con sensibilidades muy distintas**, y sube al enfriar porque **la síntesis de ATP se apaga antes que el transporte de electrones**."}
  L26: {capa: ley, e: V, deps: [F69, F72, L20], t: "**La criónica usa exactamente la concentración que German demostró tóxica, y el daño osmótico resultante está medido: 36 % de encogimiento cerebral.** El caso P-19 fija como objetivo **65 % p/v** de CPA (F69) — la misma concentración que en lonchas de hipocampo **reduce la respiración basal a la mitad** (80.4 frente a 173.3; F72, y comentada en L25). El TC confirma que el objetivo se alcanzó bien (83 % del área cerebral por encima del 100 % de la diana, 97 % por encima del 92 %), es decir: **la perfusión fue técnicamente buena y precisamente por eso el tejido recibió la dosis tóxica completa**. Y el encogimiento cerebral medido es del **36 %**, que cuantifica por primera vez en un caso humano la lesión osmótica que L20 separaba de la toxicidad química. ⇒ Buena perfusión y baja toxicidad son **objetivos enfrentados** con la química actual.  **Tanda 49 — barrido sistemático de aristas (patrón 4, dependencia innecesaria):** se retira `L25` de `deps`. Las cuatro afirmaciones de esta ley están en F69 [V] (objetivo 65 % p/v, TC, 36 % de encogimiento) y en F72 [V] (80.4 frente a 173.3), y la separación entre lesión osmótica y toxicidad química la da L20 [V]. Lo único que L25 añade por encima de F72 es su propia afirmación ABIERTA («la temperatura de carga es la variable decisiva»), y el veredicto de esta ley es cierto en las DOS ramas de esa incógnita: si la carga en frío rescata la alta molaridad, P-19 no cargó a −22 °C y recibió igualmente la dosis tóxica; si no la rescata, con más razón. ⇒ L25 no es apoyo probatorio aquí, es una referencia cruzada, y se conserva como tal en este texto. **L25 sigue en [P] y la contradicción I1 sigue abierta** (R1: la tensión no se pierde). Auditoría reproducible en `20_cotas/barrido_aristas_global.py` (enumera las 17 aristas penalizantes del grafo entero) y `20_cotas/auditoria_aristas_tanda49.py` (aplica el test y comprueba que ningún nodo supera su estatus declarado).", cierra: "cerrada en tanda 49 por dependencia innecesaria: el veredicto lo dan F69 y F72, ambas [V]; L25 sólo aportaba una incógnita de mecanismo que no cambia el veredicto en ninguna de sus dos ramas"}
  L20: {capa: ley, e: V, deps: [F65, L6, G4b], t: "**La toxicidad depende de la temperatura de uso tanto como de la molécula, con una asimetría medida.** M22 se diseñó para tocar tejido vivo **a −22 °C** (de ahí el nombre) y a −3 °C su toxicidad sería inaceptable (F65) — lo contrario que VMP, tolerable a −3 °C. Y añadir y retirar M22 a −22 °C fue **uniformemente fatal**, mientras que perfundirlo 25 min y lavarlo **a la vez que se calienta** recuperó la función renal completa. Fahy concluye que el daño dominante fue **expansión osmótica a baja temperatura**, no toxicidad química. ⇒ D_CPA y la lesión osmótica son **dos magnitudes distintas que se confunden con facilidad**."}
  L25: {capa: ley, e: V, deps: [F72, L22, L20], t: "**A la molaridad de M22, la química de V3 cargada en caliente ya es tóxica — y eso convierte la temperatura de carga en la variable decisiva.** German probó V3 al **65 % p/v = 9.28 M**, prácticamente la molaridad de M22 (9.3 M), cargando **a 10 °C**: la respiración basal (OCR Seahorse) cayó a **80.4 ± 5.6 frente a 173.3 ± 6.7 del control**, es decir **a la mitad**, con capacidad de reserva de 38.9 frente a 73.4 (F72). En cambio, cargando a subcero (−10 °C / −20 °C) a 59 % (8.42 M), la respiración y la LTP se conservan íntegras tras vitrificación completa a −140 °C. ⇒ **La diferencia entre la química que funciona y la que escala no es la concentración: es que M22 se carga a −22 °C y no a 10 °C** (L20). Esto **responde a la contradicción I1**: la eficacia del rescate por carga en frío no es un artefacto renal (F65/L20), sino un principio termo-cinético comprobado directamente en tejido neural de mamífero (hipocampo). **CERRADA 2026-09-27:** la contradicción I1 queda resuelta con el protocolo de carga subcero y la respiración mitocondrial en lonchas neurales de German et al. (F72); todas sus dependencias son fuertes [V].", cierra: "cerrada 2026-09-27: contradicción I1 resuelta con el protocolo de carga subcero y respiración mitocondrial en tejido neural (German et al., F72)"}
  L22: {capa: ley, e: V, deps: [F37b, F46, F71], t: "**V3 y VM3 son la misma fórmula: V3 = VM3 sin los bloqueadores de hielo. CONFIRMADO POR LOS PROPIOS AUTORES**, no sólo deducido: el suplementario del PNAS (F71) dice que omitieron los polímeros «Supercool» y que llamaron **V3 «por referencia a VM3»**. Comprobado además componente a componente: DMSO 22.3 %, formamida 12.86 %, EG 16.84 % y PVP K12 7 % son **idénticos al decimal** en Pichugin 2006 (F37b) y en German 2026 (F46); VM3 añade 1 % de X-1000 y 1 % de Z-1000 y llega a 61 % p/v, mientras V3 se queda en los **59 %** que declara el PNAS. ⇒ La química con **función demostrada (LTP)** no es una familia nueva: es la **VM3 de Fahy sin bloqueadores**. X2 no enfrenta dos linajes distintos, sino **el mismo linaje a dos concentraciones y dos temperaturas de diseño** (59 % p/v a temperatura de loncha frente a 9.3 M a −22 °C). **Y la distancia es mucho menor de lo que parecía:** V3 son **8.42 M** de CPA permeable (F71) frente a los **9.3 M** de M22 — apenas un **10 % de diferencia en molaridad**. Lo que de verdad separa a la química que funciona de la que escala no es la concentración: son **los bloqueadores de hielo y la temperatura de carga** (10 °C frente a −22 °C).  **Tanda 48 — auditoría de enlaces (patrón 4, dependencia innecesaria):** se retira `X2` de `deps`. Este nodo se escribió para atacar X2 desde fuera, y en esta red `deps` significa apoyo probatorio y además penaliza: X2 está [A] y arrastraba a [A] un contenido que no lo necesita. Test contrafáctico: la identidad de composición V3 = VM3 sin bloqueadores (F37b, F46, y el suplementario de los propios autores, F71) es cierta con X2 = SÍ y con X2 = NO. El enlace temático se conserva donde le corresponde, en este texto, que nombra X2; la evidencia va de aquí a X2, no al revés. Auditoría reproducible en `20_cotas/auditoria_enlaces_X2.py`, que comprueba que **ningún nodo supera su estatus declarado** y que X2 sigue [A]."}
  L23: {capa: ley, e: V, deps: [F37b, F72, G4b], t: "**La física de vitrificar no es lo que mata al tejido neural: lo que mata es la química.** Prueba directa y cuantitativa (F72): en lonchas de hipocampo, **exponer al CPA y vitrificar de verdad dan el mismo resultado** — respiración basal 135.1 ± 6.7 sólo con CPA frente a 131.4 ± 5.7 tras vitrificación completa, y capacidad de reserva 48.6 frente a 50.6. **Todo el daño lo causa la exposición química; el cambio de fase no añade nada medible.** Dato clásico que ya lo apuntaba (F37b): V(EG) al **53 %** permitió vitrificar y recalentar **sin daño atribuible a la vitrificación ni al recalentamiento en sí**, y aun así fue **mucho más dañino que al 50 %**. Misma física, sólo 3 puntos más de concentración. Es la evidencia más limpia del programa de que el cuello de X2 es **toxicidad**, y encaja con L13 (61 % de EG solo da LTP inestable; V3 la conserva).  **Tanda 48 — auditoría de enlaces (patrón 4, dependencia innecesaria):** se retira `X2` de `deps`. Este nodo se escribió para atacar X2 desde fuera, y en esta red `deps` significa apoyo probatorio y además penaliza: X2 está [A] y arrastraba a [A] un contenido que no lo necesita. Test contrafáctico: los dos pares de números medidos en el mismo tejido (135.1 vs 131.4 y 48.6 vs 50.6, F72; 50 vs 53 % en F37b) no cambian con la respuesta a X2. El enlace temático se conserva donde le corresponde, en este texto, que nombra X2; la evidencia va de aquí a X2, no al revés. Auditoría reproducible en `20_cotas/auditoria_enlaces_X2.py`, que comprueba que **ningún nodo supera su estatus declarado** y que X2 sigue [A]."}
  L21: {capa: ley, e: V, deps: [F69, F16, G1], t: "**La brecha entre la criónica ideal y la real está medida con un caso primario, y es mayor de lo que primero anoté.** Wowk (F16) documenta que la vitrificación cerebral completa verificada por TC sólo se ha visto en casos con **< 10 min** entre parada y declaración. El caso P-19 (F69) documenta la cronología completa: declaración legal a la **1 h**, compresiones torácicas a la **1 h 43** y, sobre todo, **inicio de la perfusión de crioprotector a las 4 h 40**, con el equipo ya en espera tras dos guardias de 3 y 4 días. **Corrección de mi propia anotación previa:** apunté «~90 min», que es sólo la llegada al tanatorio; el dato que importa para τ_eq es **cuándo empieza la perfusión, y son 4 h 40**. ⇒ **La práctica real opera ~28 veces por encima de su propio umbral técnico** (4 h 40 frente a < 10 min), y el cuello no es la química: es el **procedimiento legal de declaración**, que no puede iniciarse antes. Encaja con O2: la muerte legal es una decisión, y aquí esa decisión fija el daño."}
  L19: {capa: ley, e: V, deps: [F64, L16, G7], t: "**La nucleación ya se controla farmacológicamente, y el control se divide en dos funciones distintas.** En congelación parcial de hígado de rata (F64): **Z-1000 suprime la nucleación heterogénea** y **X-1000 y AFGP inhiben la recristalización** — son dos mecanismos separados, no uno. Cierra el hueco que L16 dejaba abierto: si el límite del sobreenfriamiento es la nucleación acumulada en el tiempo, **existe ya la palanca química para moverlo**. Pero ninguna es gratis: AFGP bajó el edema (p = 0.029) y **dañó el endotelio**; X/Z mantuvo ATP alto y dio edema al descongelar. ⇒ El control de nucleación entra en el marco como una magnitud con coste, igual que D_CPA."}
  L16: {capa: ley, e: V, deps: [F20, F62, G2], t: "**El límite del sobreenfriamiento es la nucleación acumulada en el tiempo, no la temperatura mínima.** Prueba directa: el mismo grupo mantuvo −2 °C durante 5 h pero tuvo que **subir a −0.5 °C** para 24–48 h por riesgo de nucleación (F20, confirmado por el editorial F62). La nucleación es estocástica y su probabilidad crece con el volumen **y con el tiempo**. ⇒ Hay un compromiso temperatura × duración que **acota el sobreenfriamiento a días, no semanas**, salvo que se controle la nucleación (proteínas antinucleantes, método isocórico)."}
  L17: {capa: ley, e: V, deps: [F20, F63, C2], t: "**Corroboración externa de Q10 y del gradiente clínico de temperatura.** El propio trabajo de trasplante cita «cada 10 °C de caída reduce el metabolismo un 50 %» (Q10 = 2.0, dentro de nuestro rango [2.0, 2.6] sin haberlo ajustado a él). Y en clínica humana, conservar corazones a **10 °C en vez de en hielo** reduce la disfunción primaria grave del injerto (F63). ⇒ La vía de hipotermia sigue dando mejoras clínicas reales **sin cambio de fase**: es donde el residual es más sólido."}
  L5: {capa: ley, e: V, deps: [C6, F20, F21, F57], t: "La congelación parcial **no está limitada por el calor** a LC 4 cm (enfriamiento {C6.rate4}, dentro de la ventana lenta; calor latente evacuado en {C6.latent4}). El veredicto es un resultado de **C6, que es mate**: sale de la geometría y del calor latente, no de ningún experimento. Que la congelación parcial funcione de hecho a subcero lo aportan F20 y F21 (ambas [V]). F57 [V] corrobora la escala en **órgano grande** — riñones de cerdo (n=6 a 10 días a −15 °C con autotrasplante in vivo y producción de orina) y humanos descartados (n=3 a 10 días en trasplante simulado con ~50–57.5 % de aclaramiento de creatinina y resistencia vascular estable) — que es la escala que C6 predecía. **F57 ahora [V]: manuscrito completo de NIH/Research Square, actas AJT 2024/2025 y autotrasplante in vivo documentados.**", cierra: "cerrada 2026-09-27: todas las dependencias fuertes (C6 mate, F20, F21 y F57 verificadas)"}
  L6: {capa: ley, e: V, deps: [C8, F26, F39, F40], t: "La toxicidad sigue a qv* (20 soluciones); diseñando por qv*, 8.4 M a −3 °C pasó de 100 % letal a riñón sin daño. **La temperatura y el protocolo de carga dominan:** M22 (9.3 M) 25 min a −22 °C con lavado simultáneo al calentar da función renal completa; añadirlo y retirarlo a −22 °C sin ese lavado es a veces fatal (F39). La neutralización química existe para formamida, urea y acetamida (con DMSO), pero **no** para glicerol, propilenglicol, EG ni DMSO (F40). La tensión CCR ↔ toxicidad es de **diseño y protocolo**, no una ley dura."}
  L7: {capa: ley, e: V, deps: [C9, F88], t: "Hipotermia accidental a 13.7 °C con parada y buen resultado = ×{C9.extra} sobre C2 ⇒ **no es una fuga**: hubo RCP (bajo flujo). C2 es una cota de flujo cero. **Tanda 54: cerrada contra la PRIMARIA.** La versión anterior se apoyaba en F13, que la auditoría de la tanda 52 demostró que es una **revisión**. Leído el Lancet (F88), el caso queda documentado de primera mano: RCP básica **inmediata** desde las 19:00 y bypass a las 21:50 ⇒ **el bajo flujo está en la primaria, no inferido**. **Fuga declarada:** la primaria da 170–195 min de parada, no los 412 que la red tiene en `hypo_case_min`; el veredicto aguanta con ambos, con margen ×3.26 en el peor caso.", cierra: "cerrada en tanda 54 contra F88 (Lancet 2000), leída entera"}
  L8: {capa: ley, e: V, deps: [C5, F89], t: "Un año de torpor cuesta {C5.kg25} kg de grasa al 25 % del basal y {C5.kg3} kg al 3 %. **La energía no limita**, y ese veredicto lo da **C5, que es mate**. SpaceWorks/NASA estiman un ahorro de masa del **52–68 %** para hábitats con torpor frente al diseño de referencia TransHab, en la misma misión, y reducción de IMLEO del **25–44 %** (F89). **CORRECCIÓN (2026-09-27, PDF leído directo):** la tanda 54 anotaba «25–35 %» por error de lectura; el PDF dice textualmente «25% to 44%». Añade: con la misma masa se puede duplicar la tripulación; soporte clínico citado hasta 14 días de hipotermia terapéutica continua. Seguimiento: NIAC Fase II (Bradford, SpaceWorks, 2016–2018, Project 88911) elevó el TRL de 2 a 3. **Tanda 54: cerrada contra la PRIMARIA.** La versión anterior tomaba el 52–68 % de F13, que es una revisión, y la auditoría de la tanda 52 señaló que la cifra nace en el informe NIAC de Bradford/SpaceWorks y **no estaba en la red**. Ahora lo está, leído entero, con la frase literal. **Fuga declarada:** es un estudio de arquitectura de misión, no una medida fisiológica; lo que sostiene es el **ahorro de masa de la nave**, no que el torpor humano sea alcanzable.", cierra: "cerrada en tanda 54 contra F89 (NIAC Phase I), leída entera; IMLEO corregido a 25-44% el 2026-09-27"}
  L9: {capa: ley, e: V, deps: [C10, F30], t: "C2 es **conservadora pero del orden correcto** en mamíferos: el perro con flush frío aguanta {flush_min} min sin flujo a ~10 °C = ×{C10.extra} sobre C2: en el centro queda dentro de ×5, pero en la esquina Q10 = 2.0 con el cerebro a 15 °C llega a ×6.5 (fuga; no se mueve el umbral, R2). A 10 °C y 60 min: sin daño cerebral funcional ni histológico."}
  L10: {capa: ley, e: V, deps: [F31, L6], t: "Cargar crioprotector a escala de riñón humano (150–220 g, cerdo y humano) es factible: respuesta osmótica tipo célula, daño bajo (LDH) y distribución confirmada por TC. Con vehículo hipotónico la resistencia vascular sube hasta ×10 (reversible)."}
  X1: {capa: frontera, e: V, deps: [C7, F23, F25, F38], t: "**Zona gris en dos tramos.** (i) {C7.tau_org_good}–{tau_org_exist} min = **frontera de reproducibilidad**: hay al menos un organismo recuperado (gata, isquemia sólo cerebral), pero no es reproducible y quedan lesiones. (ii) {tau_org_exist}–{C7.tau_cel} min = **sólo celular**: células y sinapsis recuperables, sin organismo demostrado. Es la frontera empírica central."}
  O4: {capa: ontologia, e: V, deps: [F38, O2], t: "**Función ≠ información también a nivel de organismo:** la gata de Hossmann recuperó función integrativa (camina, come, EEG normal al año) tras 1 h de isquemia cerebral, pero con atrofia casi completa del hipocampo dorsal y del estriado. Recuperar la función no garantiza conservar la memoria. StasisPath debe reportar por separado la **recuperación funcional (E4)** y la **conservación de información**."}
  G4b: {capa: magnitud, e: V, deps: [F37b, F26, F65], t: "**Criterio operativo de D_CPA, ahora con fuente y banda medida.** Métrica: **K⁺/Na⁺ del tejido tras lavar el CPA**, frente a control sin tratar. **Banda sin daño medida: 93–103 %** en lonchas de corteza renal de conejo (F65); las de hipocampo con VM3 dieron 91–108 % (F37b). El umbral que propuse (≥ 90 %) queda **confirmado y ligeramente por debajo** de la banda medida. No es universal: depende de tejido y protocolo (E7)."}
  G7: {capa: magnitud, e: V, deps: [F37b, F53, F54], t: "**Lesión por frío sin hielo (chilling) — magnitud cerrada con campos vecinos.** Mecanismo: transición de fase de los lípidos de membrana de líquido-cristalino a gel, con el daño máximo entre 0 y 20 °C. **Umbral medible por FTIR** (reproducción humana, F53): cigoto 10.0 ± 1.2 °C, ovocito maduro 16.9 ± 0.9 °C, ovocito inmaduro 24.4 ± 1.6 °C ⇒ la temperatura de transición **depende del tipo celular** y hay que medirla, no suponerla. En tejido **neural**: las lonchas de hipocampo se inactivan sólo con 0 °C, y la lesión se mitiga con **vitamina C 0.8 mM**, un aCSF más «intracelular» (menos Na y Ca, más K) y los propios solutos del CPA; con RPS-2 como portador, **0 °C protegió más que 10 °C** (F37b), y una proteína anticongelante tipo I a 10 mg/mL protege lonchas de hipocampo de rata de **8 h a 4 °C + recalentamiento** frente a albúmina de control (F54) ⇒ la lesión por frío en neuronas es real **y farmacológicamente evitable**. **Falta el dato propio:** la temperatura de transición del tejido neural adulto de mamífero no está medida; se mide con FTIR igual que F53.  **Tanda 49, higiene del grafo:** `deps` tenía `F37b` DUPLICADO; se deja una sola vez (no cambia ningún estatus, la regla del motor toma el mínimo)."}
  L11: {capa: ley, e: V, deps: [F37b, F35], t: "**La tensión de la congelación lenta en tejido neural queda RESUELTA al leer las dos primarias, y el culpable no es la velocidad: es la formulación.** F37b congeló lonchas de rata ADULTA a 1.2 °C/min con **glicerol o DMSO solos** y obtuvo daño severo. F35 congela lentamente tejido cerebral humano y organoides con **MEDY = 10 % DMSO + 10 % EG + metilcelulosa + Y-27632**, y conserva citoarquitectura y actividad funcional; los organoides de pacientes con epilepsia **mantienen su patología** tras descongelar. ⇒ Los dos resultados **no se contradicen**: difieren en tres variables declaradas — (a) un **inhibidor de ROCK** que bloquea la apoptosis, ausente en F37b; (b) **metilcelulosa**, que modula el hielo extracelular; (c) la **escala** (organoide y biopsia de milímetros frente a loncha de rata adulta). **El fracaso de F37b es atribuible al CPA, no a congelar despacio.** **Fuga declarada, y es la que importa:** MEDY sólo se ha probado a escala de milímetros; **nada dice de un órgano ni de un cerebro entero**, donde el hielo extracelular y la perfusión son otro problema. No convierte la congelación lenta en una vía a escala humana.", cierra: "[laboratorio] MEDY (o equivalente) aplicado a un volumen de escala de órgano"}

