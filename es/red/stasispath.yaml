  F34: {cita: "MICrONS Consortium 2025, Nature 640:435–447. **Texto completo leído (PMC11981939).** Volumen 1.3×0.87×0.82 mm³; 84.035 neuronas segmentadas; **524 M de sinapsis** detectadas; >1 M de ediciones manuales; sólo **85 neuronas con axón completo** y 1.188 con dendritas revisadas. Detección de sinapsis: 96 % precisión, 89 % exhaustividad; asignación de pareja 98 %. Limitación declarada: **la segmentación automática de axones no es tan precisa** como la de dendritas", url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC11981939/", estatus: V}
  F35: {cita: "Xue et al. 2024, Cell Rep Methods (MEDY). **PDF COMPLETO LEÍDO (tanda 46).** Método de criopreservación **MEDY = metilcelulosa + etilenglicol + DMSO + Y-27632** (inhibidor de ROCK) para **organoides corticales humanos y tejido cerebral humano vivo**. Conserva citoarquitectura neural y **actividad funcional**; se aplica a organoides de prosencéfalo dorsal y ventral, médula espinal, vesícula óptica y **organoides derivados de pacientes con epilepsia**, que **mantienen sus rasgos patológicos tras descongelar**. El transcriptoma muestra protección de la función sináptica e inhibición de la apoptosis mediada por retículo endoplásmico. **Es congelación lenta con CPA diluido (10 % DMSO + 10 % EG), NO vitrificación**: la escala a la que funciona es de organoide y biopsia, no de órgano", url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC11133841/", estatus: V, cierra: "cerrada en tanda 46: primaria leída (MEDY, congelación lenta a escala de organoide)"}
