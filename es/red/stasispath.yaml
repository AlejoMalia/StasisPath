  F52: {cita: "German & Akdaş 2024, preprint bioRxiv 2024.06.03.597218 (lonchas corticohipocampales de ratón con 61 % p/v ETILENGLICOL solo: fEPSP recuperados, pero NO se logró potenciación estable tras HFS; hinchazón y vacuolización). **VERIFICADO EN LA TANDA 48 y queda CERRADA la duda que abrió la tanda 45:** la candidata a versión publicada, PNAS 123(24):e2605838123 (PMID 42258742), **NO lo es** — es un **comentario** de Maya-Romero y Zoncu (UC Berkeley) sobre el artículo de German, con otro título y otros autores. A septiembre de 2026 F52 **sigue siendo preprint en bioRxiv v1**, sin revista. Sólo la cierra el calendario de una revista", url: "https://www.biorxiv.org/content/10.1101/2024.06.03.597218v1", estatus: P, cierra: "[espera] bioRxiv 2024.06.03.597218 sin versión publicada confirmada"}
