  LC_esfera:   {expr: "lambda m: (3*m/(4*math.pi))**(1/3)/3", tipo: fn, u: "cm", d: "LC de una esfera de agua de masa m (g)"}
  # --- cinética térmica
  tasa_conv:   {expr: "lambda LC: anc_rate*(anc_LC/LC)**exp_LC", tipo: fn, u: "°C/min", d: "enfriamiento convectivo en el centro (C3)"}
  # --- química: relación CCR <-> molaridad, pendiente LOCAL cerca de 9 M (justificada por L31)
  b_CCR:       {expr: "(math.log10(CCR_M22) - (math.log10(CCR_VS55)+math.log10(CCR_VMP))/2) / (9.3-8.4)", u: "décadas/M", d: "pendiente local de log10(CCR) frente a molaridad"}
  a_CCR:       {expr: "(math.log10(CCR_VS55)+math.log10(CCR_VMP))/2 - b_CCR*8.4", u: "", d: "ordenada de la recta CCR-molaridad"}
  M_de_CCR:    {expr: "lambda ccr: (math.log10(ccr) - a_CCR)/b_CCR", tipo: fn, u: "mol/L", d: "molaridad necesaria para una CCR dada"}
  # --- umbral de toxicidad medido (German, F72)
  M_toxico:    {expr: "9.28", u: "mol/L", d: "molaridad a la que la respiración basal cae a la mitad"}
  # --- frontera de viabilidad: LC y masa a partir de los cuales la química necesaria es tóxica
  LC_viable:   {expr: "next(i/100 for i in range(25,2000) if M_de_CCR(tasa_conv(i/100)) > M_toxico)", u: "cm", d: "LC crítica de F2"}
  masa_viable: {expr: "4/3*math.pi*(3*LC_viable)**3/1000", u: "kg", d: "masa crítica de F2"}
  # --- validaciones externas (campos lejanos)
  tasa_canal:  {expr: "36.0/(15.5*60)", u: "°C/min", d: "media canal de vacuno, 40->4 °C en 15.5 h (F79)"}
  razon_canal: {expr: "tasa_canal/tasa_conv(7.5)", u: "", d: "medido/predicho a escala de 150 kg"}
  limite_LNG:  {expr: "9.0/60", u: "°C/min", d: "límite industrial de enfriamiento sin daño estructural (F84)"}
