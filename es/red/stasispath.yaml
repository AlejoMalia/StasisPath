  F56: {cita: "Januszewski, Kornfeld, Li, Pope, Blakely, Lindsey, Maitin-Shepard, Tyka, Denk, Jain 2018, Nat Methods 15:605–610 (PMID 30013046). **Verificado en la primaria.** Flood-filling networks sobre cerebro de pinzón cebra (SBEM): **ERL = 1.1 mm** de neurita sin error, y sólo 4 fusiones en un conjunto de prueba de 97 mm; un orden de magnitud mejor que lo previo, a costa de mucho más cómputo", url: "https://pubmed.ncbi.nlm.nih.gov/30013046/", estatus: V}
  F57: {cita: "Uygun, Taggart, Hassan, Lyon, Ozgur, Taveras, Mojoudi, Agius, Tessier, Markmann, Yeh, Longchamp, Toner 2026, **Research Square rs.3.rs-7820837 / NIH Public Access (PMC12869680)** y actas en **Am J Transplant 2024 (MO-8, S1600-6135(24)00812-8) y 2025 (S1600-6135(25)00885-8)**. **MANUSCRITO COMPLETO Y SERIES NUMÉRICAS LEÍDAS (2026-09-27, aportado por el usuario):** protocolo de congelación parcial a **−15 °C** durante 3 a 10 días en riñones de cerdo y humanos con perfusato protector (PEG 35k, 3-OMG, propilenglicol, trehalosa y nucleador SnoMax). Resultados cuantitativos: (1) Porcino: autotrasplante real in vivo tras 10 días a −15 °C con producción inmediata de orina y recuperación de función (informe MGH / Univ. Minnesota / Kolata NYT 2025); n=6 a 10 días PF vs SCS convencional que colapsa; histología con 22.6 % menos daño que SCS; (2) Humano: n=4 (3 días) y n=3 (10 días) en riñones descartados (KDPI 95, 18.9 h de isquemia previa), con aclaramiento de creatinina al ~50–57.5 % del valor previo, resistencia vascular estable y producción de orina durante 2 h de trasplante simulado (reperfusor normotérmico). Intento a 30 días genera daño grave (límite validado: 10 días).", url: "https://doi.org/10.21203/rs.3.rs-7820837/v1", estatus: V, cierra: "cerrada 2026-09-27: manuscrito completo de NIH/Research Square, actas AJT 2024/2025 y autotrasplante in vivo documentados"}
  F58: {cita: "Dave, Prado, Raval, Drew, Perez-Pinzon 2006, Stroke 37:1261 (ardilla ártica EUTÉRMICA, parada cardíaca de 8 min: recuento neuronal sin diferencia frente a control a 7 días; las ratas control sí se lesionan; PMID 16574920)", url: "https://pubmed.ncbi.nlm.nih.gov/16574920/", estatus: V}
  F59: {cita: "Kavian, Sellers, Sanchez, Alvarez, Aguilar, Powell-Palm 2025, Sci Rep 15:27903 (criomacroscopio + segmentación + FEM: el agrietamiento depende fuertemente de la Tg de la solución; 4 químicas con > 50 °C de rango en Tg; PMID 40745362)", url: "https://pubmed.ncbi.nlm.nih.gov/40745362/", estatus: V}
  F60: {cita: "Jackson & Ultsch 2010, J Exp Zool A 313:311 (tortugas pintadas y mordedoras sobreviven 4–5 meses sin O₂: depresión metabólica + tamponamiento del ácido láctico por caparazón y huesos; las ranas NO sobreviven ni 1 semana en agua anóxica; PMID 20535765)", url: "https://pubmed.ncbi.nlm.nih.gov/20535765/", estatus: V}
  F64: {cita: "Tessier et al. 2022, Front Phys (PMC10161798). **Texto completo leído.** Moduladores de hielo en congelación parcial de hígado de rata a −10/−15 °C con glicerol 12 % v/v (1.64 M): **AFGP 0.5 mg/mL** (inhibe recristalización, se une al cristal) y **X-1000 0.1 % + Z-1000 0.2 %** (X inhibe recristalización, **Z suprime la nucleación heterogénea**). Fracción no congelada ~60 % a −10 °C y ~73 % a −15 °C; 1–5 días; n = 4 por grupo, 13 controles. AFGP redujo edema (p = 0.029) pero dañó el endotelio; X/Z mantuvo ATP y carga energética altos pero dio edema post-descongelación", url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC10161798/", estatus: V}
  F65: {cita: "Fahy, Wowk, Wu, Phan, Rasch, Chang, Zendejas 2004, Cryobiology 48:157–178. **PDF completo leído (21cm.com).** Introduce el **gráfico viabilidad–estabilidad**: viabilidad como K⁺/Na⁺ de lonchas de corteza renal de conejo tras lavar el CPA, frente a la mWCR (velocidad mínima de calentamiento que confina la cristalización al ~0.2 % de la masa). **Banda sin daño: 93–103 % del control sin tratar.** M22 se diseñó para usarse **a −22 °C**; a −3 °C su toxicidad sería inaceptable. VM3 a 40 min da K⁺/Na⁺ medio, y a 30 min se acerca al control", url: "https://www.21cm.com/pdfs/cryopreservation_advances.pdf", estatus: V}
  F66: {cita: "Tessier, de Vries et al. 2022, Nat Commun 13:4008 (PMC9287450). **Texto completo leído.** Congelación parcial de hígado de rata a −10/−15 °C: propilenglicol 12 % v/v, 3-OMG 200 mM, trehalosa y rafinosa, PEG 5 %, **nucleador Snomax 1 g/L**. 5 días a −15 °C con O₂ y lactato comparables al control, **pero bilis mucho menor y enzimas muy altas (AST/ALT ~1270/768 frente a ~79/35 U/L)**", url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC9287450/", estatus: V}
  F67: {cita: "Barnes 1989, Science 244:1593 (PMID 2740905). **Resumen primario verificado.** Ardilla ártica hiberna con temperatura corporal de hasta **−2.9 °C sin congelarse**; mínima media en febrero −1.9 °C. **Plasma con solutos normales y NINGUNA evidencia de anticongelantes** ⇒ sobreenfriamiento puro", url: "https://pubmed.ncbi.nlm.nih.gov/2740905/", estatus: V}
  F68: {cita: "Solanki, Bischof, Rabin 2017, Cryobiology (PMID 28192076). **PDF completo leído.** Análisis termomecánico de bolsas criogénicas con forma de almohada, parametrizadas por semilongitud a = 61 mm y razones b/a y c/a (c/a de 0.016 a 1). Hallazgos: (1) **el estrés máximo NO se da con la bolsa llena al máximo** (cuando se parece a una esfera); (2) la razón anchura/longitud pesa mucho; (3) **bajar la velocidad de calentamiento inicial entre la temperatura de almacenamiento y Tg reduce drásticamente el estrés**; (4) el nanowarming también lo reduce drásticamente", url: "https://pubmed.ncbi.nlm.nih.gov/28192076/", estatus: V}
  F69: {cita: "Tomorrow Biostasis, informe del caso P-19 (2024). **PDF completo releído, incluidas las tablas de cronología y el análisis de TC.** Equipo de 3 personas, dos guardias previas (3 y 4 días). **Cronología desde la parada cardiorrespiratoria:** declaración legal ~1 h · llegada al tanatorio ~1 h 30 · compresiones torácicas (LUCAS-2) y medicación **1 h 43** · intubación 1 h 47 · fin de estabilización 2 h 37 · inicio de cirugía 4 h 09 · **INICIO DE PERFUSIÓN 4 h 40** · fin de perfusión 9 h 04 · inicio de enfriamiento **96 h** · fin 127 h · TC craneal 198 h. Lavado con 21 L de MHP-2; CPA objetivo **65 % p/v**. **TC a −196 °C: el 83.17 % del área cerebral superó el 100 % de la concentración objetivo y el 97.42 % superó el 92 %.** **Encogimiento cerebral del 36 %** (corte axial 2D). Incidencia: agotamiento temporal de N₂ líquido hacia la hora 85", url: "https://www.tomorrowbio.com", estatus: V}
  F70: {cita: "Pamenter et al. 2018, PLOS One 13:e0208453. **PDF completo leído.** Efecto del frío (37 → 6 °C) en mitocondrias de cerebro de ratón permeabilizado: **Q10 de respiración estado II = 2.61 ± 0.09 y estado III = 3.92 ± 0.31**; fuga de H⁺ Q10 = 4.4. Por complejos: citrato sintasa y complejos I, III y IV poco sensibles (Q10 1.2–2.4), complejo II 4.2 y **complejo V 11.3**. Concuerda con grasa parda de ardilla (2.4) y músculo/hígado (2.8–6.5)", url: "https://doi.org/10.1371/journal.pone.0208453", estatus: V}
  F71: {cita: "German et al. 2026, PNAS — **Información suplementaria, PDF completo leído.** Los autores declaran textualmente que lograron **omitir los polímeros «Supercool» de la composición** y que llamaron **«V3» por referencia a VM3** y por sus tres disolventes permeables. Composición molar de V3: **2.85 M DMSO + 2.71 M EG + 2.86 M formamida = 8.42 M de CPA permeable**, más 23–35 mM impermeable. Carga en pasos de concentración creciente **a 10 °C** con portador LM5 o CI-VM-1. Cerebro entero: 8 min de carga a 1 mL/min, 25 min de perfusión en baño a 4 °C, inmersión 2 min en V3 al 65 % p/v a −20 °C y después isopentano a −140 °C. Probaron además EG al 61 % solo y EG 37.5 % + DMSO 12.5 %: **V3 dio la mejor recuperación funcional**", url: "https://www.pnas.org/doi/suppl/10.1073/pnas.2516848123", estatus: V}
  F72: {cita: "German, Akdaş, Flügel-Koch, Erterek, Frischknecht, Fejtova, Winkler, Alzheimer y Zheng 2026, **PNAS 123(10):e2516848123** (PMID 41774797). **Tanda 45: es el MISMO trabajo que F46** — el preprint bioRxiv 2025.01.22.634384v3 que aquí se citaba es su versión previa, con idéntico título e idénticos autores. F72 conserva el extracto numérico detallado (serie de concentración) y F46 el resultado de LTP; **el dato ya no es de preprint**. **PDF completo leído.** Serie de concentración en lonchas, **exposición a CPA SIN enfriar bajo −10 °C** para aislar la química: respiración basal (pmol/min) control **173.3 ± 6.7** · 30 % p/v (4.28 M) **139.7 ± 3.1** · 59 % (8.42 M) **135.1 ± 6.7** · **65 % (9.28 M) 80.4 ± 5.6** (Spearman r = −0.90, p = 0.0002). Capacidad de reserva: 73.4 → 62.3 → 48.6 → **38.9**. Los autores lo llaman «toxicidad que aumenta bruscamente». **Y no hubo diferencia entre exposición a CPA estándar y vitrificación completa** (135.1 vs 131.4; reserva 48.6 vs 50.6). Umbrales: sin cristalización al enfriar desde 58 % p/v; recuperación con éxito desde **57 %**", url: "https://www.biorxiv.org/content/10.1101/2025.01.22.634384v3", estatus: V, cierra: "cerrada en tanda 45: es el mismo trabajo que F46, PNAS 123(10):e2516848123"}
  F73: {cita: "Buck & Barnes 2000, Am J Physiol 279:R255 (PMID 10896889). **Resumen primario verificado.** Ardilla ártica en torpor: entre Ta 0 y −16 °C la Tb se mantiene y la tasa metabólica **sube más de 15 veces** desde un mínimo de 0.0115 mL O₂/g/h. **Entre Tb 0 y 12 °C la tasa NO cambia significativamente: inhibición del metabolismo independiente de la temperatura.** El cambio global de Tb 4 a 20 °C equivale a **Q10 = 2.4, pero dentro de ese rango el Q10 varía de 1.0 a 14.1**. Cociente respiratorio 0.70 en torpor estable (sólo lípidos); sube por encima de 0.85 a Ta −16 y 20 °C. **El CR correlaciona negativamente con la duración máxima del episodio de torpor**", url: "https://pubmed.ncbi.nlm.nih.gov/10896889/", estatus: V}
  F74: {cita: "Proteínas CAHS de tardígrado y vitrificación biológica. **LEÍDO COMPLETO (PMC5987194, 2026-09-27):** (1) **Boothby et al. 2017, *Mol Cell* 65:975–984** (DOI 10.1016/j.molcel.2017.02.018; PMC5987194): las proteínas CAHS (*cytosolic abundant heat soluble*) de *Hypsibius dujardini* vitrifican in vitro por DSC y confieren desiccation tolerance a levadura heteróloga. **La supervivencia correlaciona estrictamente con el estado vítreo** (Fig 7D, 7E): por debajo de la Tg inducida por CAHS la supervivencia es alta, cae bruscamente dentro del rango de Tg y llega a cero al superarla. **CORRECCIÓN DE LECTURA PROPIA:** la ficha anterior citaba «Tg ~60 y ~135 °C» — esos números en el PDF eran 60 µg/mL de kanamicina y 135 kPa de vacío; las curvas de DSC muestran transiciones amplias dependientes de humedad residual, sin una Tg fija. (2) **Gelificación (Malki et al. / Sanchez-Martinez et al. 2024 / Tanaka et al. 2022, PLOS Biol):** las CAHS forman gel por autoensamblaje reticular dependiente de concentración: **>15 g/L (~0.6 mM) gel robusto**, 10–15 g/L viscoso, **<10 g/L (~0.4 mM) disolución líquida/difusa**. (3) **Debate:** Arakawa & Numata 2021 (*Mol Cell* 81:409) sostienen que el efecto térmico en DSC es deshidratación y no Tg; Boothby et al. 2021 (*Mol Cell* 81:411) defienden que el agua residual modula una Tg real. **Dato clave para el marco:** vitrifican a **~0.6 mM**, unas 4 órdenes de magnitud por debajo de los solutos pequeños (~9 M). **Campo vecino: anhidrobiosis**", url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC5987194/", estatus: V, cierra: "cerrada 2026-09-27: PMC5987194 leído completo; corregido error de kanamicina/vacío y añadido contexto de gelificación Malki/Tanaka"}
  F75: {cita: "Roughton, Topp & Camarda 2012, Comput Chem Eng 36:10 (PMID 24385675). **Campo vecino: liofilización farmacéutica.** Marco computacional de diseño molecular que **optimiza excipientes** maximizando la Tg del soluto anhidro y minimizando el contenido de agua en la matriz crioconcentrada. Desarrollan relaciones cuantitativas estructura-propiedad para **Tg del soluto anhidro, Tg', punto de fusión del hielo y constante de Gordon-Taylor**, y resuelven la optimización con búsqueda tabú", url: "https://pubmed.ncbi.nlm.nih.gov/24385675/", estatus: V}
  F76: {cita: "Mowry, Krüger, Drabbels y Lorenz (EPFL) 2025, **Phys Rev Research 7:013095** (DOI 10.1103/PhysRevResearch.7.013095; arXiv 2407.01087). **LEÍDO COMPLETO (2026-09-27).** Método: microscopía electrónica con difracción de electrones resuelta en tiempo in situ en película de agua amorfa de **206 nm** sobre grafeno; fundido ultrarápido con pulso láser (≥10⁸ K/s) seguido de enfriamiento conductivo a velocidad controlada. **Valor medido directamente: CCR = (6.4 ± 0.5) × 10⁶ K/s = (3.84 ± 0.30) × 10⁸ °C/min** — en el extremo bajo del espectro histórico (10⁵–10¹² K/s), validando la estimación de Dubochet 1981 (~10⁶ K/s) y descartando los modelos que exigían >10⁸ K/s. Extrapolación a concentración cero desde soluciones de CPA: ~2.5 × 10⁵ K/s; el valor real es **×25 mayor**, confirmando que la curva CCR↔concentración es convexa (no lineal) cerca de 0 M. Con añadir CPA la CCR cae >7 órdenes de magnitud. Espesor crítico sin CPA: LC* ≈ √(α·ΔT/CCR) ≈ **1.5 µm** (coincide con práctica de cryo-EM). Con congelación a alta presión (2000 bar, Tm baja a −22 °C) la CCR necesaria cae ×100 → espesor hasta ~200 µm. **Campo lejano: criomicroscopía electrónica**", url: "https://doi.org/10.1103/PhysRevResearch.7.013095", estatus: V, cierra: "cerrada 2026-09-27: leída completa vía arXiv; valor medido directamente con incertidumbre"}
  F77: {cita: "Lu y Liu 2002, **Acta Mater 50:3501–3512** (DOI 10.1016/S1359-6454(02)00166-0). **LEÍDO COMPLETO (2026-09-27).** Definen Trg = Tg/Tl y **γ = Tx/(Tg+Tl)**. Formulan dos ecuaciones explícitas con R²=0.91 abarcando 6 órdenes de magnitud: **R_c = 5.1 × 10²¹ · exp(−117.19 γ) K/s** (velocidad crítica de enfriamiento — análogo exacto de CCR) y **Z_c = 2.80 × 10⁻⁷ · exp(41.70 γ) mm** (espesor crítico de sección — análogo exacto de LC*). Rango de γ: vidrios marginales 0.35 → Vitreloy 1 (Zr-Ti-Cu-Ni-Be) ~0.43 → mejores aleaciones Pd-Cu-Ni-P ~0.45. Sección vitrificable: γ=0.35 → 0.6 mm; γ=0.40 → 4.9 mm; γ=0.43 → 11–17 mm; γ=0.45 → ~40 mm (experimental Pd hasta 72–80 mm). γ correlaciona mejor que Trg porque integra la cinética de desvitrificación (Tx) además de los límites termodinámicos. Criterio de Turnbull (Trg>2/3) es teóricamente suficiente pero prácticamente inalcanzable en metales. **Campo lejano: ciencia de materiales** — el marco de diseño de γ es trasladable a crioprotectores: CCR y LC* como funciones de parámetros termodinámicos medibles", url: "https://doi.org/10.1016/S1359-6454(02)00166-0", estatus: V, cierra: "cerrada 2026-09-27: leída completa; ecuaciones Rc y Zc verificadas con datos numéricos"}
  F78: {cita: "Hibernación del oso negro. **PDF COMPLETOS LEÍDOS (tanda 46).** **Músculo** (Fedorov, Garreau, Tøien, Barnes y Goropashnaya 2025, Ecol Evol 15:e71669): pérdida **limitada** de masa y proteína muscular pese a meses de inmovilidad y ayuno; el perfil de expresión muestra mantenimiento de la biosíntesis proteica por la vía **mTORC1** y preservación de aminoácidos ramificados (BCAA). **Hueso** (Sci Rep 2021, 41598_2021_87785): **ninguna pérdida de masa ósea en 4–6 meses de inmovilidad**, con **regulación a la baja coordinada de los genes de resorción ósea** y sin cambios en los de formación ⇒ el hueso no se pierde porque **se apaga la reabsorción**, no porque se fabrique más", url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC8050052/", estatus: V, cierra: "cerrada en tanda 46: ambas primarias leídas"}
  F79: {cita: "Refrigeración industrial de canales de vacuno. **DOS FUENTES LEÍDAS (2026-09-27):** (1) **Cano-Muñoz 1991, FAO Animal Prod Health Paper 92**, *Manual on meat cold store operation and management*, cap. T0098E02 — guía técnica de práctica industrial: media canal ~150–200 kg, núcleo a **40 °C** postmortem (transitoriamente 40–41 °C por glucólisis anaeróbica), media de **~15 °C a las 4 h** en túnel rápido, estabilización a **~4 °C a las 15–16 h** (proceso continuo dos fases); congelación en túnel a −30/−35 °C, aire 2–4 m/s: **16–20 h** para media canal. Temperatura de aire: 0 °C (rango −1 a +1 °C), HR 90–95 %. Tasa media efectiva: (40−4)/15.5h = 2.32 °C/h = **0.0387 °C/min**. (2) **Mallikarjunan & Mittal 1994, J Food Eng 23:277–292** — modelo de elementos finitos 2D validado contra perfiles experimentales (±2.7 °C); es SIMULACIÓN, no campaña de medición primaria — la salvedad de L34 es correcta. **Dato clave para el grafo:** la tasa 0.0387 °C/min vs. C3 predicho para LC≈7.5 cm confirma el escalado LC⁻ⁿ a 100+ kg. **Campo lejano: industria alimentaria**", url: "https://www.fao.org/4/t0098e/t0098e02.htm", estatus: V, cierra: "cerrada 2026-09-27: FAO manual leído directo; Mallikarjunan 1994 identificado como simulación (salvedad ya declarada en L34)"}
  F80: {cita: "Jesus, Duarte y Paiva 2022, Sci Rep 12:8095. **PDF COMPLETO LEÍDO (tanda 46).** NADES como medio de vitrificación en **líneas celulares L929 (fibroblasto de ratón) y HacaT (queratinocito humano)**, al **50 % p/v**, congeladas por **inmersión directa en N2 líquido** en crioviales. **CORRECCIÓN DE UN ERROR PROPIO:** la ficha anterior decía «94.65 % de viabilidad en células madre mesenquimales humanas, sin diferencia frente a DMSO». **Ese número NO aparece en el artículo y no se estudian células madre** (sólo se mencionan como trabajo futuro); la viabilidad se informa como densidad óptica, no como porcentaje. **DATO QUE EL MARCO NECESITABA, y va en contra:** en DSC enfriando a **30 °C/min los NADES al 50 % p/v CRISTALIZAN** (Tc onset: BetSucProW −26.6, BetTreW −32.3, TreGluSorW −31.0; agua pura −23.7) ⇒ **CCR > 30 °C/min**. En las mismas condiciones el **DMSO al 50 % v/v NO cristaliza** ⇒ a esta concentración los NADES vitrifican PEOR que el DMSO. La concentración se limita al 50 % por toxicidad y viscosidad. Los autores llaman «vitrificación» a la inmersión en N2 (15 000–30 000 °C/min), no a un vidrio de CCR baja", url: "https://www.nature.com/articles/s41598-022-12365-4", estatus: V, cierra: "cerrada en tanda 46: primaria leída; refuta el atajo de L44"}
  F81: {cita: "Tolerancia neuronal a la hipoxia en la foca de casco (*Cystophora cristata*). **TRES PRIMARIAS LEÍDAS (2026-09-27): (1) Folkow, Ramirez, Ludvigsen, Ramirez y Blix 2008, *Neurosci Lett* 446:147–150** (DOI 10.1016/j.neulet.2008.09.040; PMID 18824079): **registros intracelulares** en rodajas de corteza visual. Ratón: despolarización −65.0 mV, cesa descarga en **5 ± 2 min**. Foca: despolarización −13.4 mV, descarga media **19 ± 10 min**, máximo **60 min** en hipoxia severa continua. **CORRECCIÓN:** la ficha anterior atribuía esta comparación a Mitz; procede de Folkow. **(2) Mitz, Reuss, Folkow, Blix, Ramirez, Hankeln y Burmester 2009, *Neuroscience* 163:552–560** (DOI 10.1016/j.neuroscience.2009.06.058; PMID 19576963): IHC + Western blot. En mamíferos terrestres la neuroglobina (Ngb) y el citocromo c son **neuronales**; en la foca de casco ambos están **en astrocitos fibrilares** (GFAP+), con cuerpos neuronales casi indetectables. La concentración total de Ngb cerebral no difiere entre foca y ratón — la adaptación es la **inversión de compartimentación**. **(3) Hoff, Fabrizius, Czech-Damal, Folkow y Burmester 2017, *PLOS ONE* 12:e0169366** (DOI 10.1371/journal.pone.0169366; PMID 28046118): ARN-Seq tras 1h de hipoxia (1% O₂) y 1h de reoxigenación. Represión de canales iónicos y transmisión sináptica; sobreexpresión de MCT4 (expulsión rápida de lactato neuronal); chaperonas Clusterina y S100B; citocromo c y LDHB en astrocitos confirman **rANLS** (lactato neurona→astrocito, inverso del ANLS clásico). **Campo lejano: fisiología del buceo**", url: "https://www.frontiersin.org/journals/physiology/articles/10.3389/fphys.2019.01199/full", estatus: V, cierra: "cerrada 2026-09-27: tres primarias leídas entera (Folkow 2008, Mitz 2009, Hoff 2017)"}
  F82: {cita: "Homogeneidad de campo B1 a 7 T. **DOS PRIMARIAS LEÍDAS ENTERAS (tanda 55), que sustituyen a las revisiones que esta ficha citaba:** (a) **Investigative Radiology, «Ready for Routine: Homogeneous, High-Resolution and Multicontrast Whole-Brain MRI at 7 Tesla…»** — medición **IN VIVO**: 10 voluntarios sanos escaneados, más mapas B1 de **82 sujetos en 3 centros** (Bonn y otros). Declara que las inhomogeneidades de B1 «**resultan de interferencias de radiofrecuencia y resonancias dieléctricas** a la frecuencia de Larmor de **300 MHz a 7 T**» y que degradan la calidad **sobre todo en las regiones infratentoriales excéntricas**, hasta limitar el uso clínico. Es exactamente el mecanismo ondulatorio que L37 contrasta. (b) **arXiv 1911.05313, «B1+ Homogenization in 7T MRI»** — modelo electromagnético que declara **εr = 64** para el tejido a 7 T, que es la permitividad con la que se reproducen las longitudes de onda de L37. **Antes era [P] por ser revisiones; ahora [V] por primarias leídas**", url: "https://journals.lww.com/investigativeradiology/fulltext/9900/ready_for_routine__homogeneous,_high_resolution,.394.aspx", estatus: V, cierra: "cerrada en tanda 55: dos primarias leídas enteras, una con medición in vivo"}
  F83: {cita: "Tolerancia fetal y neonatal a la hipoxia. **DOS FUENTES LEÍDAS (2026-09-27): (1) Giussani 2016, *J Physiol* 594:1215–1230** (DOI 10.1113/JP271099; PMC4721497; PMID 26678231) — *brain sparing*: bradicardia del **25–35 %** en hipoxia moderada (hasta 50–60 % en asfixia severa), mediada por quimiorreflejo carotídeo vagal. Vasodilatación cerebral por **adenosina** (principal mediador). Vasoconstricción periférica por catecolaminas. La temperatura fetal *in utero* NO baja (el feto está clampado a la madre vía placenta); la bajada de temperatura es una respuesta del **neonato** (4–8 °C en roedores, 2–4 °C en humano). Hipometabolismo: el feto reduce VO₂ un **30–50 %** adicional en asfixia aguda. **(2) Singer 1999, *Comp Biochem Physiol A* 123:221–234** (DOI 10.1016/S1095-6433(99)00057-4) — origen de las frases textuales del marco: «desviación tipo hibernación de la alometría de Kleiber» (tasa metabólica fetal ~igual a adulto, no ×3–8 como predice Kleiber), «hipometabolismo hipóxico», «torpidez acidótica», «vulnerabilidad cerebral comparable a la del cerebro de tortuga buceadora». Duración de anoxia tolerada: **neonato de rata 40–50 min** vs adulto 1.5–3 min (×20–30); **neonato de perro 20–30 min** vs adulto 3–5 min (×5–8); feto a término (cordero/mono) **8–12 min** de oclusión total. Gradiente ontogénico: la tolerancia anóxica **disminuye progresivamente** desde el feto precoz (~25 min) → término (~10 min) → adulto (~2 min). Mecanismos: GABA (channel arrest), silenciamiento NMDA, glucógeno cardíaco (Dawes 1959). **Campo lejano: fisiología perinatal**", url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC4721497/", estatus: V, cierra: "cerrada 2026-09-27: Giussani 2016 (PMC4721497) y Singer 1999 leídos; matiz feto vs neonato en temperatura declarado"}
  F84: {cita: "Wang, Webley y Hughes (Monash Univ.) 2025, **Energy 334:137568** (DOI 10.1016/j.energy.2025.137568; PII S0360-5442(25)03210-4). **LEÍDO COMPLETO (2026-09-27).** Título: *«Cooldown strategies for ship-borne cryogenic storage tanks during the ballast voyage»*. Tasa segura industrial: **< 9–10 °C/h = 0.150 °C/min** (norma EN 14620-5; límite no rebasable 15 °C/h para membranas criogénicas; gradiente espacial máximo 50 °C entre sensores adyacentes). Escala: tanques de 35.000–45.000 m³ (16.000–20.000 t de LNG por tanque en buque metanero); tanques en tierra 100.000–200.000 m³. Tiempo de cooldown desde temperatura ambiente: **8–12 h** (desde caliente post-dique: 18–24 h). Razón física: tensión térmica por contracción diferencial (σ_th ≈ E·α·ΔT/(1−ν)); acero AISI 304L α≈16×10⁻⁶ K⁻¹, módulo ~190–210 GPa. Materiales: acero inoxidable austenítico (GTT Mark III), Invar Fe-36Ni (NO96) o aluminio 5083 (Moss). **COINCIDENCIA EXACTA CON C3 (declarada en L38):** C3 predice para LC ~3.9 cm (cuerpo humano) una tasa de 0.150 °C/min — idéntica al límite industrial de F84. El significado: la ingeniería criogénica lleva décadas usando la misma velocidad que la conducción térmica impone al cuerpo humano. **Campo lejano: ingeniería criogénica**", url: "https://doi.org/10.1016/j.energy.2025.137568", estatus: V, cierra: "cerrada 2026-09-27: Wang et al. 2025, revista Elsevier Energy, peer-reviewed; datos de norma EN 14620-5 y buques metaneros"}
  F85: {cita: "Bruinsma, Berendsen, Uygun et al. — sobreenfriamiento y trasplante de hígado de rata (Nat Protoc 2015, nprot.2015.011). **PDF COMPLETO LEÍDO (tanda 46).** El hígado de rata se enfría a **−6 °C sin congelarse y se mantiene viable hasta 96 h**, con **trasplante ortotópico real** (a diferencia de F8 y F22, que sólo simulan). Supervivencias: **100 % a 72 h y ~58 % a 96 h**", url: "https://pubmed.ncbi.nlm.nih.gov/24973919/", estatus: V, cierra: "cerrada en tanda 46: primaria leída (protocolo y supervivencias)"}
  F86: {cita: "Martin, Kula, Krishnan, Murphy et al. 2019, Nat Metab 1:966 (PMID 32395697). **Campo vecino: metabolómica del trasplante.** Comparan isquemia CALIENTE y FRÍA en corazón de ratón, cerdo y **humano**. La **acumulación de succinato** es el rasgo común de la isquemia en las tres especies; el frío **frena su generación** y así reduce el daño por especies reactivas de oxígeno en la reperfusión. Los periodos inevitables de isquemia caliente durante la extracción acumulan **niveles dañinos de succinato pese a enfriar lo más rápido posible**, y el daño se **atenúa con inhibidores metabólicos** que impiden su acumulación y oxidación", url: "https://pubmed.ncbi.nlm.nih.gov/32395697/", estatus: V}
  F87: {cita: "Gregory M. Fahy et al. 2004, **Cryobiology 48(1):22–35** (DOI 10.1016/j.cryobiol.2003.11.004) y **Cryobiology 48(2):157–178** (DOI 10.1016/j.cryobiol.2004.02.002). **DOS PRIMARIAS CON REVISIÓN POR PARES LEÍDAS COMPLETAS (2026-09-27): sustituyen a la referencia técnica de Alcor 2005.** (1) *Cryobiology 48:22–35*: formalización del parámetro qv* (intensidad de enlaces de hidrógeno de agua vs toxicidad), diseño de soluciones no tóxicas a alta concentración (VM3, 8.4 M), uso de PVP K12 e ice blockers (X-1000, Z-1000). (2) *Cryobiology 48:157–178*: **«Cryopreservation of organs by vitrification: perspectives and recent advances»**. Propiedades exactas de M22: concentración total 9.345 M (64.8 % w/v), pH 8.0, tonicidad 1.5×, Tm estimada −54.9 °C. **CWR < 1.0 °C/min** (límite del DSC); mWCR ≈ 0 °C/min (calentando a 1 °C/min desde bajo Tg de −124 °C no muestra endotermia de fusión). Perfusión en riñón de conejo a −22 °C durante 25 min con recalentamiento rápido simultáneo a −3 °C: función renal completa tras autotrasplante (creatinina normalizada a línea base). Riñones enfriados a −45 °C: 8 de 8 supervivientes. Biopsias DSC de subregiones: devitrificación en corteza suprimida (0.0 J/g); médula interna <2 % y pelvis <4 % de masa de hielo. Confirma estabilidad vítrea superior en tejido frente a solución desnuda a concentraciones submáximas.", url: "https://doi.org/10.1016/j.cryobiol.2004.02.002", estatus: V, cierra: "cerrada 2026-09-27: ambas primarias con revisión por pares leídas enteras (Cryobiology 48:22 y 48:157)"}
  F88: {cita: "Gilbert, Busund, Skagseth, Nilsen y Solbø 2000, **Lancet 355:375–376**, «Resuscitation from accidental hypothermia of 13·7 °C with circulatory arrest». **PDF COMPLETO LEÍDO (tanda 54).** Cronología literal: deja de moverse a las **19:00** (clínicamente muerta, RCP básica inmediata), flujo de bypass alcanzado a las **21:50**, temperatura rectal **13.7 °C a las 21:52**, fibrilación a las 22:00 que revierte sola a ritmo con pulso **15 min después**. Temperatura inicial medida al llegar: 14.4 °C. Desconectada del bypass tras **179 min**. **Es la primaria del caso que la red tenía vía F13 (revisión)**", url: "https://pubmed.ncbi.nlm.nih.gov/10665559/", estatus: V}
  F89: {cita: "Bradford, Schaffer y Talk — **NIAC Phase I, «Torpor Inducing Transfer Habitat For Human Stasis to Mars»** (SpaceWorks, resumen ejecutivo, mayo 2014; Grant NNX13AP82G). **PDF COMPLETO LEÍDO (tanda 54 + confirmado con PDF directo 2026-09-27).** Cifra literal de reducción de masa de hábitat: «Compared to the current NASA reference **TransHab** design, the torpor-enabled habitats indicated **mass reductions ranging from 52 % to 68 %**, depending on the specific configuration, for the same mission». Reducción de IMLEO: **25 % al 44 %** (literal: «IMLEO mass reductions ranging from 25% to 44% were achieved» — CORRECCIÓN: la tanda 54 anotaba «25–35 %», error de lectura; el PDF dice **44 %**, no 35 %). Con la misma masa se puede **duplicar la tripulación**. Torpor asumido: 200 días de tránsito de ida + 200 de vuelta (400 días totales). Temperatura: reducción de 5–10 °F (2.8–5.6 °C) respecto a 37 °C → rango de 31.4–34.2 °C. Soporte clínico citado: hasta **14 días** de hipotermia terapéutica continua en humanos. **Es la primaria del 52–68 % que la red tenía vía F13 (revisión) y que la auditoría de la tanda 52 señaló como no localizada**", url: "https://www.nasa.gov/wp-content/uploads/2016/04/Bradford_2013_PhI_Torpor.pdf", estatus: V}
  F90: {cita: "Dausmann, Glos y Heldmaier 2009, **J Comp Physiol B 179:345–357**, «Energetics of tropical hibernation». **ORIGINAL PAPER, PDF completo leído (tanda 55).** Mide **consumo de oxígeno y temperatura corporal de *Cheirogaleus medius* (primate malgache) EN SUS HIBERNÁCULOS NATURALES**. La temperatura del hueco del árbol y la corporal fluctúan en paralelo, y la tasa metabólica varía con ellas. En huecos bien aislados ambas se mantienen relativamente estables. **Es la primaria del lémur que V09 citaba vía F19 (resúmenes)**", url: "https://doi.org/10.1007/s00360-008-0318-0", estatus: V}
  F91: {cita: "Niu, Guan, Wang, Jiang et al., **Frontiers in Genetics**, «Aestivation induces widespread transcriptional changes in the African lungfish». **INVESTIGACIÓN ORIGINAL, PDF completo leído (tanda 55).** Transcriptoma de *Protopterus annectens* tras **6 meses de estivación** experimental. **DATO QUE CORRIGE AL MARCO:** declara que la estivación natural de *P. annectens* «lasts **seven or 8 months**, depending on the length of the dry season». **La red afirmaba 3–4 AÑOS en V11 y ninguna primaria lo sostiene**", url: "https://www.frontiersin.org/articles/10.3389/fgene.2023.1096929", estatus: V}
  F92: {cita: "Storey, Kenneth B. 2004, **Int Congr Ser 1275:47–54** (doi:10.1016/j.ics.2004.08.072), «Molecular mechanisms of anoxia tolerance». **PDF COMPLETO LEÍDO (2026-09-27).** Especie: *Trachemys scripta elegans*. Temperatura experimental: **7 °C**, 20 h de inmersión anóxica en agua burbujeada con N₂. Datos medidos: (1) **10–20 %** de tasa metabólica corporal residual en anoxia vs normoxia a la misma T corporal (citando Jackson 2001 — misma cifra que da F19); (2) reducción de **94 %** del recambio neto de ATP en hepatocitos aislados (queda el **6 %**), con la bomba Na⁺/K⁺-ATPasa pasando del 28 % al **62 %** del presupuesto de ATP, y síntesis/degradación proteica inhibidas en **>90 %**; (3) transcriptos de canales de K⁺ dependientes de voltaje en cerebro reducidos al **18.5 %** de los niveles normóxicos tras 4 h de anoxia (Prentice et al. 2003); (4) supervivencia ecológica 3–4 meses en agua fría desoxigenada (Jackson 2001). Sin datos de supervivencia a T > 16 °C. **Esta fuente confirma y detalla F19 (datos de cuerpo entero y hepatocitos) a nivel molecular; no aporta el dato de turtle22_h (22 °C)**", url: "https://doi.org/10.1016/j.ics.2004.08.072", estatus: V, cierra: "cerrada 2026-09-27: PDF leído entero; consolida y detalla los datos de F19 sobre anoxia en Trachemys"}
  F93: {cita: "Bradford, Williams, Ricano-Cadenas — **NIAC Phase II, «Advancing Torpor Inducing Transfer Habitats for Human Stasis to Mars»** (SpaceWorks, Project ID 88911, 2016–2018). **PDF COMPLETO LEÍDO (2026-09-27, ficha NASA TechPort).** Es la Fase II del proyecto cuya Fase I es F89. TRL inicio: 2; TRL final: 3. Cuatro áreas de trabajo: (i) evaluaciones médicas (inducción de torpor vía TH + TPN, pruebas en modelos animales), (ii) diseño de hábitat a Marte, (iii) extensibilidad más allá de Marte (lunas marcianas, asteroide, Júpiter, Saturno), (iv) hoja de ruta tecnológica. No incluye tablas de masa desglosadas. **Contexto para el grafo:** cierra la trayectoria tecnológica del proyecto SpaceWorks: Fase I (2014, F89) → Fase II (2018, F93). L8 ya no necesita esta fuente en deps porque F89 basta para el veredicto", url: "https://techport.nasa.gov/view/88911", estatus: V}
  F31: {cita: "Warner et al. 2023 (PMC10668850), perfusión de CPA en riñones de cerdo y humanos de 150–220 g", url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC10668850/", estatus: V}

parametros:   # valor central y rango [lo, hi]; las cotas se evalúan en las esquinas del rango
  t37:        {v: 5,      r: [4, 6],        u: "min", f: F4,  e: V, d: "ventana isquémica cerebral a 37 °C sin flujo"}
  Q10_frio:   {v: 3.5,    r: [2.52, 4.23], u: "",   f: F70, e: V, d: "Q10 del tramo FRÍO, **MEDIDO con desviación** en mitocondrias de cerebro de ratón entre 37 y 6 °C (F70): estado II 2.61 ± 0.09 y estado III 3.92 ± 0.31; el rango abarca ambas ±1 SD. El central 3.5 coincide con el tramo 15–11 °C de McCullough en humano (F4), medido de forma independiente. Antes era [P] con rango supuesto [2.05, 4.54]"}
  Q10:        {v: 2.3,    r: [2.08, 2.53],    u: "",    f: F4,  e: V, d: "Q10 metabólico cerebral humano MEDIDO: CMRO₂ por diferencia arteriovenosa yugular en n = 37 adultos. **IC 95 % = 2.08–2.53 leído en el texto completo** (pendiente media de lnCMRO₂ frente a temperatura = 0.083 ± 0.062). Nuestro rango supuesto [2.0, 2.6] era ligeramente MÁS ancho que el real: conservador. Corroboración independiente: Q10 = 2.0 citado en la literatura de trasplante (F20/L17). Control de implementación: con Q10 = 2.3 y 5 min a 37 °C, la propia fuente predice 29 min a 15 °C y nuestra C2 da 31.2 (×1.07)"}
  alpha:      {v: 1.3e-7, r: [1.0e-7, 1.6e-7], u: "m²/s", f: null, e: P, d: "difusividad térmica del CPA o tejido vítreo"}
  dT_rew:     {v: 100,    r: [80, 120],     u: "K",   f: null, e: P, d: "rango de recalentamiento peligroso (Tg → −20 °C)"}
  Tg:         {v: -123,   r: [-140, -120],  u: "°C",  f: F2,  e: P, d: "transición vítrea (el mínimo de las mezclas agua/CPA ronda −140 °C)"}
  CCR_M22:    {v: 0.1,    r: [0.05, 0.15],  u: "°C/min", f: F2, e: V, d: "velocidad crítica de enfriamiento de M22. **LAGUNA DECLARADA (tanda 51): no consta si es de SOLUCIÓN LIBRE o de TEJIDO, y la diferencia importa.** Su fuente F2 vitrificó M22 en **bolsas de crioconservación**, no en tejido. El propio marco tiene la prueba de que el efecto existe: `CCR_VS55` declara «tejido <1, solución 2.5», un factor **>2.5**, y `CCR_VMP` está etiquetada como tejido. Existe literatura (Uygun/Fahy, carga de CPA en tejido renal) que informa reducciones de **hasta ×5 en CCR** al cargar el CPA en tejido; **no se ha leído la primaria y por eso NO se mueve el valor** (R2). **Si el valor en tejido fuera ×2.5 menor, el rango sería [0.020, 0.060] y el veredicto «M22 falla en el centro del tronco» SE DARÍA LA VUELTA**: la tasa en el tronco es 0.0404 °C/min y el veredicto exige CCR_M22 > 0.0404, que el mínimo actual (0.05) sostiene por sólo ×1.24. Dirección del sesgo: si es un valor de solución, el marco es **conservador** con M22 y la frontera se mueve a su favor. **TANDA 52 — la laguna recorrida hasta el final en `20_cotas/cota_CCR_M22_tejido.py` (ningún valor movido, R2). Tres cosas que la tanda 51 no había visto:** (1) **lo que de verdad se mueve es la FRONTERA, no un veredicto suelto**: este parámetro entra en la derivada `b_CCR` y por ahí en `M_de_CCR`, `LC_viable` y `masa_viable`; con un factor de tejido ×2.5 la masa viable pasa de **10.9 a 41.9 kg** y con ×5 a **115 kg**, es decir el tronco entero entra en la región viable. (2) **La recta `b_CCR` ya mezcla etiquetas hoy**, sea cual sea la de M22: toma `CCR_VS55` en su valor de **solución** (2.5) y `CCR_VMP` etiquetado como **tejido**. Poner los tres puntos en tejido, sin tocar M22, cambia la pendiente de −1.739 a −1.518 décadas/M. **La laguna no es sólo «de qué tipo es CCR_M22»: es que la recta no declara de qué tipo es ninguno de sus tres puntos.** (3) **`red/espacio.py` tiene el 0.10 escrito a mano** en su tabla `CPAS` en vez de leerlo de `parametros`: si algún día este parámetro se etiqueta y cambia, `ESPACIO.md` no se enteraría (R4, casilla del impostor: el mismo dato en dos sitios). **Lo que NO se cae en ningún escenario:** la intersección vacía de X2 (el eje que le falta a M22 es función neural, no CCR), el requisito de 0.425 °C/min del cerebro (sale de C3 sola), el veredicto clave de C3 y el de C8 (los dos son sobre VMP) y el fallo de los NADES por ×71. **DIRECCIÓN RESUELTA (tanda 54) con F87 [P]:** a **81 % de la concentración de M22** un cerebro de conejo vitrificó **sin hielo**, y los autores declaran que esa concentración **no permanecería vitrificada como solución desnuda** ⇒ «el tejido cerebral puede ser más estable frente al hielo que la solución con la que se perfunde». **Confirma que un valor de solución es CONSERVADOR para tejido**, que es la dirección que la tanda 51 predijo. **El valor NO se mueve** (R2): F87 es organizacional y no da cifra de CCR en tejido, sólo la dirección. Lo que queda establecido es que el sesgo **no** va hacia donde rompería los veredictos. **NUEVA COTA (2026-09-27, F47 leído entero):** Fahy et al. 2026 midió DSC directamente en biopsias corticales humanas perfundidas con M22 (n=3): enfriando a **1.0 °C/min** no se detectó hielo → la CCR en corteza humana con M22 es **≤ 1.0 °C/min** (cota superior medida, no inferior). El mecanismo es la deshidratación osmótica que concentra proteínas intracelulares al 22 % p/p, suprimiendo nucleación. **Esto acota la laguna** sin resolverla: el tejido es MENOS exigente que la solución libre (0.1 °C/min), no MÁS. Factor: tejido/solución ≥ 10× (CCR_tejido ≤ 1.0, CCR_solución = 0.1). **El valor NO se mueve** (R2): el dato da CCR_tejido ≤ 1.0, que es una cota superior, no el valor exacto ni inferior; el rango actual [0.05, 0.15] sigue siendo válido como estimación de la CCR de solución libre"}
  CWR_M22:    {v: 0.4,    r: [0.3, 0.6],    u: "°C/min", f: F2, e: V, d: "velocidad crítica de calentamiento de M22. **RÉGIMEN Y CORROBORACIÓN (2026-09-27):** Fahy et al. 2004 (*Cryobiology* 48:157, leída completa hoy) y Han & Bischof corroboran de forma independiente CWR ~0.4 °C/min tras enfriamiento rápido y <1.0 °C/min tras enfriamiento lento. Un objeto grande se enfría lento por definición (C3: centro del cerebro a 0.426 °C/min), de modo que la CWR relevante en régimen lento es ~1.0 °C/min en vez de 0.4. En C1 el radio máximo recalentable por superficie pasa de 4.42 a 2.79 cm; el veredicto clave («M22 no se recalienta por superficie en el tronco, r ~15 cm») se sostiene con ambos valores. El valor se mantiene conservador."}
