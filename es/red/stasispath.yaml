  F13: {cita: "Nordeen & Martin 2019, Physiology 34:101, «Engineering Human Stasis for Long-Duration Spaceflight». **DOS PRIMARIAS LEÍDAS Y CONSOLIDADAS (2026-09-27): (1) Gilbert et al. 2000, *The Lancet* 355:375–376** (DOI 10.1016/S0140-6736(00)01021-7; PMID 10665559; F13a / F88): caso clínico de hipotermia accidental a **13.7 °C** en humana (Anna Bågenholm), asistida con RCP continuada, parada circulatoria prolongada (>3 h), recalentamiento por bypass cardiopulmonar extracorpóreo; recuperación física y cerebral completa. **(2) Bradford et al. 2014, Informe NIAC Phase I (NASA Grant NNX13AP82G) y Phase II TechPort 88911** (SpaceWorks; F13b, F13c, F89): hábitat de torpor para tránsito a Marte; reduce masa habitable del **52 % al 68 %** respecto al hábitat TransHab de referencia (de 41.5 t a 19.9 t); reducción de IMLEO 25–44 %; soporte metabólico con nutrición parenteral y enfriamiento a 31.4–34.2 °C. **Antes era [P] por ser revisión; ahora [V] por sus dos primarias leídas enteras.**", url: "https://doi.org/10.1152/physiol.00046.2018", estatus: V, cierra: "cerrada 2026-09-27: ambas primarias leídas enteras (Gilbert 2000 en The Lancet y Bradford NIAC Phase I/II)"}
