  F21: {cita: "Ozgur, Taggart, Tessier, Uygun et al. 2024, Sci Rep 14:25260. **PDF completo leído.** Congelación parcial a −15 °C con 3-OMG (depresor metabólico), **SnoMax** (nucleador), **PEG 35k** (estabilizador de membrana), trehalosa (CPA extracelular) y propilenglicol (CPA intracelular). Las tres mejoras para pasar de 5 a **10 días**: más PEG, **20 min de aclimatación durante la descongelación** para limitar el cizallamiento, y más BSA para reducir el edema. Comparado con frío estático por **trasplante SIMULADO con sangre**, no real. Referencia: el frío estático a 4 °C limita a 8–10 h", url: "https://pubmed.ncbi.nlm.nih.gov/39448774/", estatus: V}
  F22: {cita: "Botea, Năstase, Herlea, Chang, Şerban, Barcu, Rubinsky y Popescu 2023, Biochem Biophys Rep 34:101485. **PDF COMPLETO LEÍDO (tanda 46).** Primer sobreenfriamiento **isocórico** de un órgano grande: **hígado de cerdo entero a −2 °C, uno 24 h y otro 48 h, SIN congelarse** (verificado por presión en la cámara, no por inspección). Histología H&E e inmunohistoquímica **normales a las 48 h**, arquitectura indistinguible del control. Controles congelados a −2 °C durante 24 h: destrucción severa, **98 % de picnosis nuclear**. **n = 2 por brazo, estudio de viabilidad, SIN trasplante ni prueba funcional** (los propios autores lo llaman exploratorio). Cámara isocórica con solución de composición intracelular en equilibrio osmótico con el hígado", url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC10203736/", estatus: V, cierra: "cerrada en tanda 46: primaria leída (48 h isocórico sin congelar)"}
