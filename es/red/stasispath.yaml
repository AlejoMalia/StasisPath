  F37b: {cita: "Pichugin, Fahy, Morin 2006, Cryobiology 52:228–240. **PDF COMPLETO leído.** Composición exacta de **VM3 = 22.3 % DMSO + 12.86 % formamida + 16.84 % EG + 7 % PVP K12 + 1 % X-1000 + 1 % Z-1000 = 61 % p/v.** Control K⁺/Na⁺ absoluto de lonchas sin tratar = **1.1–1.5**; recuperación = 100 × (tratado/control). VM3 dio **91–108 %**. **V(EG) al 53 % permitió vitrificar sin daño por la vitrificación ni el recalentamiento en sí, pero fue mucho más dañino que al 50 %.** Recalentamiento ~2370 °C/min entre Tg y Tm sobre bloque metálico; −130 °C queda 3–4 °C bajo la Tg de VM3. Lesión por frío mitigada por **vitamina C 0.8 mM**, un aCSF más «intracelular» (menos Na y Ca, más K) y los propios solutos V(EG); con RPS-2, **0 °C protegió más que 10 °C**", url: "https://pubmed.ncbi.nlm.nih.gov/16403489/", estatus: V}
