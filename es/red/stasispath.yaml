  F19: {cita: "Datos primarios consolidados de anoxia en *Trachemys scripta* / *Chrysemys picta* (tortugas de agua dulce). **Primarias de referencia: Jackson 1968 (J Exp Biol 49:11, calorimetría de cuerpo entero en inmersión anóxica), Herbert & Jackson 1985 (Physiol Zool 58:655, supervivencia y metabolismo a distintas T), Lutz & Chih 1992 (Am J Physiol 263:R1030, depresión metabólica cerebral y channel arrest), Storey 2007 (Physiology 22:109, revisión de mecanismos regulados).** MAGNITUDES CONSOLIDADAS (aportadas por el usuario 2026-09-27, cruzadas con las primarias): cuerpo entero en anoxia a misma T corporal: ~10–20 % de la tasa aeróbica (depresión ~80–90 %); en frío (~3 °C) + anoxia: ~0.5 % del aeróbico a 20 °C, <0.01 % del mamífero comparable; supervivencia anóxica a ~3 °C: 12–18 semanas (hasta ~5.5 meses por glucógeno); supervivencia a ~16 °C: ~2 semanas; cerebro in vivo: hasta ~5 % de la tasa normóxica; cortes corticales: −37 % de calor → −30 % de uso de ATP (subestima la depresión in vivo); fase temprana (1–2 h): demanda ATP −70 a −80 %; estado mantenido: ~10–15 % del basal; actividad eléctrica cerebral: −75 a −95 %; GABA extracelular (estriado): hasta ×80; Na⁺/K⁺-ATPasa (24 h): −30 a −35 %; hepatocitos anóxicos: turnover ATP −94 %; mecanismo: channel arrest + GABA↑, depresión REGULADA (fosforilación reversible), ATP e energy charge se mantienen. NOTA METODOLÓGICA: cortes subestiman la depresión in vivo porque ya llegan deprimidos al montaje. **Lémur (F90) y pez pulmonado (F91) ya tienen primarias propias; esta ficha cubre solo la tortuga.**", url: "https://pubmed.ncbi.nlm.nih.gov/20535765/", estatus: V, cierra: "cerrada 2026-09-27: datos primarios consolidados (Jackson, Herbert & Jackson, Lutz & Chih, Storey) en vez de resúmenes; turtle22_h queda respaldado con rango [24, 36] h; F60 corrobora la ventana larga (4–5 meses a 3 °C)"}
  F20: {cita: "Calderon Novoa et al. 2026, Am J Transplant 26:91–103. **Texto completo leído.** 22 cerdos Yorkshire de 30 kg, autotrasplante, aleatorizados 11 en hielo / 11 bajo cero (plataforma CryoStasis, solución patentada no divulgada). **−2 °C sólo 5 h (n = 5+5); para 24 h (n = 3+3) y 48 h (n = 3+3) SUBIERON a −0.5 °C por riesgo de nucleación.** Sin cristales de hielo en histología; creatinina, BUN y potasio comparables (P > .05); 7 días de seguimiento, sin mortalidad", url: "https://pubmed.ncbi.nlm.nih.gov/40935342/", estatus: V}
