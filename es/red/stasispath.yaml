  F6:  {cita: "McKenzie, Thorn, Nnadi, Wróbel, Kendziorra, Farrell y Crary 2024, Free Neuropathology 5:35, «Cryopreservation of brain cell structure: a review». **PDF COMPLETO LEÍDO (tanda 46).** **Sustituye al artículo de divulgación (Asterisk Mag) que ocupaba esta ficha:** una revisión con revisión por pares es mejor fuente, pero **sigue siendo secundaria y por eso se queda en [P]** — no se sube el estatus por cambiar de fuente, sólo mejora la calidad del apoyo. Cubre el estado del arte en preservación de estructura cerebral, incluida la ASC de McIntyre y Fahy 2015", url: "https://doi.org/10.17879/freeneuropathology-2024-5883", estatus: P, cierra: "**Tanda 49: esta ficha ya no sostiene ningún veredicto.** Se retira de `deps` de V16, la única vía que la citaba: ninguno de los cuatro campos de V16 procede de F6 (todos son de F16 y F69, verificado sobre el PDF completo en `20_cotas/auditoria_aristas_tanda49.py`). La arista era un fósil del artículo de divulgación al que esta ficha sustituyó en la tanda 46. F6 se conserva como referencia de contexto (revisión leída entera), y NO se puede recolocar donde sí sería buen apoyo (G5, V17, capa E0) porque en esta red añadir una fuente [P] a un nodo [V] lo rebaja: el marco penaliza citar una revisión aunque sea correcta. Cerrarla exigiría leer las primarias que reseña, que es el trabajo que esta sesión no puede hacer"}
  F7:  {cita: "McIntyre & Fahy 2015, Cryobiology 71:448 (ASC; abstract leído: procesos fácilmente trazables y sinapsis nítidas en conejo y cerdo; EG al 65 %, −135 °C; PMID 26408851)", url: "https://pubmed.ncbi.nlm.nih.gov/26408851/", estatus: V}
  F8:  {cita: "de Vries, Uygun, Toner et al. 2019, Nat Biotechnol 37:1131 (nihms-1534583). **PDF COMPLETO LEÍDO (tanda 46).** **Hígados HUMANOS enteros sobreenfriados a −4 °C** más perfusión subnormotérmica: la vida ex vivo del órgano se alarga en **27 h** frente al límite clínico de <12 h a +4 °C. La viabilidad antes y después del sobreenfriamiento **no cambia**, y el hígado aguanta un trasplante simulado por reperfusión normotérmica con sangre ex vivo. **No hubo trasplante real.** Antecedente del mismo grupo: hígado de rata a −6 °C (F85)", url: "https://www.nature.com/articles/s41587-019-0223-y", estatus: V, cierra: "cerrada en tanda 46: primaria leída (−4 °C, +27 h)"}
  F9:  {cita: "Tisherman et al. 2016, Int J Surg (EPR para parada cardíaca traumática). **PDF COMPLETO LEÍDO (tanda 46).** **Revisión que CORROBORA de forma independiente los dos anclajes de C10:** (a) en **perro**, con lavado en la aorta abdominal distal y cerebro a **10 °C**, resultados neurológicos aceptables tras **hasta 120 min** de parada — el mismo número que F30; (b) **el límite superior de parada sin deterioro del aprendizaje ni la memoria es 60 min** — el mismo que F42 en cerdo. Añade **parámetros óptimos medidos**: objetivo timpánico **10 °C** (mejor que 5 o 15), inducción rápida a **2 °C/min** y recalentamiento gradual a **0.5 °C/min**. Cerdo (Rhee): <10 °C intracraneal en 12 min, 90 min de circulación extracorpórea de bajo flujo, **5/5 sobreviven** (1 con lesión). Cerdo con lesiones complejas y 1 h de EPR: **>75 % de supervivencia neurológicamente intacta a 6 semanas**. Perro con 2 h de shock hemorrágico y 1 h de EPR: **85 % de supervivencia** frente a 0 % con reanimación convencional", url: "https://pubmed.ncbi.nlm.nih.gov/34859446/", estatus: V, cierra: "cerrada en tanda 46: primaria leída; corrobora flush_min y pig_min"}
  F10: {cita: "Torpor de mamífero hibernante. **PDF COMPLETO LEÍDO (tanda 46):** Geiser y Kenagy 1988, Physiol Zool — duración de los episodios de torpor frente a temperatura del aire (Ta), corporal (Tb) y consumo de O2. **Resultado que el marco no tenía y que acota la vía biológica:** de Ta = 8 °C bajando a 2 °C la duración del torpor **aumenta** conforme bajan Tb y VO2, manteniéndose Tb − Ta ≈ 1.5 °C; pero **al bajar de 2 °C a −2 °C la tendencia se INVIERTE** y la duración cae, porque el animal tiene que termorregular. ⇒ **Para un hibernador hay un óptimo cerca de 2 °C: más frío NO es mejor.** Es el límite opuesto al de la vía física, donde más frío siempre ayuda (C2)", url: "https://link.springer.com/chapter/10.1007/978-3-662-04162-8_7", estatus: V, cierra: "cerrada en tanda 46: primaria leída (óptimo de torpor ~2 °C)"}
